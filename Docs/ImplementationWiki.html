<script type="application/json" id="wiki-data">{"categories":[{"id":"runtime","title":"実装仕様","description":"現在の実装を根拠に、責務・データの流れ・型・制約を確認する。"},{"id":"application","parent":"runtime","title":"Application・Window","description":"起動、メッセージ処理、固定更新とフレーム制御。"},{"id":"engine","parent":"runtime","title":"Engine・DLL境界","description":"Systemの所有、初期化・終了、APIテーブルと更新順序。"},{"id":"time","parent":"runtime","title":"Time","description":"通常・固定更新の時間値、時間倍率と非所有API。"},{"id":"ecs","parent":"runtime","title":"ECS","description":"World、Archetype、Chunk、構造変更とEntityの寿命。"},{"id":"asset","parent":"runtime","title":"Asset","description":"名前解決、CPU側の所有、画像ロードとGPU転送。"},{"id":"graphics","parent":"runtime","title":"Graphics・Shader","description":"描画提出、DX12資源と同期、Shaderとのデータ受け渡し。"},{"id":"log","parent":"runtime","title":"Log","description":"Logger、二つのpending、処理スレッドと出力の寿命。"},{"id":"common","parent":"runtime","title":"共通ライブラリ","description":"数学・色・曲線・乱数の型と演算規約。"},{"id":"guides","title":"開発ガイド・観測記録","description":"コーディング規約、ビルド時の対応と性能観測の記録。"},{"id":"design","title":"設計参考資料","description":"設計の背景、資料の出典と未確定事項。現在の実装仕様とは区別して読む。"}],"pages":[{"source":"Architecture.md","category":"design","title":"Hestia 実装リポジトリの全体構造","summary":"DevelopNotesを基に整理された全体構造と設計上の依存関係。","label":"Hestia 実装リポジトリの全体構造","order":10,"headings":[{"id":"読み方と適用範囲","text":"読み方と適用範囲","depth":2},{"id":"責務と依存方向","text":"責務と依存方向","depth":2},{"id":"system-と分野別設計の接続","text":"System と分野別設計の接続","depth":2},{"id":"所有非所有参照dll-境界","text":"所有、非所有参照、DLL 境界","depth":2},{"id":"初期化更新終了","text":"初期化、更新、終了","depth":2},{"id":"初期調査時点のコードとの差分履歴","text":"初期調査時点のコードとの差分（履歴）","depth":2}],"diagrams":[],"notes":[{"text":"設計参考資料。現行コードとの差分の節には、EngineロードやAPIが未実装だった時点の記述が残る。現在の実装状況は実装仕様の各ページを参照する。","sources":["Application/Source/Application.cpp","Engine/Source/EngineAPI.cpp"]}],"html":"\u003ch2 id=\"section-読み方と適用範囲\">読み方と適用範囲\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Architecture.md&amp;section=%E8%AA%AD%E3%81%BF%E6%96%B9%E3%81%A8%E9%81%A9%E7%94%A8%E7%AF%84%E5%9B%B2\">#\u003c/a>\u003c/h2>\n\u003cp>本書は実装の基準となる骨格を整理する。\u003cstrong>資料に明記された内容\u003c/strong>は \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Overview.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DevelopNotes/Overview\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Class/Engine\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions\u003c/a> の確認済みの記述に基づく。個別機能の設計草案は \u003ca href=\"#page=DesignSources.md\">DesignSources\u003c/a>、採用を要する事項は \u003ca href=\"#page=OpenDecisions.md\">OpenDecisions\u003c/a> に分ける。以下の構造は現行コードの実装状況を表すものではない。\u003c/p>\n\u003ch2 id=\"section-責務と依存方向\">責務と依存方向\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Architecture.md&amp;section=%E8%B2%AC%E5%8B%99%E3%81%A8%E4%BE%9D%E5%AD%98%E6%96%B9%E5%90%91\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>層\u003c/th>\n\u003cth>資料に明記された内容\u003c/th>\n\u003cth>実装リポジトリ向けの提案・留保\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Application.exe\u003c/td>\n\u003ctd>\u003ccode>Application\u003c/code> が \u003ccode>Window\u003c/code>、Engine.dll のロード状態、条件付き \u003ccode>Editor\u003c/code>、時間計測とメインループを管理する。Engine は \u003ccode>EngineAPI\u003c/code> を通して操作する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Application.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application\u003c/a>\u003c/td>\n\u003ctd>既存の \u003ccode>Application/\u003c/code> をこの入口として伸ばす。Editor の配置・接続は未確定。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Engine.dll\u003c/td>\n\u003ctd>\u003ccode>Engine\u003c/code> が各 System、Boundary API、\u003ccode>GameEngineAPI\u003c/code> を値所有し、Game.dll と GameRuntime の寿命を管理する。\u003ccode>ApplicationAPI\u003c/code> を値保持する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine\u003c/a>\u003c/td>\n\u003ctd>既存の \u003ccode>Engine/\u003c/code> に内部実装と Game 向け公開境界を置く。ファイル／ライブラリ分割は API 確定時に決める。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Game.dll\u003c/td>\n\u003ctd>GameRuntime 実体を内部に隠し、\u003ccode>GameRuntimeAPI\u003c/code> で生成・更新・破棄する。Script は \u003ccode>HestiaGame::Xxx\u003c/code> Facade を使う。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/GameRuntime.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GameRuntime\u003c/a>\u003c/td>\n\u003ctd>Game プロジェクトはまだ存在しない。ECS Plan2 の初期 C++ \u003ccode>.h/.cpp\u003c/code> 案を候補とし、GameRuntime の内部所有型は決めない。\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan2\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>呼出し方向は \u003cstrong>Application → EngineAPI → Engine\u003c/strong>、\u003cstrong>Engine → ApplicationAPI → Application\u003c/strong>、\u003cstrong>Engine → GameRuntimeAPI → GameRuntime\u003c/strong>、\u003cstrong>Game → HestiaGame Facade → Boundary API → System\u003c/strong>。Game から Application への別経路は方向だけが示され、型・操作は未確定である。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Relationships.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Relationships\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions U03\u003c/a>\u003c/p>\n\u003cp>Engine 内部の System を Game.dll に直接公開しない。\u003ccode>XxxAPI\u003c/code> が System の操作から Game に許すものだけを選び、Facade は API へ委譲する。共通の \u003ccode>ISystem\u003c/code>／\u003ccode>ISystemAPI\u003c/code> は設けず、各 System の状態は instance member に置く。private \u003ccode>s_instance\u003c/code> は自己参照用で、System 実体を返す public Getter ではない。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a>\u003c/p>\n\u003ch2 id=\"section-system-と分野別設計の接続\">System と分野別設計の接続\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Architecture.md&amp;section=system-%E3%81%A8%E5%88%86%E9%87%8E%E5%88%A5%E8%A8%AD%E8%A8%88%E3%81%AE%E6%8E%A5%E7%B6%9A\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>System\u003c/th>\n\u003cth>確認済みの位置と具体化に使う資料\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>TimeSystem\u003c/code>\u003c/td>\n\u003ctd>Engine が \u003ccode>TimeSystem\u003c/code>／\u003ccode>TimeAPI\u003c/code> を所有。\u003ccode>TimeData\u003c/code> は System が所有し、API は非所有で参照する。通常更新は \u003ccode>FrameExecute\u003c/code> 内、固定時間値は \u003ccode>FixedUpdate\u003c/code> 内で更新する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Time.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Time\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetSystem\u003c/code>\u003c/td>\n\u003ctd>System／API／Facade の位置のみ確認済み。具体的な Load 等は \u003ca href=\"../Reference/HestiaDesign/Asset/AssetManagement.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetManagement\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/AssetDB.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetDB\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/AssetType.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetType\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/Material.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Material\u003c/a> と突き合わせて採用を決める。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/AssetSystem.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Class/AssetSystem\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GraphicsSystem\u003c/code>\u003c/td>\n\u003ctd>描画状態を担う System／API／Facade の骨格があり、機能入口は追加草案。初期描画経路は Main Thread の通常経路を示す更新を優先して検討する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Subsystems.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Subsystems\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderingArchitecture.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderingArchitecture\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>InputSystem\u003c/code>\u003c/td>\n\u003ctd>Engine に届く Window Message と Game 向け入力状態を担当する草案。デバイス・状態型・問い合わせ API は未確定。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Subsystems.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Subsystems\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AudioSystem\u003c/code>\u003c/td>\n\u003ctd>再生状態を担う草案。ライブラリ、データ型、操作は未確定。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Subsystems.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Subsystems\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PhysicsSystem\u003c/code>\u003c/td>\n\u003ctd>固定更新で物理を進める草案。物理実体、World との所有関係、更新順は未確定。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Subsystems.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Subsystems\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>Engine内部のArchetype ECSはECSSystemと単一ECSWorldとして実装した。現在の所有関係・phase・生成と破棄は\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">実装仕様書のECS\u003c/a>を参照する。NativeECS／Sparse Scriptの構想は\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan1.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan1\u003c/a>と\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan2\u003c/a>にあるが、GameRuntimeの所有型とGame向けAPIは引き続き未確定。\u003ccode>WorldSystem\u003c/code>／\u003ccode>LoggerSystem\u003c/code>という別Systemは追加していない。\u003ca href=\"#page=OpenDecisions.md\">OpenDecisions\u003c/a>\u003c/p>\n\u003ch2 id=\"section-所有非所有参照dll-境界\">所有、非所有参照、DLL 境界\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Architecture.md&amp;section=%E6%89%80%E6%9C%89%E9%9D%9E%E6%89%80%E6%9C%89%E5%8F%82%E7%85%A7dll-%E5%A2%83%E7%95%8C\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Application が Engine.dll と \u003ccode>EngineHandle = void*\u003c/code> の寿命を管理する。\u003ccode>GetEngineAPI\u003c/code> の関数テーブルは Engine.dll 側が保持し、Application は非所有で参照する。Engine の生成・破棄は DLL 内の \u003ccode>Create\u003c/code>／\u003ccode>Destroy\u003c/code> に閉じる。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">EngineAPI\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Engine が System と Boundary API を値所有する。System の利用準備後、各 API の \u003ccode>Initialize(XxxSystem*)\u003c/code> で非所有ポインタを結び、\u003ccode>GameEngineAPI\u003c/code> に API への非所有ポインタを載せる。GameRuntime の実体は Game.dll 側で生成・破棄し、Engine は opaque handle と非所有の関数テーブルを保持する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Game Facade の API ポインタは非所有。\u003ccode>Bind\u003c/code>／\u003ccode>Unbind\u003c/code> は private で GameRuntime のみが実行する。GameRuntime の終了処理後に Unbind、実体破棄、その後 Game.dll Unload の順とする。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/GameRuntime.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GameRuntime\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Window の \u003ccode>HWND\u003c/code> は Application 側で保持し、Engine は member に持たず \u003ccode>ApplicationAPI::GetWindowHandle()\u003c/code> から必要時に得る。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Application.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>実装リポジトリ向けの提案\u003c/strong>：共有 Header には境界で必要な Handle、API テーブル、共有値だけを置き、内部 System／DX12 実体の型定義は分離する。Header の配置、\u003ccode>ENGINE_API\u003c/code>、STL を含む C++ 型の境界契約は未確定。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan2\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>Asset の候補設計では \u003ccode>AssetHandle&lt;T&gt;\u003c/code> は非所有の識別子、CPU Asset は Cache が所有し、DX12 Resource／Descriptor は Graphics 側が所有する。Material の正本は型付き値、GPU Layout の正本は Reflection とする。これらは \u003cstrong>分野別の設計草案\u003c/strong> であり、DevelopNotes の \u003ccode>AssetAPI\u003c/code> 公開操作としては未採用である。\u003ca href=\"../Reference/HestiaDesign/Asset/AssetType.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetType\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/Material.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Material\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/AssetSystem.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Class/AssetSystem\u003c/a>\u003c/p>\n\u003ch2 id=\"section-初期化更新終了\">初期化、更新、終了\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Architecture.md&amp;section=%E5%88%9D%E6%9C%9F%E5%8C%96%E6%9B%B4%E6%96%B0%E7%B5%82%E4%BA%86\">#\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Application が Window を作り、Engine.dll をロードして \u003ccode>GetEngineAPI\u003c/code> を取得する。\u003ccode>ApplicationAPI\u003c/code> を作成し、\u003ccode>EngineAPI::Create\u003c/code> から初期化済み EngineHandle を受け取る。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Application.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：\u003ccode>Create\u003c/code> は Engine を生成し、内部 \u003ccode>Engine::Initialize(applicationAPI)\u003c/code> を呼ぶ。Engine は System の利用準備、Boundary API の接続、GameEngineAPI の構成、Game.dll のロード、GameRuntime の生成・Facade Bind の順に進む。System に一律の \u003ccode>Initialize\u003c/code> は要求しない。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Application は Window Message を Engine／条件付き Editor に void 通知し、自身の処理後に \u003ccode>DefWindowProc\u003c/code> の値を返す。実経過時間を蓄積して固定刻みごとに \u003ccode>EngineAPI::FixedUpdate\u003c/code> を呼び、その後 \u003ccode>FrameExecute\u003c/code> を呼ぶ。Engine は Time 値を先に更新し、GameRuntime の引数なし \u003ccode>FixedUpdate\u003c/code>／\u003ccode>Update\u003c/code> へ進める。Game は \u003ccode>HestiaGame::Time\u003c/code> から時間を読む。その他の System と Editor の細かな順序は未確定。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Relationships.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Relationships\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Time.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Time\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>資料に明記された内容\u003c/strong>：Application が \u003ccode>EngineAPI::Destroy\u003c/code> を呼ぶ。Engine は GameRuntime 終了、Facade Unbind、GameRuntime 破棄、Game.dll Unload と内部終了を行い、\u003ccode>Destroy\u003c/code> 内で Engine を delete する。戻った後に Application が Engine.dll を Unload し、Window を終了する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Relationships.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Relationships\u003c/a>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>未確定事項\u003c/strong>：\u003ccode>Create\u003c/code> 失敗時の返し方と部分初期化の後片付け、各 System の生成・終了順、Editor と GPU 資源の終了順は実装前に決める。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine\u003c/a>、\u003ca href=\"#page=OpenDecisions.md\">OpenDecisions\u003c/a>\u003c/p>\n\u003ch2 id=\"section-初期調査時点のコードとの差分履歴\">初期調査時点のコードとの差分（履歴）\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Architecture.md&amp;section=%E5%88%9D%E6%9C%9F%E8%AA%BF%E6%9F%BB%E6%99%82%E7%82%B9%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E3%81%A8%E3%81%AE%E5%B7%AE%E5%88%86%E5%B1%A5%E6%AD%B4\">#\u003c/a>\u003c/h2>\n\u003cp>以下は初期整理時点の記録であり、現在の実装状況ではない。現在のコードの責務・所有・呼出順は\u003ca href=\"#page=Implementation%2FREADME.md\">実装仕様書\u003c/a>を参照する。\u003c/p>\n\u003cp>現行の \u003ca href=\"../Application/Include/Application.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.h\u003c/a> と \u003ca href=\"../Application/Source/Application.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.cpp\u003c/a> は Window・Waitable Timer・\u003ccode>ApplicationAPI\u003c/code> の一部・固定刻みループを持つが、Engine のロードと更新はコメントまたは未実装で、\u003ccode>ApplicationAPI\u003c/code> はグローバル名前空間にある。\u003ccode>GetWindowHandle\u003c/code> も未実装である。\u003ca href=\"../Engine/Source/DllMain.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DllMain.cpp\u003c/a> は DLL エントリのみで、EngineAPI や System はまだない。\u003ca href=\"../Application/Source/Window.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Window.cpp\u003c/a> と \u003ca href=\"../Application/Source/Application.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.cpp\u003c/a> の Window Message／Window 終了処理も資料の経路とは一致していない。今回はコードを変更しない。\u003c/p>\n","sources":["Architecture.md"],"sections":[]},{"source":"BuildTroubleshooting.md","category":"guides","title":"Build Troubleshooting","summary":"MSVCのProgram Database Manager不整合に関する対応記録。","label":"Build Troubleshooting","order":30,"headings":[{"id":"msvc-c1902-program-database-manager-mismatch","text":"MSVC C1902: Program Database Manager mismatch","depth":2}],"diagrams":[],"notes":[],"html":"\u003ch2 id=\"section-msvc-c1902-program-database-manager-mismatch\">MSVC C1902: Program Database Manager mismatch\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=BuildTroubleshooting.md&amp;section=msvc-c1902-program-database-manager-mismatch\">#\u003c/a>\u003c/h2>\n\u003cp>最終的な対処方針: C1902が発生した場合は、コマンド単位の承認によりSandbox外で実行する。それでも発生する場合は、実行コマンド・構成・エラー内容をユーザーへ報告して対応を相談する。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>推定原因\u003c/th>\n\u003cth>対処法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SandboxがPDB補助プロセスの起動・通信を制限している可能性\u003c/td>\n\u003ctd>ビルド・テストをコマンド単位の承認によりSandbox外で実行する。具体的な制限箇所は未特定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>コンパイラとPDB関連ツールの版の不一致・欠落\u003c/td>\n\u003ctd>同じMSVCツールセットの\u003ccode>cl.exe\u003c/code>、\u003ccode>mspdbXXX.dll\u003c/code>、\u003ccode>mspdbcore.dll\u003c/code>、\u003ccode>mspdbsrv.exe\u003c/code>を揃える。不一致・欠落があればVisual Studio Installerで修復する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>環境変数・PATHによるツール探索先の混在\u003c/td>\n\u003ctd>対象Visual StudioのDeveloper Command Promptを使い、実際のツールパスと版を確認する\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>別ツールセットで生成された古いPCH／PDB\u003c/td>\n\u003ctd>実行中のビルドを止め、対象プロジェクト・構成の中間生成物だけをClean／Rebuildする\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同じPDBへの複数ビルドからの同時アクセス\u003c/td>\n\u003ctd>同一出力先へのビルド重複を避け、プロジェクト・構成ごとに中間出力先を分ける\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>","sources":["BuildTroubleshooting.md"],"sections":[]},{"source":"CodingExamples.md","category":"guides","title":"コードとコメントの記述例","summary":"LogProcessを題材にしたヘッダー・実装・コメントの記述例。","label":"コードとコメントの記述例","order":20,"headings":[{"id":"ヘッダーの例","text":"ヘッダーの例","depth":2},{"id":"実装の例","text":"実装の例","depth":2}],"diagrams":[],"notes":[],"html":"\u003cp>\u003ca href=\"#page=CodingStandard.md\">CodingStandard\u003c/a> の書式とコメントの付け方を示す例\nLogProcess を題材に、ヘッダーと実装の一部を抜粋している\nファイルヘッダーは CodingStandard の例を参照\u003c/p>\n\u003ch2 id=\"section-ヘッダーの例\">ヘッダーの例\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingExamples.md&amp;section=%E3%83%98%E3%83%83%E3%83%80%E3%83%BC%E3%81%AE%E4%BE%8B\">#\u003c/a>\u003c/h2>\n\u003cp>公開 API の概要・引数・戻り値・前提は Doxygen で記載し、内部処理は private に配置\nクラス名や関数名は日本語へ言い換えず、コードの識別子をそのまま使用\u003c/p>\n\u003cpre>\u003ccode class=\"language-cpp\">#ifndef _LOG_PROCESS_H_\n#define _LOG_PROCESS_H_\n\n#include &lt;filesystem&gt;\n#include &lt;fstream&gt;\n#include &lt;span&gt;\n#include &lt;string_view&gt;\n\n#include &quot;Log/LogData.h&quot;\n\nnamespace Hestia\n{\n    /// @brief LogEntry の batch をファイルへ出力\n    /// @note Process と Initialize/Finalize は並行して呼ばない\n    class LogProcess\n    {\n    public:\n        /// @brief filePath をテキストログの追記先として開く\n        /// @param filePath 親フォルダが存在する出力先。空パスは無効\n        /// @return 初期化成功: true / ファイルを開けない場合や初期化済み: false\n        bool Initialize(const std::filesystem::path&amp; filePath);\n\n        /// @brief flush・close して終了\n        /// @note 終了済みの場合は何もしない\n        void Finalize();\n\n        /// @brief LogEntryをヘッダーと本文に分けて出力\n        /// @param entries 出力する LogEntry の配列\n        /// @pre Initialize に成功している\n        /// @note 本文の改行はそのまま出力。書き込み失敗はLoggerへ再記録しない\n        void Process(std::span&lt;const LogEntry&gt; entries);\n\n    private:\n        // 制御文字をエスケープして出力\n        void WriteText(std::string_view text);\n        void WriteMessage(std::string_view text);\n\n        std::ofstream m_stream;\n    };\n}\n\n#endif // _LOG_PROCESS_H_\n\u003c/code>\u003c/pre>\n\u003cp>実コード: \u003ca href=\"../Engine/Include/Log/LogProcess.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogProcess.h\u003c/a>\u003c/p>\n\u003ch2 id=\"section-実装の例\">実装の例\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingExamples.md&amp;section=%E5%AE%9F%E8%A3%85%E3%81%AE%E4%BE%8B\">#\u003c/a>\u003c/h2>\n\u003cp>単文の if は波括弧を省略し、処理できない条件は早期 return\n処理単位を空行と見出しコメントで区切り、時刻変換・重要度の変換・出力の順序を示す\n複数行の処理を持つ分岐には波括弧を使用\u003c/p>\n\u003cpre>\u003ccode class=\"language-cpp\">#include &quot;pch.h&quot;\n#include &quot;Log/LogProcess.h&quot;\n\n#include &lt;ctime&gt;\n#include &lt;iomanip&gt;\n\nnamespace Hestia\n{\n    void LogProcess::Process(std::span&lt;const LogEntry&gt; entries)\n    {\n        if (entries.empty() || !m_stream.good() || !m_stream.is_open())\n            return;\n\n        for (const auto&amp; entry : entries)\n        {\n            // 時刻の秒とミリ秒を取得\n            const auto seconds = std::chrono::floor&lt;std::chrono::seconds&gt;(entry.m_timestamp);\n            const auto milliseconds = std::chrono::duration_cast&lt;std::chrono::milliseconds&gt;(\n                entry.m_timestamp - seconds).count();\n            const std::time_t time = std::chrono::system_clock::to_time_t(seconds);\n\n            // UTC に変換\n            std::tm utc = {};\n            if (gmtime_s(&amp;utc, &amp;time) != 0)\n            {\n                m_stream.setstate(std::ios::failbit);\n                return;\n            }\n\n            // LogLevel を出力文字列に変換\n            const char* level = &quot;Log&quot;;\n            switch (entry.m_level)\n            {\n            case LogLevel::Warning: level = &quot;Warning&quot;; break;\n            case LogLevel::Error: level = &quot;Error&quot;; break;\n            case LogLevel::Fatal: level = &quot;Fatal&quot;; break;\n            case LogLevel::Log: break;\n            }\n\n            // ヘッダーを出力\n            m_stream &lt;&lt; &#39;[&#39; &lt;&lt; std::put_time(&amp;utc, &quot;%Y-%m-%dT%H:%M:%S&quot;)\n                &lt;&lt; &#39;.&#39; &lt;&lt; std::setfill(&#39;0&#39;) &lt;&lt; std::setw(3) &lt;&lt; milliseconds\n                &lt;&lt; &quot;Z] [&quot; &lt;&lt; level &lt;&lt; &quot;] [thread:&quot; &lt;&lt; entry.m_threadId &lt;&lt; &quot;] (&quot;;\n\n            WriteText(entry.m_fileName);\n            m_stream &lt;&lt; &#39;:&#39; &lt;&lt; entry.m_line &lt;&lt; &quot; &quot;;\n\n            WriteText(entry.m_functionName);\n            m_stream &lt;&lt; &quot;)\\n&quot;;\n\n            // 本文を出力\n            WriteMessage(entry.m_message);\n\n            if (!m_stream.good())\n                return;\n        }\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>実コード: \u003ca href=\"../Engine/Source/Log/LogProcess.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogProcess.cpp\u003c/a>\u003c/p>\n\u003cp>見出しだけでは分からない前提や理由は、該当する処理の近くへ短く補足\n例えば LogStorage の保持件数更新では、単なる「件数を加算」ではなく順序の理由を記載\u003c/p>\n\u003cpre>\u003ccode class=\"language-cpp\">m_pending[m_writeIndex].push(std::move(entry));\n\n// index の交換前に保持件数を反映し、LogStorage の処理側への公開と整合させる\nm_bufferedCount.fetch_add(1);\n\u003c/code>\u003c/pre>\n\u003cp>実コード: \u003ca href=\"../Engine/Source/Log/LogStorage.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogStorage.cpp\u003c/a>\u003c/p>\n","sources":["CodingExamples.md"],"sections":[]},{"source":"CodingStandard.md","category":"guides","title":"コーディング規約","summary":"名前、コメント、処理構成、includeパスの規約。","label":"コーディング規約","order":10,"headings":[{"id":"命名","text":"命名","depth":2},{"id":"インクルードガード","text":"インクルードガード","depth":2},{"id":"コメント","text":"コメント","depth":2},{"id":"処理の構成","text":"処理の構成","depth":2},{"id":"ファイルヘッダー","text":"ファイルヘッダー","depth":2},{"id":"include-パス","text":"include パス","depth":2}],"diagrams":[],"notes":[],"html":"\u003cp>この文書は Hestia リポジトリのソースコードに適用する書式を定める。設計と作業手順は \u003ca href=\"../AGENTS.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AGENTS.md\u003c/a>、改行・インデント・文字コードはルートの \u003ca href=\"../.editorconfig\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">.editorconfig\u003c/a> を参照する。\u003c/p>\n\u003cp>ヘッダーと実装の記述例は \u003ca href=\"#page=CodingExamples.md\">CodingExamples\u003c/a> を参照する。\u003c/p>\n\u003ch2 id=\"section-命名\">命名\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingStandard.md&amp;section=%E5%91%BD%E5%90%8D\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>名前空間、型、列挙型と値、関数、ファイル名は \u003ccode>UpperCamel\u003c/code> とする。\u003c/li>\n\u003cli>ローカル変数と引数は \u003ccode>lowerCamel\u003c/code>、通常メンバは \u003ccode>m_lowerCamel\u003c/code>、static メンバは \u003ccode>s_lowerCamel\u003c/code> とする。\u003c/li>\n\u003cli>マクロと名前付き定数は \u003ccode>UPPER_SNAKE_CASE\u003c/code> とする。一時的な \u003ccode>const\u003c/code>／\u003ccode>constexpr\u003c/code> ローカルは \u003ccode>lowerCamel\u003c/code> とする。\u003c/li>\n\u003cli>API テーブルの公開関数ポインタは関数と同じ \u003ccode>UpperCamel\u003c/code> とする。\u003c/li>\n\u003cli>命名規則は新規コードと変更箇所に適用し、無関係な既存コードは一括改名しない。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-インクルードガード\">インクルードガード\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingStandard.md&amp;section=%E3%82%A4%E3%83%B3%E3%82%AF%E3%83%AB%E3%83%BC%E3%83%89%E3%82%AC%E3%83%BC%E3%83%89\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>#ifndef\u003c/code>／\u003ccode>#define\u003c/code>／\u003ccode>#endif\u003c/code> 形式を使う。\u003c/li>\n\u003cli>ガード名はファイル名を大文字にし、単語の区切りに \u003ccode>_\u003c/code> を使い、先頭と末尾にも \u003ccode>_\u003c/code> を付ける。例: \u003ccode>Engine.h\u003c/code> は \u003ccode>_ENGINE_H_\u003c/code>、\u003ccode>GraphicsSystem.h\u003c/code> は \u003ccode>_GRAPHICS_SYSTEM_H_\u003c/code>。\u003c/li>\n\u003cli>PCH はプロジェクト名を先頭にした \u003ccode>_&lt;PROJECT&gt;_PCH_\u003c/code> を使う。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-コメント\">コメント\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingStandard.md&amp;section=%E3%82%B3%E3%83%A1%E3%83%B3%E3%83%88\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>コメントは日本語を基本とする。ただし、クラス名・関数名などコード上の識別子はそのまま使う。\u003ccode>LogStorage\u003c/code> を「保持先」と言い換えるなど、対応する型や処理が分かりにくくなる変換はしない。\u003c/li>\n\u003cli>句点はなるべく使わず、「設定の妥当性を確認」「残件を処理」のような短い表現で終える。\u003c/li>\n\u003cli>Doxygen を含むコメントは、原則として行コメントで記述する。\u003c/li>\n\u003cli>Doxygen コメントには \u003ccode>///\u003c/code> を使い、公開 API の概要、引数、戻り値、前提条件など利用側が必要とする契約を記述する。\u003c/li>\n\u003cli>戻り値は「成功: true / 失敗: false」のように、条件と結果を直接対応させる。\u003c/li>\n\u003cli>通常のコメントには \u003ccode>//\u003c/code> を使う。処理単位の先頭に見出し的なコメントを置き、何をしているかを短く示す。複雑な処理ほど段階ごとの見出しを増やし、流れを追いやすくする。\u003c/li>\n\u003cli>見出しだけでは伝わらない前提・理由・例外条件は必要な箇所で補足する。コードを一行ずつ言い換える説明や装飾的なコメントは避ける。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-処理の構成\">処理の構成\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingStandard.md&amp;section=%E5%87%A6%E7%90%86%E3%81%AE%E6%A7%8B%E6%88%90\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>単文の \u003ccode>if\u003c/code> は波括弧を省略し、早期 return で正常経路のインデントを浅くする。\u003c/li>\n\u003cli>関数間と意味の異なる処理単位を空行で区切る。関連する処理はまとめ、見出しコメントと合わせて構造を読み取りやすくする。\u003c/li>\n\u003cli>クラスの責務に属する内部処理は、そのクラスの private メンバ関数に置く。小さな委譲関数は素直に書く。\u003c/li>\n\u003cli>参照用の構造体・列挙体は、関連するものを一つのファイルにまとめる。値型ごとの細かなファイル分割は避ける。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-ファイルヘッダー\">ファイルヘッダー\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingStandard.md&amp;section=%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB%E3%83%98%E3%83%83%E3%83%80%E3%83%BC\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>.h\u003c/code> と \u003ccode>.cpp\u003c/code> の各ファイル先頭に、次の形式でブロックコメントを記述する。\u003c/li>\n\u003cli>\u003ccode>Date\u003c/code> はそのファイルの作成日を \u003ccode>YYYY/MM/DD\u003c/code> で記録し、\u003ccode>Author\u003c/code> は \u003ccode>Yokoyama Haruki\u003c/code> とする。\u003c/li>\n\u003cli>\u003ccode>Desc\u003c/code> はファイルの役割を簡潔に記述する。\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-cpp\">/*=============================================================================\n\n File   : Engine.h\n Desc   : Engineクラス - 各Systemと更新処理を管理する。\n\n------------------------------------------------------------------------------\n\n Date   : 2026/10/07\n Author : Yokoyama Haruki\n\n===============================================================================*/\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"section-include-パス\">include パス\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=CodingStandard.md&amp;section=include-%E3%83%91%E3%82%B9\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>同一プロジェクト内の Header は、そのプロジェクトの include path を基準にファイル名で指定する。\u003c/li>\n\u003cli>別プロジェクトの Header はリポジトリルートからのパスで指定し、依存先プロジェクトが分かるようにする。例: \u003ccode>#include &quot;Engine/Include/EngineAPI.h&quot;\u003c/code>。\u003c/li>\n\u003c/ul>\n","sources":["CodingStandard.md"],"sections":[]},{"source":"DesignSources.md","category":"design","title":"設計資料の出典と位置づけ","summary":"参照資料の出典、優先関係、設計案の位置づけ。","label":"設計資料の出典と位置づけ","order":20,"headings":[{"id":"コピーの範囲と時点","text":"コピーの範囲と時点","depth":2},{"id":"資料の優先関係","text":"資料の優先関係","depth":2},{"id":"ecs資料の追加と実装との差分","text":"ECS資料の追加と実装との差分","depth":2}],"diagrams":[],"notes":[],"html":"\u003ch2 id=\"section-コピーの範囲と時点\">コピーの範囲と時点\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=DesignSources.md&amp;section=%E3%82%B3%E3%83%94%E3%83%BC%E3%81%AE%E7%AF%84%E5%9B%B2%E3%81%A8%E6%99%82%E7%82%B9\">#\u003c/a>\u003c/h2>\n\u003cp>現在の収録先は \u003cstrong>\u003ccode>Reference/HestiaDesign/\u003c/code>\u003c/strong> であり、以下の相対リンクはこの配置を指す。31 ファイルは本リポジトリのコミット \u003ccode>3d0fb19116ad2cf2efe613b13864e82913d42495\u003c/code>（2026-10-06 16:09:59 JST）で、当時の \u003ccode>Refarence/HestiaDesign/\u003c/code> に追加された。現在の配置への移動は作業ツリー上の変更であり、このコミットに含まれない。各分野の元リポジトリのコミットや個別コピー時刻は収録資料から確認できないため、このコミットを\u003cstrong>本リポジトリで再現できる元のコピー時点\u003c/strong>とする。コミット ID と時刻は Git 履歴で確認した値である。\u003c/p>\n\u003cp>DevelopNotes の基になった外部 \u003ccode>chaba0426/Develop_Notes\u003c/code> は \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SourceNotes.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SourceNotes\u003c/a> に \u003ccode>main\u003c/code> の \u003ccode>1e76747792192b2b56abf3da0dbddf2e2d731af5\u003c/code>、確認日 2026-10-06 JST と記録されている。ただし本リポジトリの DevelopNotes は原文だけでなく会話での決定と追加草案を含む。外部リポジトリの\u003cstrong>現在\u003c/strong>の状態を確認した記録ではない。\u003c/p>\n\u003ch2 id=\"section-資料の優先関係\">資料の優先関係\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=DesignSources.md&amp;section=%E8%B3%87%E6%96%99%E3%81%AE%E5%84%AA%E5%85%88%E9%96%A2%E4%BF%82\">#\u003c/a>\u003c/h2>\n\u003cp>\u003cstrong>資料に明記された内容\u003c/strong>：全体構造は \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Overview.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DevelopNotes/Overview\u003c/a> と \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions\u003c/a> の回答済み判断を起点とする。クラス資料は \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/ClassDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ClassDesign\u003c/a> が示す概念設計で、コンパイル可能な Header ではない。分野別資料は System の用途と候補を具体化するが、未確定の Boundary API を自動で確定しない。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分野\u003c/th>\n\u003cth>参照資料\u003c/th>\n\u003cth>位置づけ\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>全体・関係\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Overview.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Overview\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Relationships.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Relationships\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions\u003c/a>\u003c/td>\n\u003ctd>所有、依存、API 接続、回答済み／未解決事項の起点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>出典・記述規則\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SourceNotes.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SourceNotes\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/ClassDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ClassDesign\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/NamingConvention.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">NamingConvention\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/_FormatTemplate.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">_FormatTemplate\u003c/a>\u003c/td>\n\u003ctd>外部出典の記録と概念宣言の書式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Application・DLL 境界\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Application.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/GameRuntime.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GameRuntime\u003c/a>\u003c/td>\n\u003ctd>メインループ、所有、EngineAPI／GameRuntimeAPI、Facade Bind の骨格。GameRuntime の内部型は仮置き。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>System 共通・時間・Editor\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/AssetSystem.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetSystem\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Subsystems.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Subsystems\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Time.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Time\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Editor.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Editor\u003c/a>\u003c/td>\n\u003ctd>Time は更新経路まで具体化。Asset／Graphics／Input／Audio／Physics の機能入口と Editor lifecycle は未採用の追加草案を含む。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Asset\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Asset/AssetDB.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetDB\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/AssetManagement.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetManagement\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/AssetType.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetType\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Asset/Material.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Material\u003c/a>\u003c/td>\n\u003ctd>名前解決、型付き Handle、CPU／GPU 所有分離、Material／Shader 移行の分野別草案。旧 Facade／GameAPI.lib 記述を DevelopNotes の API と照合する必要がある。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>描画入口・実行\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderingArchitecture.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderingArchitecture\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderingPipeLine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderingPipeLine\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderGraph.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderGraph\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DirectX/MultiThreadRendering.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">MultiThreadRendering\u003c/a>\u003c/td>\n\u003ctd>RenderItem と描画順の候補。RenderingArchitecture 冒頭は初期 Main Thread 経路を優先し、Render Thread／FramePacket と RenderGraph は後段案。MultiThreadRendering はさらに後の Build→Sort→Record 草案。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>描画資源・照明\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderTargetBudget.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderTargetBudget\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Graphics/Lighting.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Lighting\u003c/a>\u003c/td>\n\u003ctd>Format・容量の概算と Light／Shadow／Reflection 方針。計測前の見積りを実測値として使わない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shader DSL\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Graphics/MaterialShaderDSL.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">MaterialShaderDSL\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Graphics/LightingShaderDSL.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LightingShaderDSL\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/Graphics/ScreenEffectShaderDSL.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ScreenEffectShaderDSL\u003c/a>\u003c/td>\n\u003ctd>Material、ShadingModel、画面効果の契約案。最初の EngineAPI 実装の前提にはしない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ECS・Game 制作\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan1.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSArchitecture_Plan1\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSArchitecture_Plan2\u003c/a>\u003c/td>\n\u003ctd>Plan1 は NativeECS と C# Script の基本案。Plan2 は C++ Script を採用する旨を明記し、初期は通常の \u003ccode>.h/.cpp\u003c/code> と Game.dll、Generator／\u003ccode>.cscript\u003c/code> は後段とする。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>空ファイルの \u003ca href=\"../Reference/HestiaDesign/Graphics/Graphics.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Graphics.md\u003c/a> には判断根拠がない。独立した \u003ccode>Runtime/\u003c/code> と \u003ccode>Editor/\u003c/code> ディレクトリはこのコピーに存在しない。Runtime は DevelopNotes の Application／Engine／GameRuntime、\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECS Plan2\u003c/a> と描画資料、Editor は \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Editor.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Class/Editor\u003c/a> と Plan2 内の記述を参照する。コピーが参照する \u003ccode>SimpleArchitecture\u003c/code> などの未収録資料は判断根拠にしない。\u003c/p>\n\u003cp>\u003cstrong>実装リポジトリ向けの提案\u003c/strong>：判断を確定する際は、該当資料の先頭にある更新注記と OpenQuestions の回答を読み、採用した範囲を \u003ca href=\"#page=OpenDecisions.md\">OpenDecisions\u003c/a> に記録する。\u003cstrong>未確定事項\u003c/strong>：分野別資料の元コミットと未収録資料の正本は確認できていない。\u003c/p>\n\u003ch2 id=\"section-ecs資料の追加と実装との差分\">ECS資料の追加と実装との差分\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=DesignSources.md&amp;section=ecs%E8%B3%87%E6%96%99%E3%81%AE%E8%BF%BD%E5%8A%A0%E3%81%A8%E5%AE%9F%E8%A3%85%E3%81%A8%E3%81%AE%E5%B7%AE%E5%88%86\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/ECS/ECSWorld.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Class/ECS\u003c/a>の9ファイルは上記31ファイルとは別の追加資料。2026-11-05に、HestiaDesignの正本 \u003ccode>DevelopNotesDesign/Class/ECS/\u003c/code> とコピーの内容一致を確認した。正本側のコミットIDは未記録であり、この照合を元コミットの特定として扱わない。\u003c/p>\n\u003cp>コピーは概念設計のスケッチとして保持し、現在の型・API・失敗時の動作は\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">実装仕様書のECS\u003c/a>を参照する。主な具体化・差分は以下。\u003c/p>\n\u003cul>\n\u003cli>ID方式をUTF-8登録名のFNV-1a 64bit、Chunkの既定値を16KiBとして実装した。\u003c/li>\n\u003cli>Registryの検索・登録はoptionalやポインタで不在・失敗を表し、草案にあるComponentのCopy構築操作は実装していない。\u003c/li>\n\u003cli>構造変更では不足Componentを先に構築し、成功後に共通Componentをnoexcept Moveする。失敗時の逆Moveは行わない。\u003c/li>\n\u003cli>Process関数の例外は受付済み要求の反映後に現在のRunを中断する。Engineのphase接続とEndFrameの位置も実装仕様書に記載する。\u003c/li>\n\u003cli>OnAttach／OnStart、Script、Game向けAPI、初期構成指定の生成APIとPrefabは未実装。\u003c/li>\n\u003c/ul>\n","sources":["DesignSources.md"],"sections":[]},{"source":"GraphicsPerformanceNotes.md","category":"guides","title":"Graphics 初期実装の性能観測メモ","summary":"初期描画実装に対する手動計測値、原因候補と計測上の留保。","label":"Graphics 初期実装の性能観測メモ","order":40,"headings":[{"id":"目的と位置づけ","text":"目的と位置づけ","depth":2},{"id":"観測結果","text":"観測結果","depth":2},{"id":"現在のコードとの対応","text":"現在のコードとの対応","depth":2},{"id":"1-material-texture-の-commit","text":"1. Material Texture の Commit","depth":3},{"id":"2-文字列連結によるキー作成と-map-検索","text":"2. 文字列連結によるキー作成と map 検索","depth":3},{"id":"3-submit-と提出データの構築","text":"3. Submit と提出データの構築","depth":3},{"id":"描画件数による影響の目安","text":"描画件数による影響の目安","depth":2},{"id":"計測条件と不足情報","text":"計測条件と不足情報","depth":2},{"id":"次回の確認順序","text":"次回の確認順序","depth":2}],"diagrams":[],"notes":[{"text":"これは過去の観測記録。本文にはRenderDataがDXMeshを保持するという記述があるが、現在の定義はAssetHandle\u003cMesh>。当時の数値や原因候補を現在の実装の確定仕様として扱わない。","sources":["Engine/Include/Graphics/DX12Object.h"]}],"html":"\u003cp>記録日：2026/10/09\u003c/p>\n\u003ch2 id=\"section-目的と位置づけ\">目的と位置づけ\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=%E7%9B%AE%E7%9A%84%E3%81%A8%E4%BD%8D%E7%BD%AE%E3%81%A5%E3%81%91\">#\u003c/a>\u003c/h2>\n\u003cp>最小限の描画・テクスチャ表示が通った段階で、ユーザーの手動計測から見つかった CPU 側の負荷候補を記録する。正式なベンチマークや改善効果の検証ではなく、後で計測・改善するときの参考資料とする。\u003c/p>\n\u003cp>数値はユーザーの報告値であり、今回こちらで再計測していない。原因候補と改善案は確定事項ではない。この資料の作成に伴う実装変更は行わない。\u003c/p>\n\u003cp>関連設計：\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/GraphicsSystem.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GraphicsSystem\u003c/a>、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/GraphicsFrameFlow.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GraphicsFrameFlow\u003c/a>\u003c/p>\n\u003ch2 id=\"section-観測結果\">観測結果\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=%E8%A6%B3%E6%B8%AC%E7%B5%90%E6%9E%9C\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>ユーザー報告の一回あたりの時間\u003c/th>\n\u003cth>観測・原因候補\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>BindMaterial 内の Commit\u003c/td>\n\u003ctd>約 4 µs\u003c/td>\n\u003ctd>descriptor コピーの負荷が大きい可能性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SetupMaterial と呼称したキー作成・検索経路\u003c/td>\n\u003ctd>当初の観測：約 5〜10 µs\u003c/td>\n\u003ctd>追加計測では、文字列連結によるキー作成が大半を占めた\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上記経路の map 検索単体\u003c/td>\n\u003ctd>約 300〜400 ns（0.3〜0.4 µs、1 µs 未満）\u003c/td>\n\u003ctd>検索自体の負荷はキー作成より小さい\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Submit\u003c/td>\n\u003ctd>平均約 3.5 µs、観測最大約 5 µs\u003c/td>\n\u003ctd>提出データの値コピーが大きい可能性\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>時間の単位は表の各値に記載する。1 µs = 1,000 ns。最大値は今回の観測範囲内の値であり、上限保証ではない。「毎回必ず 4 µs」などの固定コストとも確定しない。\u003c/p>\n\u003cp>この三つは負荷候補として優先的に調べる価値がある。ただし、フレーム全体の占有率や GPU 時間との比較は未確認で、Graphics 全体のボトルネックと断定しない。\u003c/p>\n\u003ch2 id=\"section-現在のコードとの対応\">現在のコードとの対応\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=%E7%8F%BE%E5%9C%A8%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E3%81%A8%E3%81%AE%E5%AF%BE%E5%BF%9C\">#\u003c/a>\u003c/h2>\n\u003cp>確認対象は \u003ccode>bdc768a\u003c/code> の後の作業ツリー。計測用の未コミット変更を含むため、その commit だけでは今回確認したコードを再現できない。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>報告上の呼び方\u003c/th>\n\u003cth>確認した関数\u003c/th>\n\u003cth>留保\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>BindMaterial の Commit\u003c/td>\n\u003ctd>\u003ccode>DX12Backend::CommitMaterialTexture\u003c/code>\u003c/td>\n\u003ctd>descriptor コピー以外に handle 計算と Root Descriptor Table 設定も含む\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SetupMaterial と呼称したキー作成・検索経路\u003c/td>\n\u003ctd>\u003ccode>DX12Backend::SetupPipeline\u003c/code> が有力な対応候補\u003c/td>\n\u003ctd>パスを連結したキー作成と検索を分けて記録する。\u003ccode>BindMaterial\u003c/code> にも別の名前検索があり、関数名の対応は要確認\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Submit\u003c/td>\n\u003ctd>\u003ccode>GraphicsSystem::Submit\u003c/code> と \u003ccode>Engine::FrameExecute\u003c/code> の呼び出し側\u003c/td>\n\u003ctd>呼び出し側のタイマーには \u003ccode>RenderData\u003c/code> の構築と破棄も含む\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>参照コード：\u003ca href=\"../Engine/Source/Graphics/DX12Backend.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DX12Backend.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Graphics/GraphicsSystem.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GraphicsSystem.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Engine.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine.cpp\u003c/a>、\u003ca href=\"../Engine/Include/Graphics/DX12Object.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DX12Object.h\u003c/a>\u003c/p>\n\u003ch3 id=\"section-1-material-texture-の-commit\">1. Material Texture の Commit\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=1-material-texture-%E3%81%AE-commit\">#\u003c/a>\u003c/h3>\n\u003cp>現在の \u003ccode>BindMaterial\u003c/code> は、Material 定数の配置、Texture の各スロットへの設定、\u003ccode>CommitMaterialTexture\u003c/code> を行う。Commit では最大 16 スロットを走査し、各有効スロットについて \u003ccode>CopyDescriptorsSimple(1, ...)\u003c/code> を呼び、Master Heap から Frame の Visible Heap へコピーする。\u003c/p>\n\u003cp>未使用スロットにも Null SRV の index を設定するため、テクスチャ一枚の Material でも、現在の経路では 16 件の descriptor コピーになり得る。これは画像ピクセルや Texture 本体の転送ではなく、SRV descriptor のコピーである。\u003c/p>\n\u003cp>\u003cstrong>原因候補\u003c/strong>：一件ずつの descriptor コピー呼び出し、handle の計算、Root Descriptor Table の設定。約 4 µs の内訳は未確認。\u003ccode>BindMaterial\u003c/code> 全体の時間を Commit 単体の時間として扱わない。\u003c/p>\n\u003cp>\u003cstrong>次回の切り分け\u003c/strong>：スロット設定、descriptor コピー、Root Table 設定を別々に集計する。実 Texture 数と Null スロット数も記録し、一枚・複数枚・同じ Material の連続描画を比較する。\u003c/p>\n\u003cp>\u003cstrong>改善候補\u003c/strong>：複数 descriptor を一回の API 呼び出しでコピーする方式、同一 Texture binding の Frame 内再利用。ただし、コピー元が連続しているか、Visible Heap の範囲と Frame Fence の寿命が維持できるかを確認してから判断する。未使用スロットの Null SRV を省いてよいとはしない。\u003c/p>\n\u003ch3 id=\"section-2-文字列連結によるキー作成と-map-検索\">2. 文字列連結によるキー作成と map 検索\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=2-%E6%96%87%E5%AD%97%E5%88%97%E9%80%A3%E7%B5%90%E3%81%AB%E3%82%88%E3%82%8B%E3%82%AD%E3%83%BC%E4%BD%9C%E6%88%90%E3%81%A8-map-%E6%A4%9C%E7%B4%A2\">#\u003c/a>\u003c/h3>\n\u003cp>現在の \u003ccode>SetupPipeline\u003c/code> は VS／PS の \u003ccode>filesystem::path\u003c/code> を値で受け取り、\u003ccode>vsPath.string() + &quot;|&quot; + psPath.string()\u003c/code> で文字列キーを作ってから \u003ccode>m_PipelineCache.find\u003c/code> を行う。cache hit 後にも \u003ccode>ComPtr\u003c/code> の代入がある。\u003c/p>\n\u003cp>\u003cstrong>追加の観測結果\u003c/strong>：ユーザーの切り分け計測では、文字列連結によるキー作成が時間の大半を占め、map 検索単体は約 300〜400 ns（0.3〜0.4 µs）だった。当初の 5〜10 µs を \u003ccode>unordered_map::find\u003c/code> 単体の負荷として扱う解釈を訂正する。キー作成単体の正確な時間は未報告であり、差し引きで確定値を作らない。\u003c/p>\n\u003cp>キー作成にはパスから文字列への変換、連結、一時文字列の生成が含まれる。引数のコピーと hit 後の参照カウント操作は別の区間として確認する。cache miss では Shader 読み込みと PSO 作成も加わり、通常の cache hit とは別の処理になる。\u003c/p>\n\u003cp>\u003ccode>BindMaterial\u003c/code> の名前キャッシュは別の map である。こちらも hit と miss を分ける。Pipeline の観測値をそのまま Material の名前キャッシュに適用しない。\u003c/p>\n\u003cp>\u003cstrong>次回の切り分け\u003c/strong>：キー作成側を優先し、パスの文字列化、連結、割り当てを分けて確認する。有効な Shader パスを使って cache を warm-up し、hit／miss 件数、キー文字列の長さ、cache 件数を記録する。\u003c/p>\n\u003cp>\u003cstrong>改善候補\u003c/strong>：キーを毎 Draw で生成せず登録時に保持する方式を優先候補とする。同じ Pipeline が続く場合の検索省略、将来の Shader／Material ID への移行も候補だが、map の種類を変える根拠にはしない。どれを採用するかは未決定。現在暫定採用している Material の名前キャッシュを、この観測だけで置き換えない。\u003c/p>\n\u003ch3 id=\"section-3-submit-と提出データの構築\">3. Submit と提出データの構築\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=3-submit-%E3%81%A8%E6%8F%90%E5%87%BA%E3%83%87%E3%83%BC%E3%82%BF%E3%81%AE%E6%A7%8B%E7%AF%89\">#\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>Submit(RenderData renderData)\u003c/code> の内部は \u003ccode>m_renderQueue.push_back(std::move(renderData))\u003c/code> であり、queue への追加を明示的なコピーで行っているわけではない。それでも、呼び出し側で提出データを作るコストは残る。\u003c/p>\n\u003cp>現在の \u003ccode>RenderData\u003c/code> は World、Material、DXMesh、VS／PS パスを持つ。Material は名前文字列と Texture handle の vector、DXMesh は GPU Resource の \u003ccode>ComPtr\u003c/code> を持つ。呼び出し側が既存の Material・DXMesh から \u003ccode>RenderData{...}\u003c/code> を作る場合、Material のコピーや参照カウント操作が発生し得る。これは GPU Mesh／Texture 本体の全データをコピーする処理とは区別する。\u003c/p>\n\u003cp>確認時の \u003ccode>Engine::FrameExecute\u003c/code> は、10,000 回のループで \u003ccode>RenderData\u003c/code> を構築して Submit し、その前後を nanoseconds で計測している。そのため、約 3.5 µs の原因を Submit 関数内だけに限定しない。\u003ccode>std::move\u003c/code> を追加すれば全コストが消える、とも考えない。\u003c/p>\n\u003cp>\u003cstrong>原因候補\u003c/strong>：提出データの構築・破棄、Material 内の文字列／vector のコピー、\u003ccode>ComPtr\u003c/code> の参照カウント操作、queue の容量不足時の再確保。どれが主因かは未確認。\u003c/p>\n\u003cp>\u003cstrong>次回の切り分け\u003c/strong>：\u003ccode>RenderData\u003c/code> 構築と queue への追加を別々に集計する。queue の size／capacity、容量が増えた回数、初回と容量再利用後のフレームを分けて記録する。\u003c/p>\n\u003cp>\u003cstrong>改善候補\u003c/strong>：予測できる件数の容量確保、提出データの再利用、将来の Asset ID による提出データの縮小。提出元のデータを不用意に move して、その後の描画要求から値を失わせないこと。寿命が不明な参照に置き換える案も自動では採用しない。\u003c/p>\n\u003ch2 id=\"section-描画件数による影響の目安\">描画件数による影響の目安\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=%E6%8F%8F%E7%94%BB%E4%BB%B6%E6%95%B0%E3%81%AB%E3%82%88%E3%82%8B%E5%BD%B1%E9%9F%BF%E3%81%AE%E7%9B%AE%E5%AE%89\">#\u003c/a>\u003c/h2>\n\u003cp>報告値が同じ条件で一件ずつ発生し、件数に比例すると仮定した単純な換算。実測フレーム時間ではない。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>1,000 件\u003c/th>\n\u003cth>10,000 件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Commit：4 µs／件\u003c/td>\n\u003ctd>4 ms\u003c/td>\n\u003ctd>40 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>キー作成を含む経路：当初 5〜10 µs／件\u003c/td>\n\u003ctd>5〜10 ms\u003c/td>\n\u003ctd>50〜100 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>map 検索単体：0.3〜0.4 µs／件\u003c/td>\n\u003ctd>0.3〜0.4 ms\u003c/td>\n\u003ctd>3〜4 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Submit：平均 3.5 µs／件\u003c/td>\n\u003ctd>3.5 ms\u003c/td>\n\u003ctd>35 ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>これらの数値は、計測区間に重複がないと確認するまで合算しない。キー作成を含む経路と、その内訳である map 検索単体を合算しない。同様に \u003ccode>BindMaterial\u003c/code> 全体と、その内部の Commit を二重に数えない。\u003c/p>\n\u003ch2 id=\"section-計測条件と不足情報\">計測条件と不足情報\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=%E8%A8%88%E6%B8%AC%E6%9D%A1%E4%BB%B6%E3%81%A8%E4%B8%8D%E8%B6%B3%E6%83%85%E5%A0%B1\">#\u003c/a>\u003c/h2>\n\u003cp>現時点ではビルド構成、最適化設定、Debugger／DX12 Debug Layer の有無、CPU／GPU、実際の cache hit 率、フレーム数・サンプル数、平均値の算出方法が未記録。上記の一回あたりの報告値と、現在の計測用コードが完全に同じ条件だったかも未確認。\u003c/p>\n\u003cp>確認時のコードから、次の点に注意する。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>Draw\u003c/code> 内では各呼び出しの時間を整数 microseconds に変換してから合計している。各回の小数部分が失われるため、合計時間を最後に変換する測り方とは値が異なる。\u003c/li>\n\u003cli>\u003ccode>Draw\u003c/code> の出力値は各処理のフレーム内合計。一回あたりに換算する場合は、実際に計測した呼び出し件数を分母にする。\u003c/li>\n\u003cli>Submit のループでは一件ごとに Logger を呼ぶ。Logger はその回のタイマー区間外だが、全体の処理時間や次回の計測条件への影響は残り得る。\u003c/li>\n\u003cli>確認時の Submit の VS／PS パスは空文字列。計測用の仮入力と考えられるが、そのままでは有効な Pipeline の cache hit を測っているとは限らない。失敗経路・初回作成・通常描画を混ぜない。\u003c/li>\n\u003cli>CPU 関数の前後で測った時間は、その区間の CPU 経過時間。GPU の描画・転送完了時間や Frame 全体の性能を直接示すものではない。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-次回の確認順序\">次回の確認順序\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=GraphicsPerformanceNotes.md&amp;section=%E6%AC%A1%E5%9B%9E%E3%81%AE%E7%A2%BA%E8%AA%8D%E9%A0%86%E5%BA%8F\">#\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>有効な描画データ・Shader パスを使用し、Release と Debug を混ぜずに条件を記録する。\u003c/li>\n\u003cli>warm-up 後の複数フレームで、合計時間、成功件数、cache hit／miss、queue の容量増加をまとめて記録する。一件ごとのログ出力は別の検証として分ける。\u003c/li>\n\u003cli>Commit、キー生成／検索、RenderData 構築／Submit を切り分け、原因候補に対応する時間を確認する。\u003c/li>\n\u003cli>一つの変更候補だけを比較し、同じ件数・入力・条件で Frame 全体への効果と描画結果を確認する。\u003c/li>\n\u003c/ol>\n\u003cp>現在の目標は最小限の描画・テクスチャ表示。参考 Shader、既存の Vertex／Index Buffer 作成経路、暫定 TextureManager、Material の名前キャッシュは維持する。性能上の候補があることと、今その方式を差し替えることは別の判断とする。\u003c/p>\n","sources":["GraphicsPerformanceNotes.md"],"sections":[]},{"source":"Implementation/Application/README.md","category":"application","title":"Application・Window","summary":"起動、メッセージ処理、固定更新とフレーム制御。","label":"Application・Window","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-起動と所有","text":"起動と所有","depth":3},{"id":"document-readme-フレーム","text":"フレーム","depth":3},{"id":"document-readme-window-messageと終了","text":"Window Messageと終了","depth":3},{"id":"document-types","text":"型の解説","depth":2}],"diagrams":[],"notes":[],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Applicationの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Application/README.md\">正本Markdown\u003c/a>：Implementation/Application/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Application/Source/Application.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.cpp\u003c/a>、\u003ca href=\"../Application/Source/ApplicationAPI.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ApplicationAPI.cpp\u003c/a>、\u003ca href=\"../Application/Source/Window.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Window.cpp\u003c/a>、\u003ca href=\"../Application/Source/Main.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Main.cpp\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-readme-起動と所有\">起動と所有\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme-%E8%B5%B7%E5%8B%95%E3%81%A8%E6%89%80%E6%9C%89\">#\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>wWinMain\u003c/code> がローカルの \u003ccode>Application\u003c/code> を生成し、Initialize成功後にRun、Finalizeを呼ぶ。初期化失敗時は -1 を返す。ApplicationはWindowを値で持ち、Engine.dllのHMODULE、APIテーブルへの非所有ポインタ、EngineHandle、Waitable Timerを保持する。\u003c/p>\n\u003cp>Initializeは1600×900のWindow、高精度Waitable Timer、Engineの順に準備する。\u003ccode>LoadLibraryW(&quot;Engine.dll&quot;)\u003c/code> → \u003ccode>GetProcAddress(&quot;GetEngineAPI&quot;)\u003c/code> → API取得 → \u003ccode>Create(&amp;appAPI)\u003c/code> と進む。DLLやエントリ、API、Engineの取得失敗はfalseを返す。\u003c/p>\n\u003ch3 id=\"section-document-readme-フレーム\">フレーム\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme-%E3%83%95%E3%83%AC%E3%83%BC%E3%83%A0\">#\u003c/a>\u003c/h3>\n\u003col>\n\u003cli>steady_clockの現在時刻を取得し、Window Messageを処理する。\u003c/li>\n\u003cli>WM_QUITを受けた場合はループを抜ける。\u003c/li>\n\u003cli>前回時刻との差をdouble秒で蓄積する。\u003c/li>\n\u003cli>蓄積が固定刻み以上ならEngineのFixedUpdateを繰り返し、刻みを差し引く。\u003c/li>\n\u003cli>FrameExecuteを1回呼ぶ。DLLへ渡す時間はfloatへ変換する。\u003c/li>\n\u003cli>上限ありの場合は目標時刻まで待機する。\u003c/li>\n\u003c/ol>\n\u003cp>既定値は120FPS、固定刻み1/60秒。WaitUntilは目標の2ms前までTimerとWindow Messageを待ち、残りをbusy waitする。待機中もメッセージを処理する。固定更新回数の上限はない。FPSと固定刻みのsetterは値をそのまま受け取るため、呼び出し側が有限の正値を渡す必要がある。\u003c/p>\n\u003ch3 id=\"section-document-readme-window-messageと終了\">Window Messageと終了\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme-window-message%E3%81%A8%E7%B5%82%E4%BA%86\">#\u003c/a>\u003c/h3>\n\u003cp>WindowProcは接続済みEngineへ先に通知し、WM_CLOSEでDestroyWindow、WM_DESTROYでPostQuitMessageを呼び、最後にDefWindowProcへ渡す。Engine側のProcessMessageは現在空である。\u003c/p>\n\u003cp>\u003ccode>RequestQuit\u003c/code> はPostQuitMessageを呼ぶ。\u003ccode>UnloadEngine\u003c/code> にはDestroy、API参照解除、FreeLibraryの順の処理があるが、現在の \u003ccode>Application::Finalize\u003c/code> はWindow.Finalizeだけを呼び、UnloadEngineやTimerのCloseHandleは呼ばない。終了時にDLLとTimerまで明示解放されるという仕様にはしない。\u003c/p>\n\u003cp>Window.FinalizeはWindowクラスの登録解除とCOMの終了を行う。Windowを閉じる経路のDestroyWindowと区別する。Editorの更新箇所はコメントだけである。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Applicationの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Application/Types.md\">正本Markdown\u003c/a>：Implementation/Application/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>責務・データ・契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Application\u003c/code>\u003c/td>\n\u003ctd>Window、DLL接続、タイマー、固定更新用の蓄積秒、フレーム上限を管理。Initialize / Run / Finalizeが入口。staticのs_instanceをWindowProcから参照する\u003c/td>\n\u003ctd>\u003ca href=\"../Application/Include/Application.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Application::Clock\u003c/code>\u003c/td>\n\u003ctd>steady_clockの別名。フレーム間隔と待機時刻に使用し、ログのカレンダー時刻とは別\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Window\u003c/code>\u003c/td>\n\u003ctd>HWNDとタイトル文字列を保持。InitializeでWindowクラスとWindowを準備し、COM初期化と表示を行う。GetHandleでHWNDを借用させる\u003c/td>\n\u003ctd>\u003ca href=\"../Application/Include/Window.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Window.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Hestia::ApplicationAPI\u003c/code>\u003c/td>\n\u003ctd>context付き関数ポインタを保持する値型。FPS、無制限設定、固定刻み、終了要求、HWND取得を公開。Applicationがfriendとして接続を構成する\u003c/td>\n\u003ctd>\u003ca href=\"../Application/Include/ApplicationAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ApplicationAPI.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>ApplicationAPIをコピーしてもApplicationの所有権は移らない。contextのApplicationはAPI利用中生存している必要がある。未接続のsetterと終了要求は何もせず、数値getterは0、無制限getterはfalse、HWNDはnullptrを返す。EngineAPIの寿命は \u003ca href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-types\">Engine\u003c/a> を参照。\u003c/p>\n\u003c/section>","sources":["Implementation/Application/README.md","Implementation/Application/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Application/README.md","title":"Applicationの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Application/Types.md","title":"Applicationの型","label":"型の解説"}]},{"source":"Implementation/Asset/README.md","category":"asset","title":"Asset","summary":"名前解決、CPU側の所有、画像ロードとGPU転送。","label":"Asset","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-所有と名前解決","text":"所有と名前解決","depth":3},{"id":"document-readme-登録と転送","text":"登録と転送","depth":3},{"id":"document-readme-検証と寿命","text":"検証と寿命","depth":3},{"id":"document-types","text":"型の解説","depth":2}],"diagrams":["asset"],"notes":[],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Assetの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Asset/README.md\">正本Markdown\u003c/a>：Implementation/Asset/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Source/Asset/AssetSystem.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetSystem.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Asset/AssetLoader.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetLoader.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Asset/AssetDB.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetDB.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Asset/AssetType.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetType.cpp\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-readme-所有と名前解決\">所有と名前解決\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-readme-%E6%89%80%E6%9C%89%E3%81%A8%E5%90%8D%E5%89%8D%E8%A7%A3%E6%B1%BA\">#\u003c/a>\u003c/h3>\n\u003cp>AssetSystemはAssetDB、Mesh/Texture別のLoaderとStorageを所有し、GraphicsSystemを借用する。Graphicsが未初期化でも非nullならCPU Cacheは利用できるが、GPU転送は成功しない。現在は単一instance、対応型はMeshとTexture。\u003c/p>\n\u003cp>初期DBはTextureTestと \u003ccode>../Assets/Textures/texture_test_2048_rgba.png\u003c/code> の対応をコードで登録する。DBファイルの走査や自動importは行わない。名前はASCII英字の大小を区別せず正規化する。Loadは型別Cache、DBの有無と型の照合、Loaderの順で進み、同名の再ロードでは既存Handleを使う。\u003c/p>\n\u003ch3 id=\"section-document-readme-登録と転送\">登録と転送\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-readme-%E7%99%BB%E9%8C%B2%E3%81%A8%E8%BB%A2%E9%80%81\">#\u003c/a>\u003c/h3>\n\u003cp>MeshのRegisterは生ポインタの所有権を呼び出し時点で受け取り、unique_ptrで管理する。失敗時も所有権を消費する。空名、衝突、不正Meshなどを拒否し、CPU登録後にGPUへ転送する。GPU転送失敗でもCPU AssetとHandleを保持する。Textureの手動Registerは拒否する。MeshのファイルLoadは未対応で無効Handleを返す。\u003c/p>\n\u003cp>Texture LoaderはDirectXTexのWIC読込で単一2D画像をデコードする。配列・複数Mip等を拒否し、RGBA8 UNORMまたはsRGBへ変換する。CPU Textureを先に登録し、同じHandleでGraphicsへ画素を転送する。画素はCPU Assetに恒久保持せず、Loader内の一時画像からUpload Resourceへコピーする。\u003c/p>\n\u003ch3 id=\"section-document-readme-検証と寿命\">検証と寿命\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-readme-%E6%A4%9C%E8%A8%BC%E3%81%A8%E5%AF%BF%E5%91%BD\">#\u003c/a>\u003c/h3>\n\u003cp>Meshは位置とindexが必須。任意属性は空または位置と同数とし、index範囲と各Bufferのuint32サイズ内への収まりを検査する。三角形の幾何学的品質までは検査しない。TextureDescは正の寸法、1Mip、対応する二つのformatを条件とする。\u003c/p>\n\u003cp>Getの戻り値は非所有ポインタで、AssetSystem.Finalizeまで有効。個別unloadやslot再利用を公開する実装はない。FinalizeはCPU側のStorage/DB/Loaderを解放し、GraphicsのGPU StorageはGraphics自身が終了時に解放する。有効なCPU HandleだけではGPU登録を保証しない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Assetの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Asset/Types.md\">正本Markdown\u003c/a>：Implementation/Asset/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>データ・役割\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>AssetHandle&lt;T&gt;\u003c/code>\u003c/td>\n\u003ctd>型、index、generationによる非所有識別子。IsValidは無効indexとの比較で、Storage内の実在確認ではない\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetHandle.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetHandle.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetType\u003c/code>\u003c/td>\n\u003ctd>Mesh / TextureのDB分類\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetType.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetType.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PositionVertex\u003c/code>\u003c/td>\n\u003ctd>float3の位置\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>NormalTangentVertex\u003c/code>\u003c/td>\n\u003ctd>float3法線とfloat4接線\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PrimaryTexCoordVertex\u003c/code>\u003c/td>\n\u003ctd>float2の第一UV\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ColorVertex\u003c/code>\u003c/td>\n\u003ctd>float4頂点色\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>VertexStream\u003c/code>\u003c/td>\n\u003ctd>Position、NormalTangent、PrimaryTexCoord、ColorとCount。CPU/GPU双方のStream順\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Mesh\u003c/code>\u003c/td>\n\u003ctd>自身のHandle、各Streamのvector、uint32 index vectorを所有。IsValidで登録条件を確認\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>TextureFormat\u003c/code>\u003c/td>\n\u003ctd>RGBA8Unorm / RGBA8Srgb\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>TextureDesc\u003c/code>\u003c/td>\n\u003ctd>width、height、mipLevels、format。既定寸法0のため既定値は無効\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Texture\u003c/code>\u003c/td>\n\u003ctd>HandleとTextureDesc。画素とDX12 Resourceは保持しない\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetInfo\u003c/code>\u003c/td>\n\u003ctd>DBに登録する種別とファイルpath\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetDB.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetDB.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetDB\u003c/code> / \u003ccode>EntryMap\u003c/code>\u003c/td>\n\u003ctd>正規化した名前とAssetInfoの索引。空名・空path・未対応型・正規化後衝突を拒否\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetStorage&lt;T&gt;\u003c/code>\u003c/td>\n\u003ctd>名前索引とCPU実体の所有者。Getでindexとgenerationを照合\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetStorage.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetStorage.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetStorage&lt;T&gt;::Slot\u003c/code>\u003c/td>\n\u003ctd>unique_ptrとgenerationを組にして保持する内部要素\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetLoader&lt;Mesh&gt;\u003c/code>\u003c/td>\n\u003ctd>ファイル読込の境界。現在は未対応をログ出力する\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetLoader.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetLoader.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetLoader&lt;Texture&gt;\u003c/code>\u003c/td>\n\u003ctd>Graphicsを借用し、WICデコード・変換・CPU登録・GPU転送を担当\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetSystem\u003c/code>\u003c/td>\n\u003ctd>DB、Loader、Storageを所有する統括。static入口を現在instanceへ接続する\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetSystem.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetSystem.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AssetAPI\u003c/code>\u003c/td>\n\u003ctd>AssetSystemへの非所有参照を持つDLL API。未接続Load/Registerは無効Handle、Getはnullptr。Registerの所有権は失敗時も消費\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Asset/AssetAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetAPI.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003c/section>","sources":["Implementation/Asset/README.md","Implementation/Asset/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Asset/README.md","title":"Assetの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Asset/Types.md","title":"Assetの型","label":"型の解説"}]},{"source":"Implementation/Common/README.md","category":"common","title":"共通ライブラリ","summary":"数学・色・曲線・乱数の型と演算規約。","label":"共通ライブラリ","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-数学の規約","text":"数学の規約","depth":3},{"id":"document-readme-curvecolorrandom","text":"Curve、Color、Random","depth":3},{"id":"document-types","text":"型の解説","depth":2},{"id":"document-types-ベクトル行列回転","text":"ベクトル・行列・回転","depth":3},{"id":"document-types-曲線色乱数","text":"曲線・色・乱数","depth":3}],"diagrams":[],"notes":[],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Commonの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Common/README.md\">正本Markdown\u003c/a>：Implementation/Common/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>CommonはSystemの更新周期を持たない共通ライブラリであり、値型とheader内の演算を中心に構成する。\u003ca href=\"../Common/Include/HMath.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">HMath.h\u003c/a> が数学型の入口、\u003ca href=\"../Common/Include/Math/MathCommon.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">MathCommon.h\u003c/a> が定数・基本数学関数、\u003ca href=\"../Common/Include/Math/SimdInterop.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SimdInterop.h\u003c/a> が通常型とSIMD型の相互運用を担う。\u003c/p>\n\u003ch3 id=\"section-document-readme-数学の規約\">数学の規約\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-readme-%E6%95%B0%E5%AD%A6%E3%81%AE%E8%A6%8F%E7%B4%84\">#\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"../Common/Include/Math/Matrix4x4.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Matrix4x4.h\u003c/a> の規約はrow-major、行ベクトル \u003ccode>v * M\u003c/code>、\u003ccode>m[row][column]\u003c/code>、左手系。SRTは \u003ccode>S * R * T\u003c/code>、親子は \u003ccode>Local * ParentWorld\u003c/code>。GraphicsのView/Projectionもこの規約で渡す。既定構築したMatrix4x4はゼロであり、単位行列が必要ならIdentityを使う。\u003c/p>\n\u003cp>通常のVector/Matrix/Quaternion型は保存・一般演算を担い、SIMD型はSIMD演算と通常型へのLoad/Store等を提供する。行参照proxyやSIMD内部表現を永続化用のファイル形式として扱わない。投影のnear/far等の前提は各関数のassert・契約に従う。\u003c/p>\n\u003ch3 id=\"section-document-readme-curvecolorrandom\">Curve、Color、Random\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-readme-curvecolorrandom\">#\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"../Common/Include/Math/Curve.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Curve.h\u003c/a> はキー時刻を0〜1へ収めて並べ、Evaluate時刻も0〜1へ収める。空ならT{}、単一キーならその値、範囲端なら端の値を返し、内部区間を制御値による補間で評価する。Curve&lt;float&gt;の既定構築は0→1のキーを持つ。Vector3/Color版は成分別のCurve&lt;float&gt;をまとめる。\u003c/p>\n\u003cp>\u003ca href=\"../Common/Include/Color.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Color.h\u003c/a> はRGBAとHSVの変換、色の演算を提供する。成分演算を行うため、すべての操作が自動的に0〜1へ制限されるとは扱わない。\u003c/p>\n\u003cp>\u003ca href=\"../Common/Include/Random.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Random.h\u003c/a> は関数内staticのrandom_deviceとmt19937を使う。float Rangeは実数分布、int Rangeは両端を含む整数分布。InsideUnitSphereは最大32回の棄却試行後Upを返し、OnUnitSphereは小さいベクトルの場合もUpを返す。RandomConeは角度を度で受け、方向周りの円錐内方向を生成する。公開seed設定・状態保存・thread別engineは実装されていない。\u003c/p>\n\u003cp>DLL export/importとWindowsのinclude設定は \u003ca href=\"../Common/Include/DllAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DllAPI.h\u003c/a>、\u003ca href=\"../Common/Include/WindowsHeaders.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">WindowsHeaders.h\u003c/a> に集約する。これらは型を持つSystemではない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Commonの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Common/Types.md\">正本Markdown\u003c/a>：Implementation/Common/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-types-ベクトル行列回転\">ベクトル・行列・回転\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-types-%E3%83%99%E3%82%AF%E3%83%88%E3%83%AB%E8%A1%8C%E5%88%97%E5%9B%9E%E8%BB%A2\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>役割・表現\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Vector2\u003c/code>\u003c/td>\n\u003ctd>floatのx/y。2次元の成分演算、長さ、正規化、補間等\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Vector2.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Vector2.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Vector3\u003c/code>\u003c/td>\n\u003ctd>floatのx/y/z。3次元方向・位置、内積・外積等\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Vector3.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Vector3.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Vector4\u003c/code>\u003c/td>\n\u003ctd>floatのx/y/z/w。4成分・同次座標等\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Vector4.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Vector4.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Vector2_SIMD\u003c/code>\u003c/td>\n\u003ctd>2成分Vector演算のSIMD版\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Vector2_SIMD.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Vector2_SIMD.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Vector3_SIMD\u003c/code>\u003c/td>\n\u003ctd>3成分Vector演算のSIMD版\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Vector3_SIMD.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Vector3_SIMD.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Vector4_SIMD\u003c/code>\u003c/td>\n\u003ctd>4成分Vector演算のSIMD版\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Vector4_SIMD.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Vector4_SIMD.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Matrix3x3\u003c/code>\u003c/td>\n\u003ctd>3×3行列の値型。積、転置、逆行列など\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Matrix3x3.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Matrix3x3.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Matrix4x4\u003c/code>\u003c/td>\n\u003ctd>float m[4][4]。行ベクトル変換、SRT、View/Projection生成等\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Matrix4x4.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Matrix4x4.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Matrix3x3_SIMD\u003c/code>\u003c/td>\n\u003ctd>3×3行列演算のSIMD版\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Matrix3x3_SIMD.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Matrix3x3_SIMD.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Matrix4x4_SIMD\u003c/code>\u003c/td>\n\u003ctd>4×4行列演算のSIMD版。Graphicsの定数にも使用\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Matrix4x4_SIMD.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Matrix4x4_SIMD.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Matrix3x3_SIMD::RowReference\u003c/code> / \u003ccode>ConstRowReference\u003c/code>\u003c/td>\n\u003ctd>SIMD内部の行を添字経由で読み書きするproxy / 読み取りproxy。所有行列の寿命に依存\u003c/td>\n\u003ctd>同上の3×3定義\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Matrix4x4_SIMD::RowReference\u003c/code> / \u003ccode>ConstRowReference\u003c/code>\u003c/td>\n\u003ctd>4×4版の行参照proxy / 読み取りproxy\u003c/td>\n\u003ctd>同上の4×4定義\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Quaternion\u003c/code>\u003c/td>\n\u003ctd>floatの回転四元数。積、正規化、回転生成・補間等\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Quaternion.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Quaternion.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Quaternion_SIMD\u003c/code>\u003c/td>\n\u003ctd>回転四元数のSIMD版\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Quaternion_SIMD.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Quaternion_SIMD.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch3 id=\"section-document-types-曲線色乱数\">曲線・色・乱数\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-types-%E6%9B%B2%E7%B7%9A%E8%89%B2%E4%B9%B1%E6%95%B0\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>役割・契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Curve&lt;T&gt;\u003c/code>\u003c/td>\n\u003ctd>vector&lt;Key&gt;を所有し、キー編集、時刻正規化、評価、stream入出力を提供\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Math/Curve.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Curve.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Curve&lt;T&gt;::Key\u003c/code>\u003c/td>\n\u003ctd>value、time、inControl、outControl。値だけ指定すると制御値も同じ値になる\u00
