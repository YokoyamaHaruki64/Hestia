3c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>CurveVector3\u003c/code>\u003c/td>\n\u003ctd>x/y/zごとのCurve&lt;float&gt;を所有し、Vector3として評価\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>CurveColor\u003c/code>\u003c/td>\n\u003ctd>RGBA成分ごとの曲線をまとめ、Colorとして評価\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ColorHSV\u003c/code>\u003c/td>\n\u003ctd>h/s/v/a。既定値はh/s/v=0、a=1\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Color.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Color.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Color\u003c/code>\u003c/td>\n\u003ctd>r/g/b/a。既定は不透明白。成分演算、色生成、HSV変換など\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Random\u003c/code>\u003c/td>\n\u003ctd>staticの範囲乱数・球内/球面/円錐方向生成。mt19937は内部共有状態\u003c/td>\n\u003ctd>\u003ca href=\"../Common/Include/Random.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Random.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>Math名前空間とSIMD相互変換関数は型ではないが、演算規約の構成要素として \u003ca href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a> に含める。各演算の詳細な引数・戻り値・assert条件はリンク先の宣言と実装に対応する。\u003c/p>\n\u003c/section>","sources":["Implementation/Common/README.md","Implementation/Common/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Common/README.md","title":"Commonの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Common/Types.md","title":"Commonの型","label":"型の解説"}]},{"source":"Implementation/ECS/README.md","category":"ecs","title":"ECS","summary":"World、Archetype、Chunk、構造変更とEntityの寿命。","label":"ECS","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-所有と初期化","text":"所有と初期化","depth":3},{"id":"document-readme-記憶構造","text":"記憶構造","depth":3},{"id":"document-readme-entityの生成と破棄","text":"Entityの生成と破棄","depth":3},{"id":"document-readme-構造変更","text":"構造変更","depth":3},{"id":"document-readme-エラーと未実装範囲","text":"エラーと未実装範囲","depth":3},{"id":"document-readme-検証記録2026-11-05","text":"検証記録（2026-11-05）","depth":3},{"id":"document-types","text":"型の解説","depth":2},{"id":"document-types-識別と標準component","text":"識別と標準Component","depth":3},{"id":"document-types-型登録と配置","text":"型登録と配置","depth":3},{"id":"document-types-統括","text":"統括","depth":3},{"id":"document-process","text":"Process実行と型","depth":2},{"id":"document-process-関数の契約","text":"関数の契約","depth":3},{"id":"document-process-検索実行","text":"検索・実行","depth":3},{"id":"document-process-型一覧","text":"型一覧","depth":3}],"diagrams":["ecs-process","ecs-layout","ecs-life"],"notes":[{"text":"Entityの実行対象はComponent構成から決まり、Process所属一覧は持たない。共有ComponentだけならRemoveProcess後も対象Processが一致し続ける。初期構成指定の生成APIとPrefabは将来案。","sources":["Docs/Implementation/ECS/README.md","Docs/OpenDecisions.md"]}],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>ECSの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/ECS/README.md\">正本Markdown\u003c/a>：Implementation/ECS/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types\">型\u003c/a> / \u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process\">Process実行\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Source/ECS/ECSSystem.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSSystem.cpp\u003c/a>、\u003ca href=\"../Engine/Source/ECS/ECSWorld.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSWorld.cpp\u003c/a>、\u003ca href=\"../Engine/Source/ECS/Archetype.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Archetype.cpp\u003c/a>、\u003ca href=\"../Engine/Source/ECS/Chunk.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Chunk.cpp\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-readme-所有と初期化\">所有と初期化\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E6%89%80%E6%9C%89%E3%81%A8%E5%88%9D%E6%9C%9F%E5%8C%96\">#\u003c/a>\u003c/h3>\n\u003cp>EngineがECSSystemを所有し、ECSSystemがComponentRegistryと単一ECSWorldを所有する。WorldはRegistryを借用し、ArchetypeとProcessを所有する。Archetypeは共通LayoutとChunk群を所有する。LayoutのComponentInfoはRegistryへの非所有参照なので、終了はWorld → Registryの順になる。\u003c/p>\n\u003cp>既定Chunkサイズは16KiB。ECSSystem.InitializeはprivateのRegisterECSを呼び、Name、Tag、LayerをUTF-8の型名で登録してからWorldを初期化する。登録関数を外部から渡す仕組みと、System／Worldを返すpublic Getterはない。通常のEntity操作はECSSystemのstatic APIからWorldへ委譲する。\u003c/p>\n\u003cp>Engine内のComponentとProcessの登録はRegisterECSへ追加する。Componentを先に登録し、m_world.RegisterProcess&lt;Function&gt;(phase)の結果を確認する。現在は必須3 Componentだけが登録され、具体的な更新・描画Processはまだない。World単体では初回のEntity生成・Run・EndFrameまで登録を受け付けるが、ECSSystemの通常APIに動的Process登録口はない。\u003c/p>\n\u003ch3 id=\"section-document-readme-記憶構造\">記憶構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E8%A8%98%E6%86%B6%E6%A7%8B%E9%80%A0\">#\u003c/a>\u003c/h3>\n\u003cp>ArchetypeSignatureはComponentTypeIdを昇順に揃えた集合。ArchetypeはEntity列を先頭に置き、その後に型別SoA列を配置する。各列のalignmentとpaddingを含めてChunkに収まる最大行数を二分探索する。登録されていない型、重複型、0容量、1Entityも収まらない配置は構築失敗となる。\u003c/p>\n\u003cp>Chunk内ではEntity列と各Component列の同じrowが同じEntityを表す。Worldのslot表はHandleをArchetype/Chunk/rowへ解決する。移行・行詰め時にslotも更新するため、EntityとComponentの生ポインタを構造変更越しに保持しない。\u003c/p>\n\u003ch3 id=\"section-document-readme-entityの生成と破棄\">Entityの生成と破棄\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-entity%E3%81%AE%E7%94%9F%E6%88%90%E3%81%A8%E7%A0%B4%E6%A3%84\">#\u003c/a>\u003c/h3>\n\u003cp>CreateEntityはslotとHandleを予約し、Name／Tag／Layerだけを持つArchetypeへ生成する。初期値はactiveがON、NameがEntity{index}、TagとLayerが0。Process実行外では即時構築し、実行中はPendingCreateのHandleを返す。反映前のGetEntity/GetComponentはnullptr。生成待ちへの追加・削除はCreateの後に要求順で適用する。\u003c/p>\n\u003cp>生成待ちへのDestroyは生成取消となる。FlushChangesは取消要求を先に処理し、Componentを構築せずslotを解放してgenerationを進める。これにより同じHandleのCreateと後続要求を無効化する。\u003c/p>\n\u003cp>生存中EntityへのDestroyは破棄予約bitだけを設定し、activeの設定値は変更しない。実体とComponentはEndFrameまで残るが、IsActiveはfalseになる。予約後の追加・削除と保留済みの構成変更は適用しない。EndFrameで実体を破棄し、同じChunkの末尾行で穴を埋め、移動したEntityのslotを更新する。解放したslotのgenerationは0を飛ばして進める。古いHandleは世代照合で拒否し、全世代周回後の再一致は許容する。\u003c/p>\n\u003ch3 id=\"section-document-readme-構造変更\">構造変更\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E6%A7%8B%E9%80%A0%E5%A4%89%E6%9B%B4\">#\u003c/a>\u003c/h3>\n\u003cp>AddProcessは不足する要求Componentを追加し、既存値を維持する。EntityにProcess所属一覧は持たせず、Component構成だけで実行対象を決めるため、別Processの条件も揃えばそのProcessも対象になる。Processが要求しないComponentも保存する。\u003c/p>\n\u003cp>RemoveProcessは対象Processの要求から、必須Componentと現在一致する他Processの要求を除いて削除する。保護対象は全登録Processではなく、変更前のArchetypeと一致するものだけ。固有Componentがなければ構成が変わらず、削除対象Processも一致したままになる。\u003c/p>\n\u003cp>移行は次の順序で行う。\u003c/p>\n\u003col>\n\u003cli>移行先ArchetypeとChunkの空き行を用意し、Entityの識別子と状態bitを複製する。\u003c/li>\n\u003cli>不足Componentを先に既定構築する。失敗したら構築済みの不足分と移行先Entityだけを片付ける。移行元とslotは変更せず、逆Moveは行わない。\u003c/li>\n\u003cli>構築成功後、共通Componentをnoexcept Moveし、削除対象を含む移行元のComponentを破棄する。\u003c/li>\n\u003cli>移行先行を確定してslotを更新し、元行をSwap Removeする。行順は保証しない。\u003c/li>\n\u003c/ol>\n\u003cp>Process実行中は生成・追加・削除をChangeRequestに積み、現在のProcessが全Chunkを処理し終えた後に反映する。Entity破棄の確定時点はそれとは別のEndFrame。構造変更中の借用取得や再入処理には状態による制限がある。並列ジョブ実行の仕組みは実装されていない。\u003c/p>\n\u003cp>EngineはTime更新後に各phaseを呼ぶ。FixedUpdateでは同名phase、FrameExecuteではFrameBegin → Update → LateUpdate → PreRender、描画後にEndFrameを実行する。終了時はECSをAsset／Graphics／Timeより先に解放し、Logは最後まで利用できる。\u003c/p>\n\u003ch3 id=\"section-document-readme-エラーと未実装範囲\">エラーと未実装範囲\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E3%82%A8%E3%83%A9%E3%83%BC%E3%81%A8%E6%9C%AA%E5%AE%9F%E8%A3%85%E7%AF%84%E5%9B%B2\">#\u003c/a>\u003c/h3>\n\u003cp>通常の不正操作はLoggerと戻り値で通知する。Componentの既定構築は例外を許容し、Move構築と破棄はnoexceptを要求する。Componentの構築・Move・破棄からECS操作を呼ばないことを前提とする。生成失敗では予約slotを解放し、構造変更失敗では元Entityを維持する。要求ごとに失敗を処理し、後続要求は継続する。\u003c/p>\n\u003cp>Process登録、ArchetypeのProcess接続、構造変更要求、Component構築、Process実行に例外境界がある。ECSSystem.Initialize自体はRegisterECSをtry/catchで囲まない。標準コンテナの確保例外を全APIで捕捉する設計ではなく、CreateEntityのslot予約やProcess実行外の破棄キュー確保からは例外が伝播し得る。\u003c/p>\n\u003cp>OnAttach／OnStart、並列ジョブ、Game向けAPI、Script、Prefabと初期構成指定の生成APIは未実装。生成APIとPrefabの案は\u003ca href=\"#page=OpenDecisions.md&amp;section=%E5%B0%86%E6%9D%A5%E6%A1%88ecs%E3%81%AE%E5%88%9D%E6%9C%9F%E6%A7%8B%E6%88%90%E6%8C%87%E5%AE%9A%E3%81%A8prefab%E5%BE%A9%E5%85%83\">OpenDecisions\u003c/a>に留保する。\u003c/p>\n\u003ch3 id=\"section-document-readme-検証記録2026-11-05\">検証記録（2026-11-05）\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E6%A4%9C%E8%A8%BC%E8%A8%98%E9%8C%B22026-11-05\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>対象\u003c/th>\n\u003cth>結果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>VerifyProject -Project Engine\u003c/td>\n\u003ctd>Debug_Editor・x64で成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunTests -Filter &#39;ECSFixture.\u003cem>:ECSSystem.\u003c/em>:ComponentRegistry.*&#39;\u003c/td>\n\u003ctd>Test・x64で19件成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RunTests全体\u003c/td>\n\u003ctd>80件中75件成功。Engine生成を前提とする4件がnull、LogSystemの並列出力件数1件が512対256で失敗。原因は未確定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>構築失敗テストは、移行元の値と構成を維持し、Move回数が増えないことを確認した。GPU描画・Window操作・四構成ビルドの成立はこの記録に含めない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>ECSの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/ECS/Types.md\">正本Markdown\u003c/a>：Implementation/ECS/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a> / \u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process\">Process型\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-types-識別と標準component\">識別と標準Component\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types-%E8%AD%98%E5%88%A5%E3%81%A8%E6%A8%99%E6%BA%96component\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>データ・契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>EntityHandle\u003c/code>\u003c/td>\n\u003ctd>uint32 indexとgeneration。indexは下位30bitのみ、generation 0は無効。生成元World内の識別子でWorld識別を内包しない\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/Entity.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Entity.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Entity\u003c/code>\u003c/td>\n\u003ctd>index30bit、active/破棄予約の各1bit、generation32bit。合計8byte。IsActiveはactiveかつ未破棄予約を意味する\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>EntitySlotState\u003c/code>\u003c/td>\n\u003ctd>Free / PendingCreate / Alive。破棄予約はEntity側のbitで表す\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>EntitySlot\u003c/code>\u003c/td>\n\u003ctd>generation、状態、Archetype*、Chunk*、row。現在位置を表すWorld内部データ\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Name\u003c/code>\u003c/td>\n\u003ctd>std::stringのm_value。必須Component\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/Component.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Component.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Tag\u003c/code>\u003c/td>\n\u003ctd>uint32のm_value、既定0。必須Component\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Layer\u003c/code>\u003c/td>\n\u003ctd>uint32のm_value、既定0。必須Component。衝突マスク等の用途を実装以上に規定しない\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch3 id=\"section-document-types-型登録と配置\">型登録と配置\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types-%E5%9E%8B%E7%99%BB%E9%8C%B2%E3%81%A8%E9%85%8D%E7%BD%AE\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>データ・契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ComponentTypeId\u003c/code>\u003c/td>\n\u003ctd>uint64の型ID。明示したUTF-8登録名をFNV-1a 64bitでハッシュ化し、名前変更後の互換性は保証しない\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/ComponentRegistry.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ComponentRegistry.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ComponentInfo\u003c/code>\u003c/td>\n\u003ctd>ID、名前、size、alignment、既定構築・破棄・Move構築の関数ポインタ\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ComponentRegistry\u003c/code>\u003c/td>\n\u003ctd>ID→情報とC++ type_index→IDを所有。同型同名の再登録は同じID、別名・別型・ID衝突は拒否\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ArchetypeSignature\u003c/code>\u003c/td>\n\u003ctd>昇順の型ID vector。同一構成を識別\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/Archetype.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Archetype.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ComponentLayout\u003c/code>\u003c/td>\n\u003ctd>型ID、列のbyte offset、Registry内ComponentInfoへの参照\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ChunkLayout\u003c/code>\u003c/td>\n\u003ctd>byteサイズ、最大row数、全体alignment、各列Layout\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Archetype\u003c/code>\u003c/td>\n\u003ctd>signature、共通Layout、Chunk群を所有し、空きChunkの選択と列番号検索を担当\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Chunk\u003c/code>\u003c/td>\n\u003ctd>固定byte領域を所有しEntityとComponentをSoA配置。構築、Move、破棄、行数の確定をWorldから利用する\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/Chunk.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Chunk.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>Registryが受理するComponentは既定構築可能、Move構築と破棄がnoexceptの型。const/volatile修飾した型の登録は受け付けない。GetIdは型のcvを除いて検索する。既定構築は失敗し得るため、Worldの移行処理は構築途中の後片付けも扱う。\u003c/p>\n\u003ch3 id=\"section-document-types-統括\">統括\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types-%E7%B5%B1%E6%8B%AC\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>データ・契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ECSSettings\u003c/code>\u003c/td>\n\u003ctd>Chunk byteサイズ。既定16×1024\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/ECSSystem.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSSystem.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSSystem\u003c/code>\u003c/td>\n\u003ctd>Registryと単一Worldの所有者。初期化状態と登録期間を管理\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSWorld\u003c/code>\u003c/td>\n\u003ctd>Registryを借用し、slot表、Archetype、Process、構造変更要求、破棄予約を所有\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/ECS/ECSWorld.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSWorld.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSWorld::ChangeKind\u003c/code>\u003c/td>\n\u003ctd>Create / AddProcess / RemoveProcess / CancelCreateの内部要求区分\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSWorld::ChangeRequest\u003c/code>\u003c/td>\n\u003ctd>対象Handle、Process共通入口、要求区分\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ScopedFlag\u003c/code>\u003c/td>\n\u003ctd>boolへの非所有参照と変更前の値。構築時にtrueへ設定し、スコープ終了時に元の値へ戻す内部RAII型\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Source/ECS/ECSWorld.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSWorld.cpp\u003c/a>の無名名前空間\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ScopeExit&lt;Function&gt;\u003c/code>\u003c/td>\n\u003ctd>Releaseされなければスコープ終了時にnoexceptの後始末を実行する内部RAII型。ApplyCreateの部分構築の解放に使用\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>System終了はProcess実行中、構造変更適用中、EndFrame処理中には拒否される。GetEntity/GetComponentのnullは未接続、無効Handle、生成待ち、Component不在等で起こる。実在をHandle.IsValidだけで判定しない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-process\">\u003ch2>ECS Processの実行と型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/ECS/Process.md\">正本Markdown\u003c/a>：Implementation/ECS/Process.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a> / \u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types\">Entity・配置の型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Include/ECS/ECSProcessExecution.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSProcessExecution.h\u003c/a>、\u003ca href=\"../Engine/Include/ECS/ECSProcess.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSProcess.h\u003c/a>、\u003ca href=\"../Engine/Source/ECS/ECSProcess.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSProcess.cpp\u003c/a>、\u003ca href=\"../Engine/Include/ECS/ECSWorld.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ECSWorld.h\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-process-関数の契約\">関数の契約\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process-%E9%96%A2%E6%95%B0%E3%81%AE%E5%A5%91%E7%B4%84\">#\u003c/a>\u003c/h3>\n\u003cp>Process関数はfree関数またはstatic関数で、\u003ccode>void(size_t count, const Entity* entities, Components*...)\u003c/code> 形式。noexcept付きも扱う。Component引数はSoA列の先頭を指し、count行分の対応する配列として使用する。const Component*はRead、それ以外はWriteとして記録する。EntityをComponentとして要求することと、ポインタ型そのものをComponentとすることはstatic_assertで拒否する。同一型やconst違いの重複要求は、ECSProcess::Create時に型IDで検査し、ログを出して生成を拒否する。\u003c/p>\n\u003cp>受け渡すcountにはinactiveと破棄予約済みEntityも含まれる。処理対象をactiveだけにする場合は、関数内で各Entity.IsActiveを確認する。実行器がactive行だけに圧縮して渡す仕様ではない。\u003c/p>\n\u003ch3 id=\"section-document-process-検索実行\">検索・実行\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process-%E6%A4%9C%E7%B4%A2%E5%AE%9F%E8%A1%8C\">#\u003c/a>\u003c/h3>\n\u003cp>登録時に関数型から要求型IDとRead/Writeを生成し、共通入口を作る。要求する型をすべて含むArchetypeが対象となり、MatchesArchetypeで検証したものだけRegisterArchetypeへ渡す。Processごとに非所有Archetype参照と引数順の列番号をcacheする。Archetypeの型ID順と関数引数順が異なっても列番号で接続する。新しいArchetypeの接続中に例外が起きた場合は、途中まで登録した非所有参照を解除してから失敗を返す。\u003c/p>\n\u003cp>World.Runは指定phaseのProcessを登録順に処理する。Processは対象ArchetypeのChunkを順に走査し、空Chunkを除いて共通入口を呼ぶ。同じ関数をphaseを変えて重複登録することはできない。Process完了後に保留構造変更を反映する。Read/Write情報は保持するが、依存グラフに基づく並列スケジューリングは実装されていない。\u003c/p>\n\u003cp>Process関数が例外を送出すると、そのProcessの残りのChunk走査は中断する。Worldが例外を記録し、実行中フラグを戻して受付済みの構造変更を反映した後、現在のRunを終了する。同じRunの後続Processは呼ばない。既に書き換えたComponent値は巻き戻さない。noexcept宣言した関数からの例外はterminateになるため、このcatchでは回復しない。\u003c/p>\n\u003ch3 id=\"section-document-process-型一覧\">型一覧\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process-%E5%9E%8B%E4%B8%80%E8%A6%A7\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型・定義\u003c/th>\n\u003cth>責務\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ECSProcessPhase\u003c/code>\u003c/td>\n\u003ctd>FrameBegin / Update / LateUpdate / PreRender / FixedUpdate。実際の順序はEngine側の呼び出しで決まる\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSComponentAccess\u003c/code>\u003c/td>\n\u003ctd>Read / Write\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSProcessComponent\u003c/code>\u003c/td>\n\u003ctd>ComponentTypeIdとアクセス種別\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSProcessInvoke\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>void (*)(Chunk&amp;, std::span&lt;const size_t&gt;)\u003c/code> の共通呼出型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSProcessFunctionTraits&lt;F&gt;\u003c/code>\u003c/td>\n\u003ctd>関数ポインタ型の特殊化に要求情報生成とInvokeをまとめる。noexcept版は通常版を継承して再利用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ProcessKey&lt;Function&gt;\u003c/code>\u003c/td>\n\u003ctd>関数ごとの共通入口を表すconstexpr変数。型ではなく関数重複判定のkey\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSProcessArchetype\u003c/code>\u003c/td>\n\u003ctd>非所有Archetype*と要求順の列番号vector\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ECSProcess\u003c/code>\u003c/td>\n\u003ctd>phase、要求情報、対象Archetype cache、invokeを保持。Worldが所有し、Archetypeは借用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003c/section>","sources":["Implementation/ECS/README.md","Implementation/ECS/Types.md","Implementation/ECS/Process.md"],"sections":[{"id":"document-readme","source":"Implementation/ECS/README.md","title":"ECSの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/ECS/Types.md","title":"ECSの型","label":"型の解説"},{"id":"document-process","source":"Implementation/ECS/Process.md","title":"ECS Processの実行と型","label":"Process実行と型"}]},{"source":"Implementation/Engine/README.md","category":"engine","title":"Engine・DLL境界","summary":"Systemの所有、初期化・終了、APIテーブルと更新順序。","label":"Engine・DLL境界","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-生成と初期化","text":"生成と初期化","depth":3},{"id":"document-readme-更新","text":"更新","depth":3},{"id":"document-readme-終了","text":"終了","depth":3},{"id":"document-types","text":"型の解説","depth":2}],"diagrams":["frame"],"notes":[{"text":"2026-11-05のEngine Debug_EditorビルドとECS関連19件のテストは成功。全体テストにはEngine生成4件とLog出力件数1件の失敗が残る。ビルド成立と実機上の描画・更新確認を区別する。","sources":["Docs/Implementation/ECS/README.md","Engine/Source/Engine.cpp"]}],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Engineの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Engine/README.md\">正本Markdown\u003c/a>：Implementation/Engine/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Source/Engine.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine.cpp\u003c/a>、\u003ca href=\"../Engine/Source/EngineAPI.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">EngineAPI.cpp\u003c/a>、\u003ca href=\"../Engine/Source/DllMain.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DllMain.cpp\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-readme-生成と初期化\">生成と初期化\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-readme-%E7%94%9F%E6%88%90%E3%81%A8%E5%88%9D%E6%9C%9F%E5%8C%96\">#\u003c/a>\u003c/h3>\n\u003cp>GetEngineAPIはDLL内の固定APIテーブルを返す。Createはnull ApplicationAPIを拒否し、nothrow newでEngineを生成する。Initialize失敗時はdeleteしnullを返す。\u003c/p>\n\u003cp>EngineはApplicationAPIをコピーし、Log → Time → Graphics（1600×900）→ Asset → API接続 → ECSの順に初期化する。GraphicsはApplicationAPIからHWNDを取得する。初期化済みフラグを持ち、途中の失敗ではFinalizeで準備済みのSystemを解放する。\u003c/p>\n\u003cp>初期化の最後に4頂点・6indexのDebugPlaneを登録し、Default MaterialとTextureTestを用意する。これらのHandleが無効なら初期化失敗となる。TextureのHandle有効性はGPU転送成功とは別である。\u003c/p>\n\u003ch3 id=\"section-document-readme-更新\">更新\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-readme-%E6%9B%B4%E6%96%B0\">#\u003c/a>\u003c/h3>\n\u003cp>FixedUpdateはTimeの固定時間を更新し、ECSのFixedUpdate phaseを進める。FrameExecuteはGraphics・Timeの準備とdebug Meshの有効性を確認後、Time更新、ECSのFrameBegin → Update → LateUpdate → PreRender、デバッグ描画提出、Render、ECS.EndFrameの順で進む。\u003c/p>\n\u003cp>描画は現在Engine内のデバッグ平面が主な入口であり、GameRuntimeやECS Componentから自動でRenderDataを抽出する経路はない。ProcessMessageは空。Game.dllのロード・GameRuntime呼び出しはコメント化された予定部分である。\u003c/p>\n\u003ch3 id=\"section-document-readme-終了\">終了\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-readme-%E7%B5%82%E4%BA%86\">#\u003c/a>\u003c/h3>\n\u003cp>ECS → AssetAPI → Asset → Graphics → TimeAPI → Time → LogAPI → Logの順で接続と所有資源を解放する。API参照より先に参照先を壊さないよう順を管理する。デストラクタもFinalizeを呼び、フラグで解放済み部分を除く。Destroyはnullを許容し、FinalizeとdeleteをDLL内部で実行する。\u003c/p>\n\u003cp>ApplicationからこのDestroy経路が実際に呼ばれるかは \u003ca href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme\">Applicationの終了処理\u003c/a> を参照。2026-11-05にEngineのDebug_Editorビルドは成功したが、Engine生成を前提とするテスト4件はnullで失敗している。ビルド成立と生成・描画経路の実行確認を区別する。詳細は\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E6%A4%9C%E8%A8%BC%E8%A8%98%E9%8C%B22026-11-05\">ECSの検証記録\u003c/a>を参照する。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Engineの型とDLL境界\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Engine/Types.md\">正本Markdown\u003c/a>：Implementation/Engine/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型・入口\u003c/th>\n\u003cth>役割\u003c/th>\n\u003cth>根拠\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Hestia::Engine\u003c/code>\u003c/td>\n\u003ctd>各System、API、debug Materialを値所有。Graphics/Asset/ECS等の初期化状態を個別に保持。ApplicationAPIのcontextは非所有\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Engine.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>EngineHandle\u003c/code>\u003c/td>\n\u003ctd>Engine実体を隠すvoid*。生成したDLLのDestroyへ戻す。任意のvoid*を渡せる契約ではない\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/EngineAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">EngineAPI.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>EngineAPI\u003c/code>\u003c/td>\n\u003ctd>Create、Destroy、ProcessMessage、FixedUpdate、FrameExecuteの関数テーブル。Engine実体の代わりにApplicationが保持する\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GetEngineAPI\u003c/code>\u003c/td>\n\u003ctd>C linkageのexport入口。テーブルはDLL所有で、呼び出し側はdeleteしない\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Source/EngineAPI.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">EngineAPI.cpp\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>更新・通知用wrapperはnull Handleなら何もしない。Create時のnull APIは失敗になる。非null HandleについてはEngineへのcastを行うため、型・生成元・寿命が正しいことは利用側の前提となる。\u003c/p>\n\u003cp>DLL export/importは \u003ca href=\"../Common/Include/DllAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DllAPI.h\u003c/a> で制御する。テーブルの寿命はDLLロード期間に従う。STLを含む各SystemのC++ APIと、この関数テーブルによる境界は区別する。\u003c/p>\n\u003c/section>","sources":["Implementation/Engine/README.md","Implementation/Engine/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Engine/README.md","title":"Engineの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Engine/Types.md","title":"Engineの型とDLL境界","label":"型の解説"}]},{"source":"Implementation/Graphics/README.md","category":"graphics","title":"Graphics・Shader","summary":"描画提出、DX12資源と同期、Shaderとのデータ受け渡し。","label":"Graphics・Shader","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-所有と初期化","text":"所有と初期化","depth":3},{"id":"document-readme-cpu-assetからgpuへ","text":"CPU AssetからGPUへ","depth":3},{"id":"document-readme-フレームと描画","text":"フレームと描画","depth":3},{"id":"document-readme-shaderとの対応","text":"Shaderとの対応","depth":3},{"id":"document-types","text":"型の解説","depth":2},{"id":"document-types-systemと資源管理","text":"Systemと資源管理","depth":3},{"id":"document-types-描画データ","text":"描画データ","depth":3},{"id":"document-types-hlslの型","text":"HLSLの型","depth":3}],"diagrams":[],"notes":[],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Graphicsの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Graphics/README.md\">正本Markdown\u003c/a>：Implementation/Graphics/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Source/Graphics/GraphicsSystem.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GraphicsSystem.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Graphics/DX12Backend.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DX12Backend.cpp\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-readme-所有と初期化\">所有と初期化\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme-%E6%89%80%E6%9C%89%E3%81%A8%E5%88%9D%E6%9C%9F%E5%8C%96\">#\u003c/a>\u003c/h3>\n\u003cp>GraphicsSystemはunique_ptrでDX12Backendを所有し、RenderDataのqueueとView/Projectionを保持する。単一instanceを接続し、初期化・資源登録・描画・終了は同じスレッドで行う。null HWND、正でない寸法、二重初期化を拒否する。初期Viewは単位行列、ProjectionはWindow寸法の左手系正射影（near 0.1、far 100）。Resizeは未対応。\u003c/p>\n\u003cp>BackendはDevice、Direct Queue、SwapChain、二つのFrameContext、描画先、depth、descriptor heap、RootSignature、PSO cache、定数Buffer、GPU Asset Storage、UploadContextPool、Fenceを管理する。RTV/DSVは各64、master SRVは2048、material textureは16、最大描画提出数は32768。これらは現在の固定容量で、動的に無制限へ増える契約ではない。\u003c/p>\n\u003ch3 id=\"section-document-readme-cpu-assetからgpuへ\">CPU AssetからGPUへ\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme-cpu-asset%E3%81%8B%E3%82%89gpu%E3%81%B8\">#\u003c/a>\u003c/h3>\n\u003cp>MeshはStream別Vertex Bufferとindex Bufferに変換する。TextureはRGBA8画素をUpload Resourceへコピーし、同じDirect Queueへ転送命令を積む。CPU AssetとGPU StorageはAssetHandleのindex/generationを共有する。無効・不一致・重複Handle、不正なMeshやpitch、資源生成失敗はfalseとなる。\u003c/p>\n\u003cp>転送用ResourceはWaitingResourceとしてFence値と共に保持し、Updateで完了したものから解放する。UploadContextもFence完了後に再利用する。APIが戻る前に入力画素はコピーされるため、Loaderの一時画像をGPU完了まで保持する必要はない。\u003c/p>\n\u003ch3 id=\"section-document-readme-フレームと描画\">フレームと描画\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme-%E3%83%95%E3%83%AC%E3%83%BC%E3%83%A0%E3%81%A8%E6%8F%8F%E7%94%BB\">#\u003c/a>\u003c/h3>\n\u003cp>SubmitはRenderDataを値で受け取りqueueに追加する。未初期化、容量超過、GPU Mesh不在ではfalse。Materialの値はコピーされるがShader pathのwstring_viewは借用のままであり、描画まで文字列を生存させる必要がある。\u003c/p>\n\u003cp>RenderはUpdate → BeginDraw → Draw → EndDrawを呼ぶ。BeginDraw失敗時は以降を呼ばない。BeginDrawはフレーム資源を準備し、PerFrame定数を書き、提出queueをBackend側へswapする。Drawは提出順にGPU Meshを検索し、Object/Material、Pipeline、Textureを設定してindexed drawする。未登録Meshは除く。欠落する任意頂点Streamには既定Bufferを使う。\u003c/p>\n\u003cp>EndDrawはscene colorをBackBufferへコピーし、状態遷移、コマンド実行、PresentとFenceの進行を行う。宣言された二つのscene colorだけから一般的なRenderGraphやポストエフェクト実装があると解釈しない。\u003c/p>\n\u003ch3 id=\"section-document-readme-shaderとの対応\">Shaderとの対応\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme-shader%E3%81%A8%E3%81%AE%E5%AF%BE%E5%BF%9C\">#\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"../Shaders/Common.hlsl\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Common.hlsl\u003c/a> はb0=Frame、b1=Object、b2=Materialの定数と四つのsamplerを宣言する。\u003ca href=\"../Shaders/VS_Sprite.hlsl\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">VS_Sprite\u003c/a> は行ベクトルをworld → view → projの順で変換し、UVと頂点色を渡す。\u003ca href=\"../Shaders/PS_Sprite.hlsl\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">PS_Sprite\u003c/a> はspace1のt0をWrapLinearSamplerで読み、頂点色とMaterial色を乗算する。粗さ・metallic等のデータがあっても、このPSが物理ベースのライティングを実行するわけではない。\u003c/p>\n\u003cp>FinalizeはGPU待機後にBufferのmap、GPU Storage、転送待ち、Context等を解放する。GPU待機に失敗した経路では途中でreturnするため、全解放成功を戻り値で通知する仕様にはなっていない。描画結果やGPU異常時の動作は今回実行確認していない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Graphicsの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Graphics/Types.md\">正本Markdown\u003c/a>：Implementation/Graphics/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-types-systemと資源管理\">Systemと資源管理\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-types-system%E3%81%A8%E8%B3%87%E6%BA%90%E7%AE%A1%E7%90%86\">#\u003c/a>\u003c/h3>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>責務\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>GraphicsSystem\u003c/code>\u003c/td>\n\u003ctd>Backendの所有、描画提出、View/Projection設定、Asset Uploadの入口\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Graphics/GraphicsSystem.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GraphicsSystem.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DX12Backend\u003c/code>\u003c/td>\n\u003ctd>DX12資源・コマンド記録・同期・Presentを管理\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Graphics/DX12Backend.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DX12Backend.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>FrameContext\u003c/code>\u003c/td>\n\u003ctd>フレームごとのallocator、command list、Frame定数Buffer、shader-visible SRV heapとFence値\u003c/td>\n\u003ctd>同上、Backend内部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>WaitingResource\u003c/code>\u003c/td>\n\u003ctd>転送用ResourceのComPtrと解放可能になるFence値\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>UploadContextPool\u003c/code>\u003c/td>\n\u003ctd>Upload用allocator/listを管理し、空きがなければ追加。初期数16\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>UploadContext\u003c/code>\u003c/td>\n\u003ctd>allocator、command list、使用中Fence値、空き状態\u003c/td>\n\u003ctd>同上、Pool内部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>RootParameterIndex\u003c/code>\u003c/td>\n\u003ctd>Frame/Object/Material CBV、System/Material SRVのRoot引数番号\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PerMaterialCB\u003c/code>\u003c/td>\n\u003ctd>map済み定数Buffer、Material名のcache、登録index。要素strideは256byte境界\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PerObjectCB\u003c/code>\u003c/td>\n\u003ctd>Object定数Bufferとmap先。要素strideは256byte境界\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GPUResourceStorage&lt;TAsset,TGpuResource&gt;\u003c/code>\u003c/td>\n\u003ctd>HandleとGPU Resourceの対応を所有。Registerで重複indexを拒否、Getで世代も照合、Clearで全解放\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Graphics/GPUResourceStorage.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GPUResourceStorage.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GPUResourceStorage::Slot\u003c/code>\u003c/td>\n\u003ctd>Resourceとgenerationを保持する内部slot\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch3 id=\"section-document-types-描画データ\">描画データ\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-types-%E6%8F%8F%E7%94%BB%E3%83%87%E3%83%BC%E3%82%BF\">#\u003c/a>\u003c/h3>\n\u003cp>以下のC++型は \u003ca href=\"../Engine/Include/Graphics/DX12Object.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DX12Object.h\u003c/a> に定義される。ComPtrはCOM参照を所有する。descriptor indexはBackend所有heap内の位置であり、それ単独ではheapを所有しない。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>保持するデータ・意味\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>DXRenderTexture\u003c/code>\u003c/td>\n\u003ctd>Resource、RTV index、SRV index。描画先の組\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DXDepthStencil\u003c/code>\u003c/td>\n\u003ctd>Resource、DSV、depth/stencilそれぞれのSRV index\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DXTexture\u003c/code>\u003c/td>\n\u003ctd>Texture Resourceとmaster SRV index。CPU Textureに対応\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DXVertexBuffer\u003c/code>\u003c/td>\n\u003ctd>ResourceとD3D12_VERTEX_BUFFER_VIEW\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DXMesh\u003c/code>\u003c/td>\n\u003ctd>Stream別Vertex Buffer、index Resource/view、頂点・index数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PerFrameConstants\u003c/code>\u003c/td>\n\u003ctd>View、Projection、cameraPosition、経過時間\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PerObjectConstants\u003c/code>\u003c/td>\n\u003ctd>worldMatrix\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Material\u003c/code>\u003c/td>\n\u003ctd>名前、diffuse/specular/emission色、roughness、metallic、Texture Handle配列。Defaultは白diffuse/specular、黒emission、roughness 0.5、metallic 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>MaterialConstants\u003c/code>\u003c/td>\n\u003ctd>Materialの数値・色部分。Texture Handleや名前を含まないGPU定数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>RenderData\u003c/code>\u003c/td>\n\u003ctd>worldMatrix、Material値、Mesh Handle、VS/PS pathのwstring_view。MeshやShader文字列の所有者ではない\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch3 id=\"section-document-types-hlslの型\">HLSLの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-types-hlsl%E3%81%AE%E5%9E%8B\">#\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"../Shaders/Common.hlsl\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Common.hlsl\u003c/a> の \u003ccode>VSInput\u003c/code> は位置・UV・法線・接線・色、\u003ccode>PSInput_Default\u003c/code> はclip位置・world位置・UV・法線・接線・色、\u003ccode>PSInput_Sprite\u003c/code> はclip位置・UV・色を持つ。現在のSprite shaderが使う受け渡しはPSInput_Sprite。\u003c/p>\n\u003cp>\u003ccode>PerFrameBuffer\u003c/code>、\u003ccode>PerObjectBuffer\u003c/code>、\u003ccode>PerMaterialBuffer\u003c/code> はそれぞれC++側のFrame/Object/Material定数に対応するcbuffer。CPU側のメモリ配置とShaderの行列格納規約の整合が必要であり、C++型を変更する際はShader側も確認する。\u003c/p>\n\u003c/section>","sources":["Implementation/Graphics/README.md","Implementation/Graphics/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Graphics/README.md","title":"Graphicsの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Graphics/Types.md","title":"Graphicsの型","label":"型の解説"}]},{"source":"Implementation/Log/README.md","category":"log","title":"Log","summary":"Logger、二つのpending、処理スレッドと出力の寿命。","label":"Log","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-readme-所有と受付","text":"所有と受付","depth":3},{"id":"document-readme-データの流れ","text":"データの流れ","depth":3},{"id":"document-readme-終了と制約","text":"終了と制約","depth":3},{"id":"document-types","text":"型の解説","depth":2}],"diagrams":[],"notes":[],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Logの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Log/README.md\">正本Markdown\u003c/a>：Implementation/Log/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Source/Log/LogSystem.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogSystem.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Log/Logger.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Logger.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Log/LogStorage.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogStorage.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Log/LogProcess.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogProcess.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Log/LogAPI.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogAPI.cpp\u003c/a>\u003c/p>\n\u003ch3 id=\"section-document-readme-所有と受付\">所有と受付\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-readme-%E6%89%80%E6%9C%89%E3%81%A8%E5%8F%97%E4%BB%98\">#\u003c/a>\u003c/h3>\n\u003cp>LogSystemはLogger、LogStorage、LogProcess、処理thread、Drain用vectorを所有する。設定を検査し、Storage、出力ファイル、バッチ容量、受付、thread、Logger接続を準備する。失敗時は準備した部分を解放する。同時に稼働するSystemは一つ。\u003c/p>\n\u003cp>既定設定は \u003ccode>../Logs\u003c/code> 以下の時刻付きtxt、保持上限4096件、Drain単位256件。ファイル名はローカル時刻で生成する。明示設定では空path、容量0、Drain 0、Drainが容量を超える設定を拒否する。\u003c/p>\n\u003cp>Loggerは本文、source_locationのファイル・関数・行、system_clock時刻、thread IDをLogEntryにコピーする。呼び出し元文字列の借用を継続しない。\u003c/p>\n\u003ch3 id=\"section-document-readme-データの流れ\">データの流れ\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-readme-%E3%83%87%E3%83%BC%E3%82%BF%E3%81%AE%E6%B5%81%E3%82%8C\">#\u003c/a>\u003c/h3>\n\u003cp>記録元 → Logger → 書込側pending → 読取側pending → queue → Drain用vector → LogProcess → ファイルの順。二つのpendingをmutex内で交換し、単一処理threadが移送・Drain・書き込みを進める。総保持件数が上限なら新しい記録を拒否し、drop件数を増やす。ログが常に無損失になるとは保証しない。\u003c/p>\n\u003cp>出力はUTCのミリ秒付き時刻、level、thread、ファイル・行・関数を持つヘッダーと、2空白で字下げした本文。本文のCR/LFを改行として扱い、NULはエスケープする。ヘッダーの制御文字やバックスラッシュもエスケープする。\u003c/p>\n\u003ch3 id=\"section-document-readme-終了と制約\">終了と制約\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-readme-%E7%B5%82%E4%BA%86%E3%81%A8%E5%88%B6%E7%B4%84\">#\u003c/a>\u003c/h3>\n\u003cp>記録元を先に停止し、Logger解除、Storage受付停止、thread join、残件処理、ファイルflush/close、Storage解放を行う。出力先が正常な場合に受付済み残件を処理する。ファイルの異常時はProcessが戻るため、永続化を保証しない。threadのRunは受付中または残件がある間ループし、空時のsleepや条件変数待ちは実装されていない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Logの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Log/Types.md\">正本Markdown\u003c/a>：Implementation/Log/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>責務・契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>LogLevel\u003c/code>\u003c/td>\n\u003ctd>Log、Warning、Error、Fatalの重要度\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Log/LogData.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogData.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LogSettings\u003c/code>\u003c/td>\n\u003ctd>出力path、総保持容量、Drain件数。既定構築ではpath空・件数0で、そのまま明示初期化へ渡すと無効\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LogEntry\u003c/code>\u003c/td>\n\u003ctd>本文・呼出位置文字列・時刻・level・thread IDを値で保持する一件の記録\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Logger\u003c/code>\u003c/td>\n\u003ctd>static記録入口と現在のStorage接続を管理。LogEntryを作りPushへ渡す\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Log/Logger.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Logger.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LogStorage\u003c/code>\u003c/td>\n\u003ctd>二つのpendingとqueue、受付状態、保持件数、drop件数を管理。記録元と処理側の受け渡しを担当\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Log/LogStorage.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogStorage.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LogProcess\u003c/code>\u003c/td>\n\u003ctd>ofstreamを所有。spanのLogEntryを整形して追記出力し、Finalizeでflush/close\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Log/LogProcess.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogProcess.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LogSystem\u003c/code>\u003c/td>\n\u003ctd>上記の寿命と単一threadを統括。Initialize / Finalizeは管理threadで直列に呼ぶ\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Log/LogSystem.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogSystem.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LogAPI\u003c/code>\u003c/td>\n\u003ctd>DLL境界のログ受付入口。Systemへの接続を初期化・解除し、記録をログ側へ渡す\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Log/LogAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">LogAPI.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>pendingの書込と切替の排他があることと、Initialize / Finalizeと記録を自由に競合させられることは別である。終了時は記録元を先に停止する。\u003c/p>\n\u003cp>LogAPIのSystem参照は拡張用であり、現行のLog / Warning / Error / Fatalは接続先メンバを経由せずLoggerのstatic関数へ直接委譲する。したがってLogAPI.FinalizeだけでLogger全体の受付が停止するわけではない。\u003c/p>\n\u003c/section>","sources":["Implementation/Log/README.md","Implementation/Log/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Log/README.md","title":"Logの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Log/Types.md","title":"Logの型","label":"型の解説"}]},{"source":"Implementation/README.md","category":"runtime","title":"実装仕様書","summary":"実装仕様書の索引、全体の接続、実装済みの対象範囲を確認する。","label":"全体概要","order":10,"headings":[{"id":"読み方","text":"読み方","depth":2},{"id":"全体の接続","text":"全体の接続","depth":2},{"id":"対象の境界","text":"対象の境界","depth":2},{"id":"wikiの再生成","text":"Wikiの再生成","depth":2}],"diagrams":["system"],"notes":[],"html":"\u003cp>2026-11-02の実装調査を基に、2026-11-05にECSとEngine接続の記述を更新した。設計案の採否や将来の予定はこの文書から決定しない。\u003c/p>\n\u003ch2 id=\"section-読み方\">読み方\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FREADME.md&amp;section=%E8%AA%AD%E3%81%BF%E6%96%B9\">#\u003c/a>\u003c/h2>\n\u003cp>各フォルダの \u003ccode>README.md\u003c/code> は責務、所有関係、処理の流れ、制約を説明し、\u003ccode>Types.md\u003c/code> は型と利用上の契約を説明する。ソースへのリンクは仕様の確認先であり、実行確認済みを意味しない。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>システム\u003c/th>\n\u003cth>処理・構造\u003c/th>\n\u003cth>型\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Application / Window\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-readme\">Application\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FApplication%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Engine / DLL境界\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-readme\">Engine\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FEngine%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Time\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FTime%2FREADME.md&amp;section=document-readme\">Time\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FTime%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Log\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-readme\">Log\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FLog%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Asset\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-readme\">Asset\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FAsset%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Graphics / DX12 / Shader\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-readme\">Graphics\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FGraphics%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ECS\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">ECS\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-types\">Types\u003c/a>、\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-process\">Process\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Common / 数学・色・乱数\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-readme\">Common\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#page=Implementation%2FCommon%2FREADME.md&amp;section=document-types\">Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-全体の接続\">全体の接続\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FREADME.md&amp;section=%E5%85%A8%E4%BD%93%E3%81%AE%E6%8E%A5%E7%B6%9A\">#\u003c/a>\u003c/h2>\n\u003cp>ApplicationがWindowとフレーム進行を管理し、Engine.dllのAPIテーブルを取得してEngineを生成する。EngineはLog、Time、Graphics、Asset、ECSを所有する。AssetのCPU実体とGraphicsのGPU実体は型付きHandleで対応付ける。ECSは現在単一Worldで、Engineがphaseを進める。\u003c/p>\n\u003cp>既存の \u003ca href=\"#page=Architecture.md\">Architecture\u003c/a>、\u003ca href=\"#page=DesignSources.md\">DesignSources\u003c/a>、\u003ca href=\"#page=OpenDecisions.md\">OpenDecisions\u003c/a> は設計資料の整理である。一部に現在より前の実装状態の記述があるため、現在の動作は本書のリンク先コードで確認する。\u003c/p>\n\u003ch2 id=\"section-対象の境界\">対象の境界\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FREADME.md&amp;section=%E5%AF%BE%E8%B1%A1%E3%81%AE%E5%A2%83%E7%95%8C\">#\u003c/a>\u003c/h2>\n\u003cp>Input、Audio、Physics、Editor、GameRuntime、HestiaGameのFacadeは、現在の稼働コードとして実装されたシステムに数えない。Engine.h内のコメント化された宣言を実装済みとは扱わない。PCH、DLL入口、Windows Header、DLL exportマクロはEngine/Commonの補助部分として扱う。外部ライブラリ本体、テスト基盤、ビルド・検証ツールはエンジンのランタイムシステムから除外する。\u003c/p>\n\u003cp>各文書はソースの静的調査を根拠とする。2026-11-05にはEngineのDebug_EditorビルドとECS関連19件のテストが成功した。全体テストには5件の失敗が残り、GPU描画・Window操作の実機確認は行っていない。条件と未解消事項は\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme-%E6%A4%9C%E8%A8%BC%E8%A8%98%E9%8C%B22026-11-05\">ECSの検証記録\u003c/a>を参照する。\u003c/p>\n\u003ch2 id=\"section-wikiの再生成\">Wikiの再生成\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FREADME.md&amp;section=wiki%E3%81%AE%E5%86%8D%E7%94%9F%E6%88%90\">#\u003c/a>\u003c/h2>\n\u003cp>正本はこのフォルダのMarkdown。閲覧用の\u003ca href=\"ImplementationWiki.html\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">ImplementationWiki.html\u003c/a>は、Node.jsで\u003ca href=\"../Tools/SpecWiki/Generate.cmd\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Generate.cmd\u003c/a>を実行して再生成する。npm installは不要で、Markdown変換器とライセンスはTools/SpecWiki/vendorに同梱する。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bat\">Tools\\SpecWiki\\Generate.cmd\nTools\\SpecWiki\\Generate.cmd --check\n\u003c/code>\u003c/pre>\n\u003cp>本文・分類・図を変更したら再生成し、--checkで分類、見出しリンク、図の根拠ファイル、生成内容の一致を確認する。本文はMarkdown、分類と図の接続はcatalog.json、図はTools/SpecWiki/diagramsで編集する。\u003c/p>\n","sources":["Implementation/README.md"],"sections":[]},{"source":"Implementation/Time/README.md","category":"time","title":"Time","summary":"通常・固定更新の時間値、時間倍率と非所有API。","label":"Time","order":10,"headings":[{"id":"document-readme","text":"処理・構造","depth":2},{"id":"document-types","text":"型の解説","depth":2}],"diagrams":[],"notes":[],"html":"\u003csection class=\"document-section\" id=\"section-document-readme\">\u003ch2>Timeの処理・構造\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FTime%2FREADME.md&amp;section=document-readme\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Time/README.md\">正本Markdown\u003c/a>：Implementation/Time/README.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FREADME.md\">全体索引\u003c/a> / \u003ca href=\"#page=Implementation%2FTime%2FREADME.md&amp;section=document-types\">型\u003c/a>\u003c/p>\n\u003cp>根拠: \u003ca href=\"../Engine/Source/Time/TimeSystem.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">TimeSystem.cpp\u003c/a>、\u003ca href=\"../Engine/Source/Time/TimeAPI.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">TimeAPI.cpp\u003c/a>\u003c/p>\n\u003cp>TimeSystemは時計を直接読まず、ApplicationからEngine経由で渡された秒数を保持する。InitializeはTimeDataを既定値へ戻し、単一のstatic instanceを接続する。Finalizeは接続を解除する。初期化・終了・参照は同一スレッドで行う。\u003c/p>\n\u003cp>\u003ccode>Update(dt)\u003c/code> はunscaledDeltaTimeにdt、deltaTimeにdt×timeScaleを設定し、それぞれのtotalTimeへ加算する。\u003ccode>UpdateFixed(dt)\u003c/code> は固定更新の二つのdeltaだけを設定し、通常更新のtotalTimeを加算しない。入力dtは有限かつ非負であることをassertする。\u003c/p>\n\u003cp>SetTimeScaleは有限の非負値だけを採用する。負数、NaN、無限大は無視する。0ではscaled時間が進まないがunscaled時間は進む。固定更新の呼び出し頻度自体はApplicationの蓄積時間で決まり、timeScaleでは変更しない。\u003c/p>\n\u003cp>TimeAPIはSystemとそのTimeDataを非所有参照し、getterはデータを直接読む。setterだけSystemへ委譲する。Finalizeで参照を解除し、その後はgetterを利用しない。\u003c/p>\n\u003c/section>\n\u003csection class=\"document-section\" id=\"section-document-types\">\u003ch2>Timeの型\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=Implementation%2FTime%2FREADME.md&amp;section=document-types\">#\u003c/a>\u003c/h2>\u003cp class=\"document-source\">\u003ca class=\"local-link\" href=\"Implementation/Time/Types.md\">正本Markdown\u003c/a>：Implementation/Time/Types.md\u003c/p>\u003cp>\u003ca href=\"#page=Implementation%2FTime%2FREADME.md&amp;section=document-readme\">処理・構造\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>型\u003c/th>\n\u003cth>内容と契約\u003c/th>\n\u003cth>定義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>TimeData\u003c/code>\u003c/td>\n\u003ctd>float秒のdeltaTime、unscaledDeltaTime、totalTime、unscaledTotalTime、fixedDeltaTime、unscaledFixedDeltaTimeと倍率timeScale。時間は0、倍率は1で開始\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Time/TimeData.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">TimeData.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>TimeSystem\u003c/code>\u003c/td>\n\u003ctd>TimeDataを値所有。Update / UpdateFixedで書き込み、static getterで現在instanceを読む。初期化前・終了後の利用は許容しない\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Time/TimeSystem.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">TimeSystem.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>TimeAPI\u003c/code>\u003c/td>\n\u003ctd>TimeSystem\u003cem>とconst TimeData\u003c/em>を借用。Initializeで接続、Finalizeで解除。DLL利用側に読み取りと倍率変更を公開する\u003c/td>\n\u003ctd>\u003ca href=\"../Engine/Include/Time/TimeAPI.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">TimeAPI.h\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>APIを利用する期間中はSystemが生存し初期化済みであること。getterのnullチェックはassertであり、未接続時の既定値返却は契約に含まない。\u003c/p>\n\u003c/section>","sources":["Implementation/Time/README.md","Implementation/Time/Types.md"],"sections":[{"id":"document-readme","source":"Implementation/Time/README.md","title":"Timeの処理・構造","label":"処理・構造"},{"id":"document-types","source":"Implementation/Time/Types.md","title":"Timeの型","label":"型の解説"}]},{"source":"OpenDecisions.md","category":"design","title":"実装前の未確定事項と資料間の差分","summary":"実装前に整理された未確定事項と資料間の差分。","label":"実装前の未確定事項と資料間の差分","order":30,"headings":[{"id":"将来案ecsの初期構成指定とprefab復元","text":"将来案：ECSの初期構成指定とPrefab復元","depth":2}],"diagrams":[],"notes":[{"text":"実装前の検討資料。ApplicationAPIの名前空間、HWND取得、Engineロード等について、現在のコードと異なる過去の状態が記載されている。","sources":["Application/Include/ApplicationAPI.h","Application/Source/Application.cpp"]}],"html":"\u003cp>以下は決定済み事項の再議論ではなく、実装で具体的な型や順序が必要になる論点である。「資料に明記された内容」は根拠、「実装リポジトリ向けの提案」は進め方であり、採用決定ではない。\u003c/p>\n\u003cdiv class=\"table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"表（横スクロール可能）\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>論点\u003c/th>\n\u003cth>資料に明記された内容・差分\u003c/th>\n\u003cth>判断に必要な情報／実装リポジトリ向けの提案\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Engine の最小境界と失敗\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Engine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Engine\u003c/a> は \u003ccode>GetEngineAPI\u003c/code>、Handle 付き \u003ccode>Create\u003c/code>／\u003ccode>Destroy\u003c/code>／更新を示す一方、\u003ccode>Create\u003c/code> 失敗通知と共有 Header／\u003ccode>ENGINE_API\u003c/code> 配置は未定。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions U02\u003c/a> は独立した API テーブル \u003ccode>Initialize\u003c/code>／\u003ccode>Finalize\u003c/code> を退ける。\u003c/td>\n\u003ctd>最初の実装では API テーブルの配置、\u003ccode>Create\u003c/code> 失敗の返し方、部分初期化時の解放順を決める。Window と Engine.dll の最小ロード／破棄を確認する。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ApplicationAPI と既存コード\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Application.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application\u003c/a> は \u003ccode>Hestia::ApplicationAPI\u003c/code> と \u003ccode>GetWindowHandle\u003c/code> を定めるが、現行 \u003ca href=\"../Application/Include/Application.h\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.h\u003c/a> はグローバル \u003ccode>ApplicationAPI\u003c/code> で HWND 取得口がない。Engine ロード部分はコメント化され、\u003ca href=\"../Engine/Source/DllMain.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">DllMain.cpp\u003c/a> は入口だけ。\u003c/td>\n\u003ctd>共有 Header の責務を決め、現行コードとの差分を小さく実装する単位に分ける。今回はコードを合わせない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Window Message と終了\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Application.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application\u003c/a> は毎フレーム先頭の ProcessMessages、Engine／Editor への void 通知、最後の DefWindowProc、Window の破棄を示す。現行 \u003ca href=\"../Application/Source/Application.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Application.cpp\u003c/a> は Run 先頭から \u003ccode>ProcessMessages\u003c/code> を呼ばず、Engine 通知も未実装。\u003ca href=\"../Application/Source/Window.cpp\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Window.cpp\u003c/a> の Finalize は \u003ccode>UnregisterClass\u003c/code> と \u003ccode>CoUninitialize\u003c/code> を行う。\u003c/td>\n\u003ctd>実装時にメッセージ配送と Window 破棄の順を確定し、閉じる操作とタイマー待機中の応答を実機で確認する。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>System と Boundary API\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a> は Engine 値所有と \u003ccode>Initialize(XxxSystem*)\u003c/code> を決定。個別の \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/AssetSystem.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetSystem\u003c/a> と \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Subsystems.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Subsystems\u003c/a> は機能 API や一部 lifecycle を追加草案として留保する。\u003c/td>\n\u003ctd>各 System を実装する直前に Game 側の一つの用途を決め、必要な公開操作、共有型、更新順、\u003ccode>s_instance\u003c/code> の登録・解除時点を確定する。一律の System 初期化規約を先に設けない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Asset Facade の経路\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Asset/AssetManagement.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetManagement\u003c/a> 等は \u003ccode>Assets::Load&lt;T&gt;\u003c/code>、\u003ccode>GameAPI.lib\u003c/code> と \u003ccode>Engine::AssetDB\u003c/code> を想定する。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions U07\u003c/a> は元の Asset 例の Load／Handle 宣言を取り下げ、\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/AssetSystem.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetSystem\u003c/a> は公開操作を未確定とする。\u003c/td>\n\u003ctd>Asset の最初の利用ケース、所有する Cache、\u003ccode>AssetHandle&lt;T&gt;\u003c/code> の無効化条件、Game 向け API の配置を確認してから統合する。GameAPI.lib を現在の必須構成としない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU Asset と GPU 資源\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Asset/AssetType.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">AssetType\u003c/a> は CPU Asset を Cache、DX12 Resource／Descriptor を Graphics 側に分ける草案。\u003ca href=\"../Reference/HestiaDesign/Asset/Material.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Material\u003c/a> は型付き Material 値と Reflection の GPU Layout を分ける。アップロード要求 API、Ready 時点、借用参照の寿命、Frame への固定方法は未決。\u003c/td>\n\u003ctd>Mesh／Texture の一つの読み込みから描画までを対象に所有者・同期点・失敗通知を決める。Game 公開 API に DX12 実体を漏らさない方針を候補とする。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>初期描画と後段案\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderingArchitecture.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderingArchitecture\u003c/a> 冒頭は 2026-10-04 更新として Main Thread の直接経路を優先し、後半の Render Thread／FramePacket を比較案とする。\u003ca href=\"../Reference/HestiaDesign/DirectX/MultiThreadRendering.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">MultiThreadRendering\u003c/a> は Render Thread を前提に Build→Sort→Record を描く。\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderingPipeLine.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderingPipeLine\u003c/a> と \u003ca href=\"../Reference/HestiaDesign/Graphics/RenderGraph.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderGraph\u003c/a> は Graph 利用を説明するが、DirectX 資料は初期 Pass／Barrier の明示管理を採る。\u003c/td>\n\u003ctd>最小描画の要求型、初期 Pass／Barrier、Main Thread 上の呼出し順をまず定義する。描画スレッド・Graph・Worker 分割の採用時期は実測と必要機能で判断する。未収録の \u003ccode>SimpleArchitecture\u003c/code> 等を確認するまでは、その記述を決定根拠にしない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ECS／World／GameRuntime\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan2\u003c/a> は C++ Sparse Script を現在の方針、初期は通常の \u003ccode>.h/.cpp\u003c/code> と Game.dll、Generator は後段とする。\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan1.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan1\u003c/a> は C# Script 案を含む。\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/GameRuntime.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">GameRuntime\u003c/a> はゲーム状態の所有型を仮置きとし、Engine の \u003ccode>WorldSystem\u003c/code> は宣言されていない。\u003c/td>\n\u003ctd>Engine内部のArchetype ECSは実装済み。\u003ca href=\"#page=Implementation%2FECS%2FREADME.md&amp;section=document-readme\">現在の仕様\u003c/a>を基に具体的なComponentとProcessを追加する。GameRuntime／Scriptの所有境界とGame向けAPIは引き続き検討対象。Plan1のC#やPlan2のGeneratorは初期要件に含めない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Editor の配置\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/Class/Editor.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Class/Editor\u003c/a> と \u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions U08\u003c/a> は Application の条件付き値所有のみ確定し、DLL／exe 配置と情報経路を後回しにする。一方、\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan2\u003c/a> は Editor コードを Editor プロファイル exe に含めると記す。描画資料は exe 内 ImGui との接続案を持つ。\u003ca href=\"../Reference/HestiaDesign/Graphics/RenderingArchitecture.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">RenderingArchitecture\u003c/a>\u003c/td>\n\u003ctd>Runtime と Game の最小実装後、Editor が編集する状態と GPU 表示の接続を列挙し、配置・依存・初期化順を決める。現時点でいずれかの配置を採用済みと宣言しない。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Game → Application\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/OpenQuestions.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">OpenQuestions U03\u003c/a> は別 API を GameRuntime へ渡す方向だけ決め、型・操作・引数を未確定とする。\u003c/td>\n\u003ctd>Game が直接必要とする FPS 設定や終了要求等の用途を列挙し、既存 ApplicationAPI の利用か Game 用の限定 API かを選ぶ。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DLL 内 C++ 型の契約\u003c/td>\n\u003ctd>\u003ca href=\"../Reference/HestiaDesign/DevelopNotes/SubsystemApiFacadeDesign.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">SubsystemApiFacadeDesign\u003c/a> は Handle／ID／POD／明示 View を勧める。\u003ca href=\"../Reference/HestiaDesign/ECS/ECSArchitecture_Plan2.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Plan2\u003c/a> は同一ビルドの内部 C++ 境界で STL／template 等を一律禁止しない。\u003ca href=\"../Reference/HestiaDesign/Asset/Material.md\" class=\"local-link\" title=\"リポジトリ内のファイル（HTML単体のコピー先では参照できません）\">Material\u003c/a> も Game 側から直接操作する API／ABI を未確定とする。\u003c/td>\n\u003ctd>共有 Header と各 API の実際の引数・寿命・コンパイラ／Runtime 設定をレビューして決める。外部安定 Plugin ABI を先に要求しない。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>\u003cstrong>資料に明記された範囲の不足\u003c/strong>：このコピーには独立した \u003ccode>Runtime/\u003c/code>／\u003ccode>Editor/\u003c/code> 資料、Input・Audio・Physics の個別機能資料、参照先の \u003ccode>SimpleArchitecture\u003c/code> 等がない。\u003ca href=\"#page=DesignSources.md\">DesignSources\u003c/a> のコピー時点と収録範囲を超えた判断は保留する。\u003c/p>\n\u003ch2 id=\"section-将来案ecsの初期構成指定とprefab復元\">将来案：ECSの初期構成指定とPrefab復元\u003ca class=\"heading-link\" aria-label=\"この見出しへのリンク\" href=\"#page=OpenDecisions.md&amp;section=%E5%B0%86%E6%9D%A5%E6%A1%88ecs%E3%81%AE%E5%88%9D%E6%9C%9F%E6%A7%8B%E6%88%90%E6%8C%87%E5%AE%9A%E3%81%A8prefab%E5%BE%A9%E5%85%83\">#\u003c/a>\u003c/h2>\n\u003cp>必要になった段階で追加を検討する未実装の案。API名・引数・Prefabの保存形式は未確定。\u003c/p>\n\u003cul>\n\u003cli>Component型ID列を受け取り、Name／Tag／Layerを含めた初期Archetypeへ直接生成する入口を設ける。\u003c/li>\n\u003cli>Process列を受け取る入口は、要求Componentの和集合へ変換し、同じ生成処理へ委譲する。EntityにProcess所属一覧は持たせない。\u003c/li>\n\u003cli>PrefabはComponentの型一覧と値を保存・復元し、復元後の構成に一致する登録済みProcessが自動的に処理する。Processが要求しないComponentも復元対象にできるようにする。\u003c/li>\n\u003cli>値の復元まで終えてからEntityを生成完了にする。非自明型を扱うため、単純なバイトコピーではなく型ごとの復元処理を用意する。\u003c/li>\n\u003cli>Process実行中の生成では構成・初期値情報を保留要求が所有し、既存の反映時点・要求順・生成取消の契約を維持する。\u003c/li>\n\u003c/ul>\n","sources":["OpenDecisions.md"],"sections":[]}],"sourceRoutes":{"Architecture.md":{"page":"Architecture.md"},"BuildTroubleshooting.md":{"page":"BuildTroubleshooting.md"},"CodingExamples.md":{"page":"CodingExamples.md"},"CodingStandard.md":{"page":"CodingStandard.md"},"DesignSources.md":{"page":"DesignSources.md"},"GraphicsPerformanceNotes.md":{"page":"GraphicsPerformanceNotes.md"},"Implementation/Application/README.md":{"page":"Implementation/Application/README.md","section":"document-readme"},"Implementation/Application/Types.md":{"page":"Implementation/Application/README.md","section":"document-types"},"Implementation/Asset/README.md":{"page":"Implementation/Asset/README.md","section":"document-readme"},"Implementation/Asset/Types.md":{"page":"Implementation/Asset/README.md","section":"document-types"},"Implementation/Common/README.md":{"page":"Implementation/Common/README.md","section":"document-readme"},"Implementation/Common/Types.md":{"page":"Implementation/Common/README.md","section":"document-types"},"Implementation/ECS/Process.md":{"page":"Implementation/ECS/README.md","section":"document-process"},"Implementation/ECS/README.md":{"page":"Implementation/ECS/README.md","section":"document-readme"},"Implementation/ECS/Types.md":{"page":"Implementation/ECS/README.md","section":"document-types"},"Implementation/Engine/README.md":{"page":"Implementation/Engine/README.md","section":"document-readme"},"Implementation/Engine/Types.md":{"page":"Implementation/Engine/README.md","section":"document-types"},"Implementation/Graphics/README.md":{"page":"Implementation/Graphics/README.md","section":"document-readme"},"Implementation/Graphics/Types.md":{"page":"Implementation/Graphics/README.md","section":"document-types"},"Implementation/Log/README.md":{"page":"Implementation/Log/README.md","section":"document-readme"},"Implementation/Log/Types.md":{"page":"Implementation/Log/README.md","section":"document-types"},"Implementation/README.md":{"page":"Implementation/README.md"},"Implementation/Time/README.md":{"page":"Implementation/Time/README.md","section":"document-readme"},"Implementation/Time/Types.md":{"page":"Implementation/Time/README.md","section":"document-types"},"OpenDecisions.md":{"page":"OpenDecisions.md"}},"diagrams":{"ecs-process":{"title":"Processの生成・登録から実行まで","caption":"RegisterProcessでProcessを生成してWorldへ登録し、要求Componentが揃うArchetypeをキャッシュする。Run(phase)は登録順・Chunk単位で関数を呼ぶ。AddProcessはEntityのComponent構成を変更する操作で、Processオブジェクトを生成する操作ではない。現在のRegisterECSにはゲームProcessの登録はなく、この図はWorldとProcessの実装された仕組みを説明する。","sources":["Docs/Implementation/ECS/Process.md","Engine/Include/ECS/ECSWorld.h","Engine/Include/ECS/ECSProcess.h","Engine/Include/ECS/ECSProcessExecution.h","Engine/Source/ECS/ECSWorld.cpp","Engine/Source/ECS/ECSProcess.cpp"],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1040 1260\" role=\"img\" aria-labelledby=\"process-title process-desc\">\n\u003ctitle id=\"process-title\">ECS Processの生成・登録、対象照合と実行の流れ\u003c/title>\n\u003cdesc id=\"process-desc\">RegisterProcessで関数の重複と受付状態を確認し、TraitsからComponent要求と共通入口を作る。WorldはProcessを所有し、既存および新規Archetypeとの一致をキャッシュする。Runはphaseの合うProcessを登録順に選び、非空ChunkごとにInvokeを介して元の関数へSoA配列を渡す。全Chunkの終了後に構造変更を反映する。\u003c/desc>\n\u003cdefs>\n\u003cmarker id=\"process-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"#52675d\"/>\u003c/marker>\n\u003c/defs>\n\u003cstyle>\ntext{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;fill:#24362d}\n.box{fill:#fff;stroke:#a8bbb0;stroke-width:1.4}.data{fill:#edf4ef;stroke:#9eb5a6;stroke-width:1.4}\n.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#process-arrow)}.reference{stroke-dasharray:6 4}\n.label{font-size:18px;font-weight:600}.small{font-size:13px;fill:#586b60}.code{font-family:Consolas,monospace;font-size:14px}\n.step{font-size:13px;font-weight:700;fill:#476253}\n\u003c/style>\n\u003crect width=\"1040\" height=\"1260\" fill=\"#fbfcfa\"/>\n\n\u003ctext x=\"28\" y=\"32\" class=\"label\">1. Processを生成してWorldへ登録する\u003c/text>\n\u003ctext x=\"28\" y=\"56\" class=\"small\">初期化中の登録期間。関数指定からphase・要求Component・呼び出し入口を組み立てる。\u003c/text>\n\n\u003crect class=\"box\" x=\"28\" y=\"78\" width=\"522\" height=\"96\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"104\" class=\"step\">01  関数とphaseを指定\u003c/text>\n\u003ctext x=\"46\" y=\"132\" class=\"code\">world.RegisterProcess&lt;Function&gt;(phase)\u003c/text>\n\u003ctext x=\"46\" y=\"156\" class=\"small\">ProcessKeyを作り、CanRegisterProcessで受付・重複を確認\u003c/text>\n\u003cpath class=\"line\" d=\"M289 174V207\"/>\n\n\u003crect class=\"box\" x=\"28\" y=\"207\" width=\"522\" height=\"112\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"234\" class=\"step\">02  ECSProcess::Create&lt;Function&gt;\u003c/text>\n\u003ctext x=\"46\" y=\"262\" class=\"code\">Traits = ECSProcessFunctionTraits&lt;decltype(Function)&gt;\u003c/text>\n\u003ctext x=\"46\" y=\"286\" class=\"small\">BuildComponents(registry) → 型ID・Read/Writeの要求一覧\u003c/text>\n\u003ctext x=\"46\" y=\"307\" class=\"small\">m_phaseと、m_invoke = Traits::Invoke&lt;Function&gt;を設定\u003c/text>\n\u003cpath class=\"line\" d=\"M289 319V352\"/>\n\n\u003crect class=\"box\" x=\"28\" y=\"352\" width=\"522\" height=\"99\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"379\" class=\"step\">03  World.RegisterProcessImpl\u003c/text>\n\u003ctext x=\"46\" y=\"407\">既存ArchetypeをMatchesArchetypeで照合\u003c/text>\n\u003ctext x=\"46\" y=\"431\" class=\"small\">要求型がすべて揃うものをRegisterArchetypeでキャッシュ\u003c/text>\n\u003cpath class=\"line\" d=\"M289 451V484\"/>\n\n\u003crect class=\"data\" x=\"28\" y=\"484\" width=\"522\" height=\"82\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"511\" class=\"step\">04  WorldがProcessを所有\u003c/text>\n\u003ctext x=\"46\" y=\"539\" class=\"code\">m_processes : vector&lt;unique_ptr&lt;ECSProcess&gt;&gt;\u003c/text>\n\u003ctext x=\"46\" y=\"558\" class=\"small\">登録順を保持。共通入口 → indexの索引も登録\u003c/text>\n\n\u003crect x=\"610\" y=\"78\" width=\"402\" height=\"186\" rx=\"5\" fill=\"#f5f6f2\" stroke=\"#cbd5cc\"/>\n\u003ctext x=\"629\" y=\"108\" class=\"label\">登録の前提・失敗\u003c/text>\n\u003ctext x=\"629\" y=\"137\" class=\"small\">・Component型はRegistryへ登録済み\u003c/text>\n\u003ctext x=\"629\" y=\"162\" class=\"small\">・const T*はRead、T*はWriteとして記録\u003c/text>\n\u003ctext x=\"629\" y=\"187\" class=\"small\">・同じ関数は別phaseでも重複登録しない\u003c/text>\n\u003ctext x=\"629\" y=\"212\" class=\"small\">・同型Componentの重複要求は生成時にIDで検査\u003c/text>\n\u003ctext x=\"629\" y=\"237\" class=\"small\">受付不可・生成／登録失敗はfalse\u003c/text>\n\n\u003crect class=\"box\" x=\"610\" y=\"300\" width=\"402\" height=\"83\" rx=\"5\"/>\n\u003ctext x=\"629\" y=\"329\">後から新しいArchetypeができた場合\u003c/text>\n\u003ctext x=\"629\" y=\"354\" class=\"small\">GetOrCreateArchetypeが登録済みProcessを照合\u003c/text>\n\u003ctext x=\"629\" y=\"375\" class=\"small\">Entity生成・AddProcess等による構成変更で発生\u003c/text>\n\u003cpath class=\"line\" d=\"M811 383V422\"/>\n\u003crect class=\"data\" x=\"610\" y=\"422\" width=\"402\" height=\"144\" rx=\"5\"/>\n\u003ctext x=\"629\" y=\"451\" class=\"label\">Processごとの実行対象キャッシュ\u003c/text>\n\u003ctext x=\"629\" y=\"480\" class=\"code\">m_archetypes : ECSProcessArchetype[]\u003c/text>\n\u003ctext x=\"629\" y=\"507\" class=\"small\">Archetype* ＋ 関数引数順のcolumnIndices\u003c/text>\n\u003ctext x=\"629\" y=\"532\" class=\"small\">Archetypeは非所有参照。不一致の構成は登録しない。\u003c/text>\n\u003ctext x=\"629\" y=\"554\" class=\"small\">毎回全Entityを検索せず、対応する列を保持する。\u003c/text>\n\u003cpath class=\"line reference\" d=\"M550 405H580V494H610\"/>\n\n\u003cpath d=\"M28 609H1012\" fill=\"none\" stroke=\"#ccd8ce\"/>\n\u003ctext x=\"28\" y=\"645\" class=\"label\">2. phaseの合うProcessを、Chunk単位で実行する\u003c/text>\n\n\u003crect class=\"box\" x=\"28\" y=\"678\" width=\"522\" height=\"81\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"705\" class=\"step\">05  World.Run(phase)\u003c/text>\n\u003ctext x=\"46\" y=\"734\">phaseが一致するProcessを登録順に選ぶ\u003c/text>\n\u003ctext x=\"46\" y=\"752\" class=\"small\">m_isRunningProcessをtrueにしてprocess-&gt;Run()\u003c/text>\n\u003cpath class=\"line\" d=\"M289 759V797\"/>\n\n\u003crect class=\"box\" x=\"28\" y=\"797\" width=\"522\" height=\"94\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"824\" class=\"step\">06  ECSProcess::Run\u003c/text>\n\u003ctext x=\"46\" y=\"851\">キャッシュした各ArchetypeのChunkを順に走査\u003c/text>\n\u003ctext x=\"46\" y=\"876\" class=\"code\">m_invoke(chunk, columnIndices)  // 空Chunkは除く\u003c/text>\n\u003cpath class=\"line reference\" d=\"M811 566V594H565V810H550\"/>\n\u003crect x=\"610\" y=\"678\" width=\"402\" height=\"104\" rx=\"5\" fill=\"#f5f6f2\" stroke=\"#cbd5cc\"/>\n\u003ctext x=\"629\" y=\"708\">Read / Writeは要求情報として保持\u003c/text>\n\u003ctext x=\"629\" y=\"736\" class=\"small\">現在は登録順・逐次実行。\u003c/text>\n\u003ctext x=\"629\" y=\"761\" class=\"small\">並列ジョブの依存スケジューリングは行わない。\u003c/text>\n\u003cpath class=\"line\" d=\"M289 891V930\"/>\n\n\u003crect class=\"box\" x=\"28\" y=\"930\" width=\"522\" height=\"97\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"957\" class=\"step\">07  Traits::Invoke → InvokeImpl → 元のFunction\u003c/text>\n\u003ctext x=\"46\" y=\"985\" class=\"code\">Function(count, entities, Components*...)\u003c/text>\n\u003ctext x=\"46\" y=\"1010\" class=\"small\">row 0の各SoA列を要求型へcastし、引数順に渡す\u003c/text>\n\u003cpath class=\"line\" d=\"M550 978H580V844H550\"/>\n\u003ctext x=\"610\" y=\"1005\" class=\"small\">次のChunkへ繰り返す\u003c/text>\n\u003crect x=\"610\" y=\"822\" width=\"402\" height=\"137\" rx=\"5\" fill=\"#f8f3e8\" stroke=\"#c6b486\"/>\n\u003ctext x=\"629\" y=\"852\">countはChunk内の構築済み全row数\u003c/text>\n\u003ctext x=\"629\" y=\"881\" class=\"small\">inactive・破棄予約済みEntityも含まれる。\u003c/text>\n\u003ctext x=\"629\" y=\"906\" class=\"small\">activeだけ処理したい関数はIsActiveを確認する。\u003c/text>\n\u003ctext x=\"629\" y=\"931\" class=\"small\">Entity配列と各Component配列の同じ添字が対応。\u003c/text>\n\u003cpath class=\"line\" d=\"M289 1027V1080\"/>\n\u003ctext x=\"307\" y=\"1059\" class=\"small\">そのProcessの全Chunkが終了\u003c/text>\n\n\u003crect class=\"data\" x=\"28\" y=\"1080\" width=\"984\" height=\"91\" rx=\"5\"/>\n\u003ctext x=\"46\" y=\"1108\" class=\"step\">08  Worldへ戻り、構造変更を反映して次のProcessへ\u003c/text>\n\u003ctext x=\"46\" y=\"1136\">m_isRunningProcess = false → FlushChanges() → 同じphaseの次のProcess\u003c/text>\n\u003ctext x=\"46\" y=\"1159\" class=\"small\">Entityの実体破棄はこの時点ではなくEndFrame。Chunkの走査中は構造変更要求を保留する。\u003c/text>\n\u003ctext x=\"28\" y=\"1207\" class=\"small\">関数例外時は残りのChunk走査を中断。Worldがログを記録し、構造変更反映後に現在のRunを終了する。\u003c/text>\n\u003ctext x=\"28\" y=\"1234\" class=\"small\">実線：呼び出し・処理の順序　破線：実行対象キャッシュの準備・参照。Engine統合経路の成立確認とは区別する。\u003c/text>\n\u003c/svg>\n"},"system":{"title":"Systemの所有とDLL境界","caption":"実線は所有、破線は非所有の接続。GameRuntimeなど未実装の予定要素は含めない。","sources":["Docs/Implementation/README.md","Engine/Include/Engine.h","Application/Include/Application.h"],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 590\" role=\"img\" aria-labelledby=\"system-title system-desc\">\n\u003ctitle id=\"system-title\">ApplicationとEngine内のSystemの所有関係\u003c/title>\n\u003cdesc id=\"system-desc\">Applica
