tionはWindowを所有し、EngineAPIとHandleでDLLを操作する。EngineはLog、Time、Graphics、Asset、ECSを所有する。ApplicationAPIとAssetからGraphicsへの接続は非所有。\u003c/desc>\n\u003cdefs>\u003cmarker id=\"system-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"#52675d\"/>\u003c/marker>\u003c/defs>\n\u003cstyle>text{font-family:'Yu Gothic UI',Meiryo,sans-serif;fill:#24362d;font-size:15px}.box{fill:white;stroke:#a8bbb0;stroke-width:1.4}.label{font-weight:600;font-size:18px}.small{font-size:13px;fill:#586b60}.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#system-arrow)}.borrow{stroke-dasharray:6 4}\u003c/style>\n\u003crect x=\"275\" y=\"25\" width=\"660\" height=\"492\" rx=\"8\" fill=\"#f1f5f1\" stroke=\"#cad6cd\"/>\n\u003ctext x=\"298\" y=\"57\" class=\"small\">Engine.dll 内部\u003c/text>\n\u003crect class=\"box\" x=\"26\" y=\"92\" width=\"205\" height=\"103\" rx=\"5\"/>\n\u003ctext x=\"47\" y=\"124\" class=\"label\">Application\u003c/text>\u003ctext x=\"47\" y=\"151\" class=\"small\">Window・フレーム進行\u003c/text>\u003ctext x=\"47\" y=\"174\" class=\"small\">DLLロード状態・Handle\u003c/text>\n\u003crect class=\"box\" x=\"26\" y=\"277\" width=\"205\" height=\"82\" rx=\"5\"/>\n\u003ctext x=\"47\" y=\"310\" class=\"label\">Window\u003c/text>\u003ctext x=\"47\" y=\"337\" class=\"small\">HWNDとタイトル\u003c/text>\n\u003cpath class=\"line\" d=\"M128 195V277\"/>\u003ctext x=\"140\" y=\"240\" class=\"small\">所有\u003c/text>\n\u003crect class=\"box\" x=\"388\" y=\"92\" width=\"353\" height=\"103\" rx=\"5\"/>\n\u003ctext x=\"410\" y=\"125\" class=\"label\">Engine\u003c/text>\u003ctext x=\"410\" y=\"153\" class=\"small\">Systemを値所有・更新と終了を調停\u003c/text>\u003ctext x=\"410\" y=\"176\" class=\"small\">ApplicationAPIを値で保持\u003c/text>\n\u003cpath class=\"line borrow\" d=\"M231 124H388\"/>\u003ctext x=\"246\" y=\"108\" class=\"small\">EngineAPI\u003c/text>\n\u003cpath class=\"line borrow\" d=\"M388 172H231\"/>\u003ctext x=\"244\" y=\"198\" class=\"small\">ApplicationAPI\u003c/text>\u003ctext x=\"242\" y=\"219\" class=\"small\">contextは非所有\u003c/text>\n\u003cpath d=\"M564 195V237H379M564 237H832M379 237V273M605 237V273M832 237V273\" fill=\"none\" stroke=\"#52675d\" stroke-width=\"1.5\"/>\n\u003ctext x=\"579\" y=\"226\" class=\"small\">所有\u003c/text>\n\u003crect class=\"box\" x=\"299\" y=\"273\" width=\"162\" height=\"66\" rx=\"4\"/>\u003ctext x=\"318\" y=\"312\" class=\"label\">LogSystem\u003c/text>\n\u003crect class=\"box\" x=\"517\" y=\"273\" width=\"176\" height=\"66\" rx=\"4\"/>\u003ctext x=\"535\" y=\"312\" class=\"label\">TimeSystem\u003c/text>\n\u003crect class=\"box\" x=\"739\" y=\"273\" width=\"173\" height=\"66\" rx=\"4\"/>\u003ctext x=\"754\" y=\"312\" class=\"label\">ECSSystem\u003c/text>\n\u003cpath d=\"M489 237V370H413V398M489 370H718V398\" fill=\"none\" stroke=\"#52675d\" stroke-width=\"1.5\"/>\n\u003crect class=\"box\" x=\"299\" y=\"398\" width=\"229\" height=\"79\" rx=\"4\"/>\u003ctext x=\"319\" y=\"429\" class=\"label\">AssetSystem\u003c/text>\u003ctext x=\"319\" y=\"455\" class=\"small\">CPU実体・名前索引を所有\u003c/text>\n\u003crect class=\"box\" x=\"614\" y=\"398\" width=\"298\" height=\"79\" rx=\"4\"/>\u003ctext x=\"634\" y=\"429\" class=\"label\">GraphicsSystem\u003c/text>\u003ctext x=\"634\" y=\"455\" class=\"small\">DX12Backend・GPU資源を所有\u003c/text>\n\u003cpath class=\"line borrow\" d=\"M528 447H614\"/>\u003ctext x=\"537\" y=\"433\" class=\"small\">借用\u003c/text>\n\u003cpath class=\"line\" d=\"M37 555H98\"/>\u003ctext x=\"113\" y=\"560\" class=\"small\">所有\u003c/text>\u003cpath class=\"line borrow\" d=\"M220 555H281\"/>\u003ctext x=\"296\" y=\"560\" class=\"small\">非所有の参照・API接続\u003c/text>\n\u003c/svg>\n"},"frame":{"title":"コードに記述されたフレーム進行","caption":"固定更新は蓄積時間に応じて0回以上。通常更新ではTimeとECS phaseを進め、Render後にEndFrameを置く。実機上の成立はビルド・単体テストの結果と区別する。","sources":["Docs/Implementation/Engine/README.md","Application/Source/Application.cpp","Engine/Source/Engine.cpp"],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 620\" role=\"img\" aria-labelledby=\"frame-title frame-desc\">\n\u003ctitle id=\"frame-title\">固定更新と通常フレームの呼出順\u003c/title>\n\u003cdesc id=\"frame-desc\">メッセージ処理後に経過時間を蓄積し、固定刻み以上の間はTime更新とECS FixedUpdateを繰り返す。その後Time通常更新、ECSの四phase、描画提出、Render、EndFrameへ進む。現在のECS呼び出しに不整合がある。\u003c/desc>\n\u003cdefs>\u003cmarker id=\"frame-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"#52675d\"/>\u003c/marker>\u003c/defs>\n\u003cstyle>text{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;fill:#24362d}.box{fill:#fff;stroke:#a8bbb0;stroke-width:1.4}.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#frame-arrow)}.small{font-size:13px;fill:#586b60}.label{font-size:17px;font-weight:600}\u003c/style>\n\u003ctext x=\"29\" y=\"34\" class=\"label\">Application：固定更新を0回以上\u003c/text>\u003ctext x=\"508\" y=\"34\" class=\"label\">Engine：通常フレームを1回\u003c/text>\n\u003crect class=\"box\" x=\"29\" y=\"62\" width=\"360\" height=\"74\" rx=\"5\"/>\u003ctext x=\"49\" y=\"93\">Window Messageを処理\u003c/text>\u003ctext x=\"49\" y=\"117\" class=\"small\">終了でなければ、経過時間を蓄積\u003c/text>\n\u003cpath class=\"line\" d=\"M210 136V167\"/>\n\u003cpath d=\"M210 167 389 222 210 277 29 222Z\" fill=\"#edf4f0\" stroke=\"#a8bbb0\" stroke-width=\"1.4\"/>\u003ctext x=\"210\" y=\"217\" text-anchor=\"middle\">蓄積時間 ≥ 固定刻み？\u003c/text>\u003ctext x=\"210\" y=\"240\" text-anchor=\"middle\" class=\"small\">刻みは既定1/60秒\u003c/text>\n\u003cpath class=\"line\" d=\"M210 277V325\"/>\u003ctext x=\"222\" y=\"305\" class=\"small\">はい\u003c/text>\n\u003crect class=\"box\" x=\"29\" y=\"325\" width=\"360\" height=\"90\" rx=\"5\"/>\u003ctext x=\"49\" y=\"355\">Engine.FixedUpdate\u003c/text>\u003ctext x=\"49\" y=\"380\" class=\"small\">Time.UpdateFixed → ECS FixedUpdate\u003c/text>\u003ctext x=\"49\" y=\"401\" class=\"small\">Application側で蓄積から固定刻みを引く\u003c/text>\n\u003cpath class=\"line\" d=\"M29 370H12V222H29\"/>\n\u003cpath class=\"line\" d=\"M389 222H468V99H508\"/>\u003ctext x=\"404\" y=\"207\" class=\"small\">いいえ\u003c/text>\n\u003crect class=\"box\" x=\"508\" y=\"62\" width=\"420\" height=\"74\" rx=\"5\"/>\u003ctext x=\"528\" y=\"93\">Time.Update\u003c/text>\u003ctext x=\"528\" y=\"117\" class=\"small\">通常のdelta・total時間を更新\u003c/text>\n\u003cpath class=\"line\" d=\"M718 136V167\"/>\n\u003crect class=\"box\" x=\"508\" y=\"167\" width=\"420\" height=\"88\" rx=\"5\"/>\u003ctext x=\"528\" y=\"198\">ECS phaseを順に実行\u003c/text>\u003ctext x=\"528\" y=\"226\" class=\"small\">FrameBegin → Update → LateUpdate → PreRender\u003c/text>\u003ctext x=\"528\" y=\"247\" class=\"small\">各phase内はProcess登録順\u003c/text>\n\u003cpath class=\"line\" d=\"M718 255V286\"/>\n\u003crect class=\"box\" x=\"508\" y=\"286\" width=\"420\" height=\"64\" rx=\"5\"/>\u003ctext x=\"528\" y=\"325\">デバッグ描画をSubmit\u003c/text>\n\u003cpath class=\"line\" d=\"M718 350V381\"/>\n\u003crect class=\"box\" x=\"508\" y=\"381\" width=\"420\" height=\"64\" rx=\"5\"/>\u003ctext x=\"528\" y=\"420\">Graphics.Render\u003c/text>\n\u003cpath class=\"line\" d=\"M718 445V476\"/>\n\u003crect class=\"box\" x=\"508\" y=\"476\" width=\"420\" height=\"74\" rx=\"5\"/>\u003ctext x=\"528\" y=\"507\">ECS.EndFrame\u003c/text>\u003ctext x=\"528\" y=\"531\" class=\"small\">破棄予約済みEntityの実体を解放\u003c/text>\n\u003ctext x=\"29\" y=\"470\" class=\"small\">Process中の構造変更は、\u003c/text>\u003ctext x=\"29\" y=\"493\" class=\"small\">そのProcessの全Chunk実行後に反映。\u003c/text>\u003ctext x=\"29\" y=\"521\" class=\"small\">Entityの実体破棄はEndFrameまで待つ。\u003c/text>\n\u003crect x=\"29\" y=\"575\" width=\"899\" height=\"29\" rx=\"3\" fill=\"#f4eee0\"/>\u003ctext x=\"44\" y=\"595\" class=\"small\">コードに記述された呼出順の説明。非static ECS関数の呼び出し不整合があり、統合動作は未確認。\u003c/text>\n\u003c/svg>\n"},"asset":{"title":"CPU登録とGPU転送","caption":"CPU AssetのHandleが有効でもGPU転送成功とは限らない。GetはCPU実体を借用する。","sources":["Docs/Implementation/Asset/README.md","Engine/Source/Asset/AssetSystem.cpp","Engine/Source/Asset/AssetLoader.cpp"],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 575\" role=\"img\" aria-labelledby=\"asset-title asset-desc\">\n\u003ctitle id=\"asset-title\">Assetの名前解決、CPU登録、GPU転送の流れ\u003c/title>\n\u003cdesc id=\"asset-desc\">Texture Loadは名前Cacheを確認し、未登録ならDBとWICデコードを経てCPUに登録する。Meshは手動RegisterでCPU登録する。登録後のGPU転送が失敗してもCPU実体とHandleを保持する。\u003c/desc>\n\u003cdefs>\u003cmarker id=\"asset-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"#52675d\"/>\u003c/marker>\u003c/defs>\n\u003cstyle>text{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;fill:#24362d}.box{fill:#fff;stroke:#a8bbb0;stroke-width:1.4}.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#asset-arrow)}.small{font-size:13px;fill:#586b60}.label{font-size:17px;font-weight:600}\u003c/style>\n\u003ctext x=\"28\" y=\"34\" class=\"label\">名前によるTextureロード\u003c/text>\n\u003crect class=\"box\" x=\"28\" y=\"57\" width=\"182\" height=\"68\" rx=\"4\"/>\u003ctext x=\"46\" y=\"97\">Load&lt;Texture&gt;\u003c/text>\n\u003cpath class=\"line\" d=\"M210 91H266\"/>\n\u003crect class=\"box\" x=\"266\" y=\"57\" width=\"230\" height=\"68\" rx=\"4\"/>\u003ctext x=\"285\" y=\"86\">名前Cacheを検索\u003c/text>\u003ctext x=\"285\" y=\"109\" class=\"small\">ASCII英字の大小を同一視\u003c/text>\n\u003cpath class=\"line\" d=\"M496 91H555\"/>\u003ctext x=\"507\" y=\"76\" class=\"small\">未登録\u003c/text>\n\u003crect class=\"box\" x=\"555\" y=\"57\" width=\"375\" height=\"68\" rx=\"4\"/>\u003ctext x=\"574\" y=\"86\">DB照合 → WICデコード・RGBA8変換\u003c/text>\u003ctext x=\"574\" y=\"109\" class=\"small\">未登録・型不一致・読込失敗なら無効Handle\u003c/text>\n\u003cpath class=\"line\" d=\"M382 125V175H28\"/>\u003ctext x=\"143\" y=\"165\" class=\"small\">登録済みなら既存Handleを返す\u003c/text>\n\u003crect class=\"box\" x=\"28\" y=\"234\" width=\"251\" height=\"80\" rx=\"4\"/>\u003ctext x=\"47\" y=\"265\">Register&lt;Mesh&gt;\u003c/text>\u003ctext x=\"47\" y=\"290\" class=\"small\">所有権を受け取り妥当性確認\u003c/text>\n\u003cpath class=\"line\" d=\"M279 274H365\"/>\n\u003cpath class=\"line\" d=\"M743 125V187H510V234\"/>\n\u003crect x=\"365\" y=\"234\" width=\"288\" height=\"80\" rx=\"4\" fill=\"#eaf2ec\" stroke=\"#8ea99b\" stroke-width=\"1.4\"/>\u003ctext x=\"386\" y=\"265\" class=\"label\">CPU AssetStorageに登録\u003c/text>\u003ctext x=\"386\" y=\"290\" class=\"small\">実体を所有し、Handleを割り当てる\u003c/text>\n\u003cpath class=\"line\" d=\"M509 314V363\"/>\u003ctext x=\"523\" y=\"344\" class=\"small\">同じindex / generationで対応付け\u003c/text>\n\u003crect class=\"box\" x=\"365\" y=\"363\" width=\"288\" height=\"74\" rx=\"4\"/>\u003ctext x=\"385\" y=\"393\">GraphicsへGPU転送を依頼\u003c/text>\u003ctext x=\"385\" y=\"417\" class=\"small\">Mesh Buffer / Texture Resource\u003c/text>\n\u003cpath class=\"line\" d=\"M365 401H185V480\"/>\u003ctext x=\"239\" y=\"386\" class=\"small\">成功\u003c/text>\n\u003cpath class=\"line\" d=\"M653 401H793V480\"/>\u003ctext x=\"717\" y=\"386\" class=\"small\">失敗\u003c/text>\n\u003crect class=\"box\" x=\"28\" y=\"480\" width=\"325\" height=\"65\" rx=\"4\"/>\u003ctext x=\"48\" y=\"508\">CPU Asset + GPU Resource\u003c/text>\u003ctext x=\"48\" y=\"532\" class=\"small\">有効Handleを返す\u003c/text>\n\u003crect x=\"586\" y=\"480\" width=\"344\" height=\"65\" rx=\"4\" fill=\"#f8f3e8\" stroke=\"#c6b486\"/>\u003ctext x=\"606\" y=\"508\">CPU Assetと有効Handleは維持\u003c/text>\u003ctext x=\"606\" y=\"532\" class=\"small\">転送失敗をログ出力。GPU実体は保証しない\u003c/text>\n\u003ctext x=\"28\" y=\"362\" class=\"small\">MeshのファイルLoadは未対応。\u003c/text>\u003ctext x=\"28\" y=\"384\" class=\"small\">Textureの手動Registerは拒否。\u003c/text>\n\u003c/svg>\n"},"ecs-layout":{"title":"HandleからSoA列への参照","caption":"同じrowが同じEntityに対応する。構造変更で位置が変わるため、生ポインタを長期保持せずHandleから再取得する。","sources":["Docs/Implementation/ECS/README.md","Engine/Include/ECS/Entity.h","Engine/Source/ECS/Archetype.cpp","Engine/Source/ECS/Chunk.cpp"],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 590\" role=\"img\" aria-labelledby=\"layout-title layout-desc\">\n\u003ctitle id=\"layout-title\">EntityHandleとslotからChunkのSoA列を参照する構造\u003c/title>\n\u003cdesc id=\"layout-desc\">Handleのindexとgenerationをslot表で照合し、Archetype、Chunk、rowを得る。ChunkではEntity列とComponentごとの列が連続し、同じrowが対応する。配置図は模式図でbyte比率ではない。\u003c/desc>\n\u003cdefs>\u003cmarker id=\"layout-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"#52675d\"/>\u003c/marker>\u003c/defs>\n\u003cstyle>text{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;fill:#24362d}.box{fill:#fff;stroke:#a8bbb0;stroke-width:1.4}.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#layout-arrow)}.small{font-size:13px;fill:#586b60}.label{font-size:17px;font-weight:600}\u003c/style>\n\u003crect class=\"box\" x=\"27\" y=\"28\" width=\"226\" height=\"85\" rx=\"4\"/>\u003ctext x=\"46\" y=\"60\" class=\"label\">EntityHandle\u003c/text>\u003ctext x=\"46\" y=\"86\" class=\"small\">index（下位30bit）・generation\u003c/text>\n\u003cpath class=\"line\" d=\"M253 71H317\"/>\n\u003crect class=\"box\" x=\"317\" y=\"28\" width=\"291\" height=\"85\" rx=\"4\"/>\u003ctext x=\"337\" y=\"60\" class=\"label\">Worldのslot表\u003c/text>\u003ctext x=\"337\" y=\"86\" class=\"small\">世代・状態・Archetype・Chunk・row\u003c/text>\n\u003cpath class=\"line\" d=\"M608 71H676\"/>\n\u003crect class=\"box\" x=\"676\" y=\"28\" width=\"257\" height=\"85\" rx=\"4\"/>\u003ctext x=\"695\" y=\"60\" class=\"label\">Archetype\u003c/text>\u003ctext x=\"695\" y=\"86\" class=\"small\">型IDの集合・Layout・Chunk群\u003c/text>\n\u003cpath class=\"line\" d=\"M805 113V170H501V207\"/>\u003ctext x=\"536\" y=\"158\" class=\"small\">共通Layoutで配置（Registryの型情報を借用）\u003c/text>\n\u003crect x=\"27\" y=\"207\" width=\"906\" height=\"290\" rx=\"6\" fill=\"#f0f5f1\" stroke=\"#c3d1c7\"/>\n\u003ctext x=\"48\" y=\"239\" class=\"label\">固定サイズChunk：既定16KiB\u003c/text>\u003ctext x=\"48\" y=\"266\" class=\"small\">Entity列を先頭に、Component列をalignmentとpadding込みで配置\u003c/text>\n\u003cg transform=\"translate(47 294)\">\n\u003crect class=\"box\" width=\"200\" height=\"158\"/>\u003crect class=\"box\" x=\"215\" width=\"200\" height=\"158\"/>\u003crect class=\"box\" x=\"430\" width=\"200\" height=\"158\"/>\u003crect class=\"box\" x=\"645\" width=\"220\" height=\"158\"/>\n\u003ctext x=\"15\" y=\"29\">Entity列\u003c/text>\u003ctext x=\"230\" y=\"29\">Name列\u003c/text>\u003ctext x=\"445\" y=\"29\">Tag列\u003c/text>\u003ctext x=\"660\" y=\"29\">Layer・追加Component列\u003c/text>\n\u003cpath d=\"M0 44H865M0 80H865M0 116H865\" fill=\"none\" stroke=\"#dce4dd\"/>\n\u003crect x=\"0\" y=\"80\" width=\"865\" height=\"36\" fill=\"#dbeade\"/>\n\u003ctext x=\"15\" y=\"69\" class=\"small\">row 0\u003c/text>\u003ctext x=\"230\" y=\"69\" class=\"small\">Name[0]\u003c/text>\u003ctext x=\"445\" y=\"69\" class=\"small\">Tag[0]\u003c/text>\u003ctext x=\"660\" y=\"69\" class=\"small\">Layer[0] …\u003c/text>\n\u003ctext x=\"15\" y=\"104\">row 1\u003c/text>\u003ctext x=\"230\" y=\"104\">Name[1]\u003c/text>\u003ctext x=\"445\" y=\"104\">Tag[1]\u003c/text>\u003ctext x=\"660\" y=\"104\">Layer[1] …\u003c/text>\n\u003ctext x=\"15\" y=\"143\" class=\"small\">row 2 …\u003c/text>\u003ctext x=\"230\" y=\"143\" class=\"small\">Name[2] …\u003c/text>\u003ctext x=\"445\" y=\"143\" class=\"small\">Tag[2] …\u003c/text>\u003ctext x=\"660\" y=\"143\" class=\"small\">Layer[2] …\u003c/text>\n\u003c/g>\n\u003ctext x=\"48\" y=\"480\" class=\"small\">強調した同じrowが、一つのEntityのデータに対応する（byte比率ではない模式図）\u003c/text>\n\u003ctext x=\"27\" y=\"535\">構造変更でChunk・rowが変わる → slotを更新 → Handleから現在位置を再取得\u003c/text>\n\u003ctext x=\"27\" y=\"562\" class=\"small\">行の穴は末尾rowで詰めるため、行順は保持しない。Entity / Componentへの生ポインタは長期保持しない。\u003c/text>\n\u003c/svg>\n"},"ecs-life":{"title":"Entityの生成と破棄","caption":"破棄予約はAliveのEntityに付くbitで、独立したslot状態ではない。Process後の変更反映とEndFrameの破棄確定を区別する。","sources":["Docs/Implementation/ECS/README.md","Engine/Include/ECS/Entity.h","Engine/Source/ECS/ECSWorld.cpp"],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 560\" role=\"img\" aria-labelledby=\"life-title life-desc\">\n\u003ctitle id=\"life-title\">Entityの予約、生成、破棄予約と解放\u003c/title>\n\u003cdesc id=\"life-desc\">Process実行中の生成はPendingCreateを経てProcess完了後にAliveへ移る。実行外では直接生成する。PendingCreateの破棄要求は取消。Aliveの破棄要求は破棄bitを設定し、EndFrameまで実体を残してからslotを解放する。\u003c/desc>\n\u003cdefs>\u003cmarker id=\"life-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"#52675d\"/>\u003c/marker>\u003c/defs>\n\u003cstyle>text{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;fill:#24362d}.box{fill:#fff;stroke:#a8bbb0;stroke-width:1.4}.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#life-arrow)}.small{font-size:13px;fill:#586b60}.label{font-size:17px;font-weight:600}\u003c/style>\n\u003crect class=\"box\" x=\"28\" y=\"125\" width=\"177\" height=\"92\" rx=\"5\"/>\u003ctext x=\"49\" y=\"160\" class=\"label\">Free\u003c/text>\u003ctext x=\"49\" y=\"187\" class=\"small\">slot未割当\u003c/text>\n\u003cpath class=\"line\" d=\"M205 171H332\"/>\u003ctext x=\"216\" y=\"116\" class=\"small\">CreateEntity\u003c/text>\u003ctext x=\"216\" y=\"138\" class=\"small\">Process実行中\u003c/text>\n\u003crect class=\"box\" x=\"332\" y=\"125\" width=\"264\" height=\"92\" rx=\"5\"/>\u003ctext x=\"351\" y=\"160\" class=\"label\">PendingCreate\u003c/text>\u003ctext x=\"351\" y=\"187\" class=\"small\">Handleのみ予約・実体未構築\u003c/text>\n\u003cpath class=\"line\" d=\"M596 171H722\"/>\u003ctext x=\"609\" y=\"116\" class=\"small\">Process完了後\u003c/text>\u003ctext x=\"609\" y=\"138\" class=\"small\">生成を反映\u003c/text>\n\u003crect class=\"box\" x=\"722\" y=\"125\" width=\"210\" height=\"92\" rx=\"5\"/>\u003ctext x=\"742\" y=\"160\" class=\"label\">Alive\u003c/text>\u003ctext x=\"742\" y=\"187\" class=\"small\">Entity・Componentを保持\u003c/text>\n\u003cpath class=\"line\" d=\"M116 125V48H826V125\"/>\u003ctext x=\"278\" y=\"35\" class=\"small\">CreateEntity：Process実行外はその場で構築\u003c/text>\n\u003cpath class=\"line\" d=\"M464 217V279H116V217\"/>\u003ctext x=\"208\" y=\"266\" class=\"small\">DestroyEntity：生成取消・slot解放\u003c/text>\n\u003cpath class=\"line\" d=\"M826 217V329\"/>\u003ctext x=\"650\" y=\"270\" class=\"small\">DestroyEntity\u003c/text>\n\u003crect x=\"628\" y=\"329\" width=\"304\" height=\"103\" rx=\"5\" fill=\"#f8f3e8\" stroke=\"#c6b486\"/>\n\u003ctext x=\"649\" y=\"360\" class=\"label\">Alive ＋ 破棄予約bit\u003c/text>\u003ctext x=\"649\" y=\"386\" class=\"small\">IsActiveはfalse\u003c/text>\u003ctext x=\"649\" y=\"410\" class=\"small\">実体・Componentはまだ生存\u003c/text>\n\u003cpath class=\"line\" d=\"M628 381H70V217\"/>\u003ctext x=\"234\" y=\"366\" class=\"small\">EndFrame：実体破棄・穴詰め・世代更新\u003c/text>\n\u003crect x=\"28\" y=\"476\" width=\"904\" height=\"59\" rx=\"4\" fill=\"#edf4f0\"/>\n\u003ctext x=\"46\" y=\"501\">GetEntity / GetComponent：PendingCreateではnullptr。Aliveは構造変更時の借用制限に従う。\u003c/text>\n\u003ctext x=\"46\" y=\"524\" class=\"small\">generation更新後は古いHandleを拒否。全世代周回後の再一致は許容する。\u003c/text>\n\u003c/svg>\n"}},"warnings":[],"renderer":"marked 17.0.5 / MIT"}</script>
<script>
/* 正本は生成時に埋め込む。閲覧時のファイル取得・通信は行わない */
const data = JSON.parse(document.getElementById('wiki-data').textContent);
const categories = new Map(data.categories.map(category => [category.id, category]));
const pages = new Map(data.pages.map(page => [page.source, page]));
const content = document.getElementById('content');
const main = document.getElementById('main');
const search = document.getElementById('search');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
const menuOpen = document.getElementById('menu-open');
const mobile = matchMedia('(max-width:760px)');
const escapeHtml = text => String(text).replace(/[&<>"']/g, value => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[value]);
const route = values => '#' + new URLSearchParams(values);
const normalize = value => value.normalize('NFKC').toLocaleLowerCase('ja');
const categoryChildren = id => data.categories.filter(category => category.parent === id);
const directPages = id => data.pages.filter(page => page.category === id).sort((a,b) => a.order - b.order || a.title.localeCompare(b.title,'ja'));
const rootOf = id => { while(categories.get(id)?.parent) id = categories.get(id).parent; return id; };
const descendants = id => [id, ...categoryChildren(id).flatMap(category => descendants(category.id))];
const allPages = id => descendants(id).flatMap(directPages);
const searchDocuments = data.pages.map(page => {
    const element = document.createElement('div');
    element.innerHTML = page.html;
    const body = element.textContent.replace(/\s+/g, ' ').trim();
    return { page, body, text:normalize(body), title:normalize(page.title), headings:normalize(page.headings.map(heading => heading.text).join(' ')), types:normalize(Array.from(element.querySelectorAll('code')).map(code => code.textContent).join(' ')), sections:Array.from(element.querySelectorAll('.document-section')).map(section => ({id:section.id.slice('section-'.length),text:normalize(section.textContent)})) };
});

function CategoryTree(category)
{
    const documents = directPages(category.id).flatMap(page => page.sections.length ? page.sections.map(section => ({source:page.source,label:section.label,section:section.id})) : [page]).map(page => `<li><a class="page-link" href="${route({page:page.source,...(page.section ? {section:page.section} : {})})}" data-page="${escapeHtml(page.source)}">${escapeHtml(page.label)}</a></li>`).join('');
    const children = categoryChildren(category.id).map(CategoryTree).join('');
    const list = `<ul class="nav-list">${documents}${children}</ul>`;
    if (category.parent)
        return `<li class="category-item"><details class="system-menu" data-category="${category.id}"><summary><span>${escapeHtml(category.title)}</span></summary>${list}</details></li>`;

    return `<li class="category-block"><details class="block-menu" data-category="${category.id}" open><summary class="block-heading" id="nav-${category.id}"><span class="root-label">${escapeHtml(category.title)}</span><span class="count">${allPages(category.id).length}</span></summary>${list}</details></li>`;
}

function Breadcrumbs(categoryId, current)
{
    const chain = [];
    for (let category = categories.get(categoryId); category; category = categories.get(category.parent)) chain.unshift(category);
    return `<nav class="breadcrumbs" aria-label="現在位置"><a href="#home">仕様書一覧</a>${chain.map(category => `<span aria-hidden="true">/</span><a href="${route({category:category.id})}">${escapeHtml(category.title)}</a>`).join('')}${current ? `<span aria-hidden="true">/</span><span aria-current="page">${escapeHtml(current)}</span>` : ''}</nav>`;
}

function Header(title, description, eyebrow, metadata = '')
{
    return `<header class="page-header">${eyebrow ? `<p class="eyebrow">${escapeHtml(eyebrow)}</p>` : ''}<h1>${escapeHtml(title)}</h1>${description ? `<p class="lede">${escapeHtml(description)}</p>` : ''}${metadata ? `<div class="page-meta">${metadata}</div>` : ''}</header>`;
}

function PageList(documents)
{
    return `<ul class="page-list">${documents.map(page => `<li><a class="page-row" href="${route({page:page.source})}"><span class="row-top"><span class="row-title">${escapeHtml(page.title)}</span><span class="row-arrow" aria-hidden="true">→</span></span><span class="row-description">${escapeHtml(page.summary)}</span></a></li>`).join('')}</ul>`;
}

function CategorySections(category)
{
    const own = directPages(category.id);
    return `${own.length ? PageList(own) : ''}${categoryChildren(category.id).map(child => `<section class="category-section"><div class="category-heading"><h2><a href="${route({category:child.id})}">${escapeHtml(child.title)}</a></h2><span class="count">${allPages(child.id).length}ページ</span></div><p class="category-description">${escapeHtml(child.description)}</p>${CategorySections(child)}</section>`).join('')}`;
}

function SourceLinks(sources)
{
    return sources.map(source => {
        const document = source.startsWith('Docs/') ? data.sourceRoutes[source.slice(5)] : null;
        const href = document ? route(document) : '../' + source.split('/').map(encodeURIComponent).join('/');
        return `<a href="${href}"${document ? '' : ' class="local-link"'}>${escapeHtml(source.split('/').pop())}</a>`;
    }).join(' ');
}

function RenderPage(page)
{
    const root = categories.get(rootOf(page.category));
    const notes = page.notes.map(note => `<aside class="reading-note"><strong>閲覧上の注記（本文とは別）</strong><div>${escapeHtml(note.text)}</div><span class="note-sources">確認先：${SourceLinks(note.sources)}</span></aside>`).join('');
    const toc = page.headings.length ? `<details class="toc" open><summary>このページの目次</summary><ol>${page.headings.map(heading => `<li${heading.depth > 2 ? ' class="toc-sub"' : ''}><a href="${route({page:page.source,section:heading.id})}">${escapeHtml(heading.text)}</a></li>`).join('')}${page.diagrams.length ? `<li><a href="${route({page:page.source,section:'wiki-diagrams'})}">補助図解</a></li>${page.diagrams.map(id => `<li class="toc-sub"><a href="${route({page:page.source,section:'diagram-'+id})}">${escapeHtml(data.diagrams[id].title)}</a></li>`).join('')}` : ''}</ol></details>` : '';
    const diagrams = page.diagrams.length ? `<section class="diagrams" id="section-wiki-diagrams"><h2>補助図解</h2><p>正本Markdownと実装を確認するための補足です。仕様の定義は本文を参照してください。</p>${page.diagrams.map(id => {
        const diagram = data.diagrams[id];
        return `<figure class="diagram" id="section-diagram-${id}" style="scroll-margin-top:calc(var(--header) + 20px)"><div class="diagram-title"><h3>${escapeHtml(diagram.title)}</h3><button type="button" data-zoom="${id}">拡大表示</button></div><div class="diagram-canvas" tabindex="0" role="region" aria-label="${escapeHtml(diagram.title)}（横スクロール可能）">${diagram.svg}</div><figcaption>${escapeHtml(diagram.caption)}<div class="diagram-sources">根拠：${SourceLinks(diagram.sources)}</div></figcaption></figure>`;
    }).join('')}</section>` : '';
    const metadata = page.sections.length ? `<span>正本${page.sources.length}文書をSystem単位で収録</span>` : `<a class="local-link" href="${page.source.split('/').map(encodeURIComponent).join('/')}">正本Markdownを開く</a><span>${escapeHtml(page.source)}</span>`;
    content.innerHTML = Breadcrumbs(page.category,page.sections.length ? '' : page.label) + Header(page.title,'',root.title,metadata) + notes + toc + `<article class="article" aria-label="正本Markdown本文">${page.html}</article>` + diagrams + `<footer class="page-end"><a href="${route({category:page.category})}">← ${escapeHtml(categories.get(page.category).title)}の一覧</a><a href="${route({page:page.source})}">ページ先頭へ ↑</a></footer>`;
}

function Highlight(text, terms)
{
    const positions = [];
    const lower = normalize(text);
    for (const term of terms)
    {
        let position = lower.indexOf(term);
        while (position !== -1)
        {
            positions.push([position, position + term.length]);
            position = lower.indexOf(term, position + term.length);
        }
    }
    positions.sort((a,b) => a[0] - b[0]);
    const ranges = [];
    for (const range of positions)
    {
        const previous = ranges.at(-1);
        if (previous && range[0] <= previous[1]) previous[1] = Math.max(previous[1], range[1]);
        else ranges.push(range);
    }
    let result = '', cursor = 0;
    for (const [start,end] of ranges)
    {
        result += escapeHtml(text.slice(cursor,start)) + '<mark>' + escapeHtml(text.slice(start,end)) + '</mark>';
        cursor = end;
    }
    return result + escapeHtml(text.slice(cursor));
}

function RenderSearch(query)
{
    const terms = normalize(query).trim().split(/\s+/).filter(Boolean);
    const matches = terms.length ? searchDocuments.filter(document => terms.every(term => document.text.includes(term) || document.title.includes(term))).map(document => ({...document,score:terms.reduce((score,term) => score + (document.title.includes(term) ? 12 : 0) + (document.headings.includes(term) ? 6 : 0) + (document.types.includes(term) ? 5 : 0),0)})).sort((a,b) => b.score-a.score || a.page.title.localeCompare(b.page.title,'ja')) : [];
    content.innerHTML = Breadcrumbs(null,'検索') + Header('検索結果',query ? `「${query}」の検索結果：${matches.length}ページ` : '型名、見出し、本文から検索できます。','全文検索') + (matches.length ? `<ul class="page-list">${matches.map(document => {
        const first = Math.min(...terms.map(term => document.text.indexOf(term)).filter(index => index >= 0));
        const start = Number.isFinite(first) ? Math.max(0,first-42) : 0;
        const excerpt = document.body.slice(start,start+180);
        const section = document.sections.find(section => terms.every(term => section.text.includes(term)));
        return `<li><a class="page-row" href="${route({page:document.page.source,...(section ? {section:section.id} : {})})}"><span class="row-top"><span class="row-title">${Highlight(document.page.title,terms)}</span><span class="row-arrow" aria-hidden="true">→</span></span><span class="row-path">${escapeHtml(categories.get(rootOf(document.page.category)).title)} / ${escapeHtml(categories.get(document.page.category).title)}</span><span class="row-description">${start ? '…' : ''}${Highlight(excerpt,terms)}${start+180<document.body.length ? '…' : ''}</span></a></li>`;
    }).join('')}</ul>` : '<p class="empty">該当する仕様書はありません。短い型名や別の語句で検索してください。</p>');
}

function SetMenu(open)
{
    sidebar.classList.toggle('is-open',open);
    overlay.classList.toggle('is-open',open);
    document.body.classList.toggle('nav-open',open);
    menuOpen.setAttribute('aria-expanded',String(open));
    if (mobile.matches) sidebar.inert = !open;
    if (open) search.focus();
}

function Render()
{
    const params = new URLSearchParams(location.hash.slice(1));
    const requestedSource = params.get('page');
    const legacyRoute = !pages.has(requestedSource) ? data.sourceRoutes[requestedSource] : null;
    const page = pages.get(legacyRoute?.page ?? requestedSource);
    const requestedSection = params.get('section');
    const section = legacyRoute?.section ? legacyRoute.section + (requestedSection ? '-'+requestedSection : '') : requestedSection;
    const category = categories.get(params.get('category'));
    const query = params.get('search');
    const isSearch = query !== null;
    search.value = isSearch ? query : '';
    document.getElementById('search-clear').hidden = !isSearch;
    let title = '仕様書一覧';
    if (page) { RenderPage(page); title = page.title; }
    else if (category)
    {
        title = category.title;
        content.innerHTML = Breadcrumbs(category.parent,category.title) + Header(title,category.description,`${allPages(category.id).length}ページ`) + CategorySections(category);
    }
    else if (isSearch) { RenderSearch(query); title = '検索結果'; }
    else if (params.has('guide'))
    {
        title = '更新方法・参照先について';
        content.innerHTML = Breadcrumbs(null,title) + Header(title,'Markdownが仕様の正本です。このHTMLは再生成して更新します。','閲覧ガイド') + `<div class="article"><h2>読む</h2><p>このHTMLを直接開くと、収録された${data.pages.length}ページ、全文検索、補助図解を通信なしで閲覧できます。ソースや正本への ↗ リンクはリポジトリ内のファイルを参照するため、HTMLを単体コピーした場合は利用できません。</p><h2>更新する</h2><ol><li>正本Markdownを編集します。</li><li>Node.jsが使える環境で <code>Tools\\SpecWiki\\Generate.cmd</code> を実行します。</li><li>生成された <code>Docs\\ImplementationWiki.html</code> を再読み込みします。</li></ol><p>文書を追加するときは、既存のSystemフォルダなら自動検出されます。新しい分類は <code>Tools/SpecWiki/catalog.json</code> に追加します。未分類の文書があれば生成を止めて対象を表示します。図解の元データは <code>Tools/SpecWiki/diagrams/</code> のSVGです。</p><h2>本文と補足</h2><p>本文はMarkdownから生成しています。「閲覧上の注記」と「補助図解」は本文と区別して表示します。設計参考資料や性能観測記録には過去の状態や未確定の案が含まれます。</p><h2>生成時に見つかった参照先不在</h2>${data.warnings.length ? '<p>以下は正本Markdown内の既存リンクです。本文はそのまま収録しています。</p><ul>'+data.warnings.map(warning=>'<li><code>'+escapeHtml(warning)+'</code></li>').join('')+'</ul>' : '<p>参照先ファイルの不在はありません。</p>'}<h2>変換器</h2><p>${escapeHtml(data.renderer)}。生成時だけ使用し、閲覧時には変換器もNode.jsも不要です。ライセンスは <a class="local-link" href="../Tools/SpecWiki/vendor/LICENSE">同梱LICENSE</a> を参照してください。</p></div>`;
    }
    else if (params.has('page') || params.has('category'))
    {
        title = 'ページが見つかりません';
        content.innerHTML = Header(title,'URLのページ名またはカテゴリが現在の収録内容にありません。','') + '<p><a href="#home">仕様書一覧へ戻る</a></p>';
    }
    else
    {
        content.innerHTML = Header('仕様書一覧','実装の仕組みをたどり、型とデータの関係を確認するためのWikiです。','Hestia Engine',`<span>${data.pages.length}ページ</span><span>${Object.keys(data.diagrams).length}点の補助図解</span><span>オフライン閲覧</span>`) + '<p class="intro-note">実装仕様を中心に、開発ガイドと設計参考資料を分けて収録しています。左のツリーから分野を選ぶか、型名や本文を検索してください。</p>' + data.categories.filter(category => !category.parent).map(root => `<section class="category-section"><div class="category-heading"><h2><a href="${route({category:root.id})}">${escapeHtml(root.title)}</a></h2><span class="count">${allPages(root.id).length}ページ</span></div><p class="category-description">${escapeHtml(root.description)}</p>${CategorySections(root)}</section>`).join('');
    }
    document.title = title + ' | Hestia 仕様書';
    document.querySelectorAll('[aria-current]').forEach(element => { if(sidebar.contains(element)) element.removeAttribute('aria-current'); });
    const currentCategory = page?.category ?? category?.id;
    const selectedSection = page?.sections.find(part => section === part.id || section?.startsWith(part.id+'-'))?.id ?? page?.sections[0]?.id;
    for (const link of sidebar.querySelectorAll('a'))
    {
        const target = new URLSearchParams(link.hash.slice(1));
        if ((page && target.get('page') === page.source && (!page.sections.length || target.get('section') === selectedSection)) || (!page && category && target.get('category') === category.id) || (!page && !category && !isSearch && !params.has('guide') && link.hash==='#home')) link.setAttribute('aria-current','page');
    }
    for(let selected = categories.get(currentCategory);selected;selected=categories.get(selected.parent)) sidebar.querySelector(`details[data-category="${selected.id}"]`).open = true;
    requestAnimationFrame(() => {
        if (section && document.getElementById('section-'+section)) document.getElementById('section-'+section).scrollIntoView();
        else window.scrollTo(0,0);
    });
}

document.getElementById('tree').innerHTML = data.categories.filter(category => !category.parent).map(CategoryTree).join('');
document.getElementById('total-count').textContent = data.pages.length;
document.getElementById('menu-close').addEventListener('click',()=>{SetMenu(false);menuOpen.focus();});
menuOpen.addEventListener('click',()=>SetMenu(true));
overlay.addEventListener('click',()=>{SetMenu(false);menuOpen.focus();});
mobile.addEventListener('change',()=>{SetMenu(false);sidebar.inert=mobile.matches;});
sidebar.inert=mobile.matches;
document.addEventListener('keydown',event=>{
    if(event.key==='Escape' && sidebar.classList.contains('is-open')) {SetMenu(false);menuOpen.focus();}
    if(event.key==='Tab' && mobile.matches && sidebar.classList.contains('is-open'))
    {
        const controls=Array.from(sidebar.querySelectorAll('a,input,button,summary')).filter(element=>element.getClientRects().length && !element.hidden);
        if(event.shiftKey && document.activeElement===controls[0]) {event.preventDefault();controls.at(-1).focus();}
        else if(!event.shiftKey && document.activeElement===controls.at(-1)) {event.preventDefault();controls[0].focus();}
    }
});
let searchTimer;
function UpdateSearch()
{
    const query=search.value.trim();
    const wasSearch=new URLSearchParams(location.hash.slice(1)).has('search');
    history[wasSearch?'replaceState':'pushState'](null,'',route({search:query}));
    Render();
}
search.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(UpdateSearch,120);
});
search.addEventListener('keydown',event=>{
    if(event.key==='Enter')
    {
        clearTimeout(searchTimer);
        UpdateSearch();
        if(mobile.matches){SetMenu(false);main.focus({preventScroll:true});}
    }
});
document.getElementById('search-clear').addEventListener('click',()=>{clearTimeout(searchTimer);location.hash='home';search.value='';search.focus();});
document.addEventListener('click',event=>{
    const link=event.target.closest('a');
    if(link?.classList.contains('skip-link')) {event.preventDefault();main.focus();return;}
    if(link && link.getAttribute('href')?.startsWith('#'))
    {
        clearTimeout(searchTimer);
        if(mobile.matches && sidebar.contains(link)){SetMenu(false);main.focus({preventScroll:true});}
        if(link.hash===location.hash) Render();
    }
    const zoom=event.target.closest('[data-zoom]');
    if(zoom)
    {
        const diagram=data.diagrams[zoom.dataset.zoom];
        document.getElementById('zoom-title').textContent=diagram.title;
        const image=document.getElementById('zoom-image');
        image.alt=diagram.title;
        image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(diagram.svg);
        document.getElementById('zoom-dialog').showModal();
    }
});
document.getElementById('zoom-close').addEventListener('click',()=>document.getElementById('zoom-dialog').close());
addEventListener('hashchange',Render);
Render();
</script>
</body>
