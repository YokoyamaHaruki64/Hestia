<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="asset-title asset-desc">
<title id="asset-title">Assetの名前解決、CPU登録、GPU転送の流れ</title>
<desc id="asset-desc">Texture Loadは名前Cacheを確認し、未登録ならDBとWICデコードを経てCPUに登録する。Meshは手動RegisterでCPU登録する。登録後のGPU転送が失敗してもCPU実体とHandleを保持する。</desc>
<defs><marker id="asset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52675d"/></marker></defs>
<style>text{font-family:'Yu Gothic UI',Meiryo,sans-serif;font-size:15px;fill:#24362d}.box{fill:#fff;stroke:#a8bbb0;stroke-width:1.4}.line{fill:none;stroke:#52675d;stroke-width:1.5;marker-end:url(#asset-arrow)}.small{font-size:13px;fill:#586b60}.label{font-size:17px;font-weight:600}</style>
<text x="28" y="34" class="label">名前によるTextureロード</text>
<rect class="box" x="28" y="57" width="182" height="68" rx="4"/><text x="46" y="97">Load&lt;Texture&gt;</text>
<path class="line" d="M210 91H266"/>
<rect class="box" x="266" y="57" width="230" height="68" rx="4"/><text x="285" y="86">名前Cacheを検索</text><text x="285" y="109" class="small">ASCII英字の大小を同一視</text>
<path class="line" d="M496 91H555"/><text x="507" y="76" class="small">未登録</text>
<rect class="box" x="555" y="57" width="375" height="68" rx="4"/><text x="574" y="86">DB照合 → WICデコード・RGBA8変換</text><text x="574" y="109" class="small">未登録・型不一致・読込失敗なら無効Handle</text>
<path class="line" d="M382 125V175H28"/><text x="143" y="165" class="small">登録済みなら既存Handleを返す</text>
<rect class="box" x="28" y="234" width="251" height="80" rx="4"/><text x="47" y="265">Register&lt;Mesh&gt;</text><text x="47" y="290" class="small">所有権を受け取り妥当性確認</text>
<path class="line" d="M279 274H365"/>
<path class="line" d="M743 125V187H510V234"/>
<rect x="365" y="234" width="288" height="80" rx="4" fill="#eaf2ec" stroke="#8ea99b" stroke-width="1.4"/><text x="386" y="265" class="label">CPU AssetStorageに登録</text><text x="386" y="290" class="small">実体を所有し、Handleを割り当てる</text>
<path class="line" d="M509 314V363"/><text x="523" y="344" class="small">同じindex / generationで対応付け</text>
<rect class="box" x="365" y="363" width="288" height="74" rx="4"/><text x="385" y="393">GraphicsへGPU転送を依頼</text><text x="385" y="417" class="small">Mesh Buffer / Texture Resource</text>
<path class="line" d="M365 401H185V480"/><text x="239" y="386" class="small">成功</text>
<path class="line" d="M653 401H793V480"/><text x="717" y="386" class="small">失敗</text>
<rect class="box" x="28" y="480" width="325" height="65" rx="4"/><text x="48" y="508">CPU Asset + GPU Resource</text><text x="48" y="532" class="small">有効Handleを返す</text>
<rect x="586" y="480" width="344" height="65" rx="4" fill="#f8f3e8" stroke="#c6b486"/><text x="606" y="508">CPU Assetと有効Handleは維持</text><text x="606" y="532" class="small">転送失敗をログ出力。GPU実体は保証しない</text>
<text x="28" y="362" class="small">MeshのファイルLoadは未対応。</text><text x="28" y="384" class="small">Textureの手動Registerは拒否。</text>
</svg>
